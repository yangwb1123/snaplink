# Prod hardening patch (strategic merge over the base Deployment): inject
# backend secrets via env, spread across zones, drain gracefully on termination,
# and make the readiness probe tolerant so a brief shared-store blip can't drain
# the whole fleet at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-server
  labels:
    snaplink.io/topology: multi
spec:
  template:
    spec:
      # Spread replicas across zones AND nodes so a single zone/node loss can't
      # take out quorum (complements the base's soft node anti-affinity).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sso-server
      # Give in-flight authorization_code / token exchanges time to finish
      # after Kubernetes removes the terminating pod from service endpoints.
      terminationGracePeriodSeconds: 40
      containers:
        - name: sso-server
          # Secrets from a Secret via the SSO_<SECTION>__<KEY> env-override
          # mechanism (config/source_env.go) — no ConfigMap fork needed.
          env:
            # Literal values are authoritative env overrides and the admission
            # contract; the API server cannot dereference the ConfigMap.
            - { name: SSO_SERVER__TOPOLOGY__MODE, value: multi }
            - { name: SSO_SERVER__TOPOLOGY__ALLOW_PER_POD_STATE, value: "false" }
            - { name: SSO_OAUTH__BACKEND, value: redis }
            - { name: SSO_IDENTITY__BACKEND, value: postgres }
            - { name: SSO_IDENTITY__SESSION_BACKEND, value: redis }
            - { name: SSO_SECURITY__JTI_REPLAY__BACKEND, value: redis }
            - { name: SSO_CIBA__BACKEND, value: redis }
            - { name: SSO_MFA__CHALLENGE__BACKEND, value: redis }
            - { name: SSO_KEYS__SIGNING__REVOCATION_BACKEND, value: redis }
            - { name: SSO_SELF_SERVICE__IDENTITY_LINK__BACKEND, value: postgres }
            - { name: SSO_SERVER__PAIRWISE_SUBJECTS__BACKEND, value: postgres }
            - { name: SSO_USER_LIFECYCLE__ENABLED, value: "true" }
            - { name: SSO_USER_LIFECYCLE__BACKEND, value: postgres }
            - { name: SSO_OAUTH__REDIS__LOOKUP_HMAC_KEY_FILE, value: /etc/sso/oauth-lookup/current.key }
            - name: SSO_REDIS__PASSWORD
              valueFrom:
                secretKeyRef: { name: sso-server-secrets, key: redis-password }
            - name: SSO_POSTGRES__DSN
              valueFrom:
                secretKeyRef: { name: sso-server-secrets, key: postgres-dsn }
            - name: SSO_CLUSTER__BUS__ETCD_PASSWORD
              valueFrom:
                secretKeyRef: { name: sso-server-secrets, key: etcd-password, optional: true }
          # Tolerant readiness: a transient Redis/DB failover should NOT drain
          # every replica simultaneously (that turns a partial outage into a
          # total one). A higher failureThreshold + longer period gives the
          # backend time to re-resolve before the pod leaves rotation. /livez
          # stays always-200 so kubelet never kill-restarts the fleet mid-blip.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            - name: oauth-lookup
              mountPath: /etc/sso/oauth-lookup
              readOnly: true
      volumes:
        - name: redis-tls
          secret:
            secretName: sso-server-redis-tls
            optional: true
        - name: oauth-lookup
          secret:
            secretName: sso-server-secrets
            items:
              - { key: oauth-lookup-key, path: current.key }
