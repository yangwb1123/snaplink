apiVersion: v1
kind: Service
metadata:
  name: sso-server
  labels:
    app.kubernetes.io/name: sso-server
    app.kubernetes.io/part-of: snaplink-sso
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sso-server
  ports:
    # Browser-facing REST + JWKS + /health. Front this with an
    # Ingress / Gateway (intentionally not in the base — controller
    # choice is opinionated).
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # gRPC back-channel for in-cluster apps that use ssoclient/remote
    # (Authorizer, AuditWriter, Discovery). Headless variant (clusterIP:
    # None) would also work for round-robin load balancing — keep as
    # ClusterIP for the simpler single-VIP case in the base.
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
