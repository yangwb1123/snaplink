worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/openresty.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    log_format gateway_json escape=json
        '{"time":"$time_iso8601","request_id":"$gateway_request_id",'
        '"surface":"$gateway_surface","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","client":"$remote_addr"}';
    access_log /dev/stdout gateway_json;

    map $http_x_forwarded_proto $gateway_proto {
        default $scheme;
        ~*^https$ https;
        ~*^http$ http;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    upstream sso_backend {
        server sso-server.sv-sso.svc.cluster.local:8080;
        keepalive 32;
    }

    include conf.d/*.conf;
}
