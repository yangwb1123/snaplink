server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    set $gateway_request_id "";
    set $gateway_surface "";

    access_by_lua_block {
        require("gateway").access()
    }

    header_filter_by_lua_block {
        require("gateway").headers()
    }

    log_by_lua_block {
        require("gateway").audit()
    }

    location = /_gateway/health {
        content_by_lua_block {
            require("gateway").health()
        }
    }

    location = / {
        root /srv/landing;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /app {
        return 308 /app/;
    }

    # Flutter's web entry files (bootstrap, main.dart.js, service worker) are
    # unversioned URLs whose CONTENT changes on every rebuild; they must
    # revalidate on each load or the browser pins the previous deployment
    # forever. Everything else under /app/ (canvaskit, hashed fonts/assets)
    # stays immutable.
    location = /app/flutter_bootstrap.js {
        alias /srv/console/flutter_bootstrap.js;
        add_header Cache-Control "no-cache";
    }
    location = /app/main.dart.js {
        alias /srv/console/main.dart.js;
        add_header Cache-Control "no-cache";
    }
    location = /app/flutter_service_worker.js {
        alias /srv/console/flutter_service_worker.js;
        add_header Cache-Control "no-cache";
    }
    location = /app/index.html {
        alias /srv/console/index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /app/ {
        alias /srv/console/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(admin|login|portal|developer|setup|device)(/.*)?$ {
        root /srv/console;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /docs {
        return 308 /docs/;
    }

    location ^~ /docs/ {
        alias /srv/docs/;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /sample {
        return 308 /sample/;
    }

    location ^~ /sample/ {
        alias /srv/sample/;
        index index.html;
    }

    location = /example {
        return 308 /sample/;
    }

    location ~ ^/example/(.*)$ {
        return 308 /sample/$1;
    }

    location = /api {
        return 308 /api/;
    }

    location = /auth/login {
        access_by_lua_block {
            require("gateway").login_access()
        }
        include conf.d/proxy.inc;
    }

    # The sso-server mounts its whole REST surface under /api/v1
    # (core.PathAPIPrefix) and the admin contract is same-origin
    # /api/v1/admin/*; the prefix must reach the backend untouched.
    location ^~ /api/ {
        include conf.d/proxy.inc;
    }

    location / {
        include conf.d/proxy.inc;
    }
}
