server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    set $gateway_request_id "";
    set $gateway_surface "";

    access_by_lua_block {
        require("gateway").access()
    }

    header_filter_by_lua_block {
        require("gateway").headers()
    }

    log_by_lua_block {
        require("gateway").audit()
    }

    location = /_gateway/health {
        content_by_lua_block {
            require("gateway").health()
        }
    }

    location = / {
        root /srv/landing;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /app {
        return 308 /app/;
    }

    location ^~ /app/ {
        alias /srv/console/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(admin|login|portal|developer|setup|device)(/.*)?$ {
        root /srv/console;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /docs {
        return 308 /docs/;
    }

    location ^~ /docs/ {
        alias /srv/docs/;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /sample {
        return 308 /sample/;
    }

    location ^~ /sample/ {
        alias /srv/sample/;
        index index.html;
    }

    location = /example {
        return 308 /sample/;
    }

    location ~ ^/example/(.*)$ {
        return 308 /sample/$1;
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        include conf.d/proxy.inc;
    }

    location / {
        include conf.d/proxy.inc;
    }
}
