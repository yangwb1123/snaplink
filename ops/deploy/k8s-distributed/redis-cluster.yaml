apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: sv-sso
spec:
  serviceName: redis-cluster
  replicas: 3
  selector:
    matchLabels: { app: redis-cluster }
  template:
    metadata:
      labels: { app: redis-cluster }
    spec:
      nodeSelector:
        kubernetes.io/hostname: u1-faex9
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --port
            - "6379"
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "no"
            - --maxmemory-policy
            - noeviction
            # noeviction is an operator hard requirement: evicting a live
            # refresh-family ledger, jti key, or revocation entry is a
            # security regression, not a cache miss. Add --cluster-replicas 1
            # for shard HA (6-node layout).
            - --dir
            - /data
            # The cluster bus announces a StatefulSet DNS name, never a pod IP.
            # Pod IPs change whenever a pod is recreated, and a stale IP in
            # nodes.conf leaves the peers with `disconnected` nodes and pfail
            # slots: writes to those slots then fail with CLUSTERDOWN, which
            # breaks session, refresh-family, and revocation writes and with
            # them the whole login path. The name resolves to the new address.
            # It must be the fully qualified name: pods search with ndots:5, so
            # the short form never resolves and Redis silently falls back to
            # the IP, which is the failure this replaces.
            - --cluster-announce-hostname
            - $(HOSTNAME).redis-cluster.sv-sso.svc.cluster.local
            - --cluster-preferred-endpoint-type
            - hostname
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          ports:
            - { containerPort: 6379, name: client }
            - { containerPort: 16379, name: bus }
          volumeMounts:
            - { name: data, mountPath: /data }
  # One volume claim per pod. nodes.conf IS the cluster: with an emptyDir a
  # recreated pod rejoins with no node id and no slot ownership, and the
  # surviving masters then serve pfail slots until an operator re-seeds the
  # cluster by hand.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: sv-sso
spec:
  clusterIP: None
  selector: { app: redis-cluster }
  ports:
    - { name: client, port: 6379, targetPort: 6379 }
