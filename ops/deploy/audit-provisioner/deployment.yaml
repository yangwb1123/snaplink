apiVersion: apps/v1
kind: Deployment
metadata:
  name: snaplink-audit-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snaplink-audit-provisioner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snaplink-audit-provisioner
        app.kubernetes.io/component: audit-control-plane
    spec:
      serviceAccountName: snaplink-audit-provisioner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provisioner
          image: snaplink/audit-provisioner:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: status
              containerPort: 8092
          envFrom:
            - configMapRef:
                name: snaplink-audit-provisioner-settings
          startupProbe:
            httpGet:
              path: /livez
              port: status
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: status
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: status
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: desired
              mountPath: /etc/snaplink-audit-provisioner/desired
              readOnly: true
            - name: client-secret
              mountPath: /etc/snaplink-audit-provisioner/secret
              readOnly: true
      volumes:
        - name: desired
          configMap:
            name: snaplink-audit-provisioner-desired
            defaultMode: 0444
        - name: client-secret
          secret:
            secretName: snaplink-audit-provisioner
            defaultMode: 0440
            items:
              - key: client-secret
                path: client-secret
