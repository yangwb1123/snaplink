name: snaplink-ha-test

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports:
      - 127.0.0.1:26380:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snaplink
      POSTGRES_USER: snaplink
      POSTGRES_PASSWORD: snaplink-test
    ports:
      - 127.0.0.1:25433:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U snaplink -d snaplink]
      interval: 1s
      timeout: 1s
      retries: 30

  etcd:
    image: quay.io/coreos/etcd:v3.6.4
    command:
      - etcd
      - --name=ha-test
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - 127.0.0.1:22380:2379
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 1s
      timeout: 1s
      retries: 30
