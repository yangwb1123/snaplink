# Per-node Redis Cluster template. requirepass/masterauth are passed on the
# command line (--requirepass $SSO_REDIS_PASSWORD) so the secret is not in this
# committed file. noeviction is mandatory: tokens/sessions must never be evicted
# under memory pressure (correctness over availability for the hot store).
port 6379
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
# protected-mode off is safe ONLY on a private cluster network; auth is enforced
# via requirepass. Do not expose these ports outside the cluster subnet.
protected-mode no
