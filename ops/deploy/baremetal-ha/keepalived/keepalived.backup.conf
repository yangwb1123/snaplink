# keepalived BACKUP (VM2). Identical to master except state + lower priority, so
# it only holds the VIP while the MASTER's HAProxy is down, and returns it on
# recovery. Drops onto the VM running haproxy-b.
vrrp_script chk_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
    fall 2
    rise 2
}

vrrp_instance VI_SSO {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ssoha-vrrp
    }
    virtual_ipaddress {
        10.0.0.100/24
    }
    track_script {
        chk_haproxy
    }
}
