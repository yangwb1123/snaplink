# keepalived MASTER (VM1). Floats the VIP to the BACKUP node when HAProxy here
# dies. This is the "ip漂移". Drops directly onto the VM running haproxy-a.
# Adjust `interface` to the VM's real NIC and the VIP to your subnet.
vrrp_script chk_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
    fall 2
    rise 2
}

vrrp_instance VI_SSO {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ssoha-vrrp
    }
    virtual_ipaddress {
        10.0.0.100/24
    }
    track_script {
        chk_haproxy
    }
}
