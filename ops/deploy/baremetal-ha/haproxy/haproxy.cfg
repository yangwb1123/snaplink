global
    log stdout format raw local0
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# --- Public edge: redirect cleartext and terminate TLS at the trust boundary. ---
frontend sso_http_redirect
    bind *:80
    http-request redirect scheme https code 308

# L7 round-robin, drained on /readyz. The PEM is supplied out-of-repository and
# must contain the certificate chain followed by its private key.
frontend sso_https
    bind *:443 ssl crt /run/secrets/sso-edge.pem alpn h2,http/1.1
    # Strip proxy/mesh/region/mTLS assertions before constructing the canonical
    # first-hop values. This is the security.trusted_proxies contract.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request del-header X-Real-IP
    http-request del-header X-Auth-Client-Id
    http-request del-header X-Auth-Expires
    http-request del-header X-Auth-Roles
    http-request del-header X-Auth-Scopes
    http-request del-header X-Auth-Sub
    http-request del-header X-Auth-Subject
    http-request del-header X-Region
    http-request del-header X-Serving-Region
    http-request del-header X-Client-Cert
    http-request del-header X-Client-Cert-DER
    http-request del-header X-Forwarded-Client-Cert
    http-request del-header X-SSL-Client-Cert
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    http-request set-header X-Real-IP %[src]
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    acl billing_api path_beg -i /api/v1/admin/commerce /api/v1/commerce /api/v1/metering
    acl stripe_checkout path_beg -i /api/v1/checkout/sessions
    acl stripe_webhook path -i /webhooks/stripe
    use_backend stripe_local if stripe_checkout
    use_backend stripe_local if stripe_webhook
    use_backend billing_local if billing_api
    default_backend sso_servers

backend sso_servers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server sso1 sso1:8080 check inter 3s fall 3 rise 2
    server sso2 sso2:8080 check inter 3s fall 3 rise 2
    server sso3 sso3:8080 check inter 3s fall 3 rise 2

# snaplink-billing is deliberately loopback-only. On each edge VM its process
# shares this host namespace, so no plaintext billing socket is network-routable.
backend billing_local
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server billing-local 127.0.0.1:8090 check inter 3s fall 3 rise 2

# The Stripe adapter is a second loopback-only active-active service. Each edge
# routes to its co-located instance and drains it whenever /readyz loses either
# PostgreSQL or JWKS readiness.
backend stripe_local
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    server stripe-local 127.0.0.1:8091 check inter 3s fall 3 rise 2

# --- Postgres: route :5432 to the Patroni LEADER via its REST health check ---
listen pg_leader
    bind *:5432
    mode tcp
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

# --- Postgres: route :5433 to replicas (optional read offload, off by default) ---
listen pg_replicas
    bind *:5433
    mode tcp
    option httpchk GET /replica
    http-check expect status 200
    balance roundrobin
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
