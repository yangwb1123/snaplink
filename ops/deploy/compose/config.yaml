# Minimal sso-server config for the compose dev stack. Real deployments
# layer overrides via:
#
#   * Environment variables on the container (SSO_<UPPER>__<UPPER>...)
#   * Keys under /snaplink/config/* in etcd
#
# See README.md for the etcdctl recipes that demonstrate the override.

server:
  issuer: http://localhost:8080
  base_url: http://localhost:8080
  listen: ":8080"
  session_ttl: 24h
  token_ttl: 1h
  default_token_strategy: jwt
  # B4-4 credential wire hardening (opt-in): the four credential endpoints
  # accept ONLY application/x-www-form-urlencoded; JSON/missing CT -> 415.
  # Every in-tree compose consumer mints form-encoded, so the stack stays
  # green. Other deploy trees (helm/baremetal/k8s) stay default-off — the
  # deploy sweep test pins this as the single flip point.
  require_form_content_type: true

logging:
  level: info

audit:
  enabled: true
  api_enabled: false
  memory_capacity: 1000

# Local-development credential only. Production registers this machine client
# through the SSO control plane and stores its secret outside ConfigMaps.
clients:
  - id: snaplink-console-tenant-a
    secret: checkout-local-only
    name: Tenant A local checkout client
    redirect_uris: []
    allowed_scopes: [billing:checkout:create]
    allowed_authenticators: []
    allowed_resources: [stripe-adapter-api]
    token_strategy: jwt
    active: true
  - id: stripe-tenant-a-adapter
    secret: stripe-billing-local-only
    name: Tenant A local Stripe Billing relay
    redirect_uris: []
    allowed_scopes: [billing:payment:order:read, billing:payment:write]
    allowed_authenticators: []
    allowed_resources: [billing-api]
    token_strategy: jwt
    active: true
  - id: snaplink-billing-quota-relay
    secret: quota-local-only
    name: Billing quota projection relay
    redirect_uris: []
    allowed_scopes: [tenant-quota:projection:write]
    allowed_authenticators: []
    allowed_resources: [snaplink-sso-quota]
    token_strategy: jwt
    active: true

# Global scope registry (scope-matrix-v2, B4-2): the dev stack provisions an
# explicit matrix (the built-in table minus billing:checkout:create, which is
# registered via extra_scopes below) plus the two compose-only dev scopes, so
# every client.allowed_scopes entry above is registered and the stack stays
# 400 invalid_scope-free under the enabled registry. sso-ctl config validate
# fails pre-deploy on any future client scope outside matrix + extra_scopes.
oauth:
  scope_registry:
    enabled: true
    matrix: [admin:read, admin:write, billing:payment:order:read, billing:payment:write,
             metering:write, billing:entitlement:read, audit:event:write, admin:*]
    extra_scopes: [billing:checkout:create, tenant-quota:projection:write]

tenant:
  enabled: true
  resource_quota:
    backend: memory
    projection_ingress:
      enabled: true
      audience: snaplink-sso-quota
      sources:
        - id: billing-quota-tenant-example
          client_id: snaplink-billing-quota-relay
          tenant_id: tenant-example
          source_system: snaplink-billing-quota.YJnQgZ29gnt3CF3TKG-8HZ1HLwSmNkYR9MmjuWPZfNg
          enabled: true
          revision: 1
