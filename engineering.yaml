# Declarative config for the checks/ engineering harness (cli.py + checks/).
#
# This file is the ONLY thing that should differ between projects that reuse
# this harness. Copy cli.py + checks/ + this file into another Go project,
# edit the values below, and the filesize/complexity/architecture/root-policy/
# directory-fanout/coverage/build gates apply to the new project unchanged.
#
# Project-specific checks that don't generalize (checks/invariants.py's OAuth
# security-header assertions, checks/adr_compliance.py's ADR-0003/0004 checks,
# ops/scripts/generate_engineering.py's doc scaffolding) are NOT driven by
# this file — they stay hardcoded to this project on purpose. See
# docs/agent-os/CHECKS_REGISTRY.md for the full split.

project:
  name: snaplink
  module: github.com/yangwb1123/snaplink
  language: go

filesize:
  max_lines: 500
  ignore_patterns:
    - "_test.go"
    - "gen/proto/"
    - ".claude/"
    - "kms/"
    - "redis/"
    - "saml/"
    - "ldap/"
    - "kerberos/"
    - "radius/"
    - "extauthz/"
    - "examples/"
  exemptions: []
  # Legacy files still allowed to exceed the budget. This list shrinks with
  # the exemption backlog and must never be expanded.
  required_exemptions: []

complexity:
  max_cyclomatic: 15
  max_cognitive: 20
  gocyclo_path: "~/go/bin/gocyclo"
  gocognit_path: "~/go/bin/gocognit"
  ignore_pattern: "gen/proto/|_test.go|cmd/|test/|grpcserver/|.claude/|federation/|saml/|kms/|caep/|scim/|ldap/|kerberos/|redis/|extauthz/|radius/|snapshot/|examples/|defaultimpl/sqlite/|bootstrap/|permissions/sqlite/|signingkeys/|audit/sqlite/|migrate/|releases/|compliance/|cors/|connections/|netpolicy/|registry/|tenant/|config/|mfa/|cluster/|anomaly/|middleware/|ratelimit/|metrics/|spi/|admin/|geo/"
  exempt_functions:
    - handleLogin
    - handleToken
    - finishLogin
    - Mount
    - buildOIDCConfiguration
    - verifyJWTClientAssertion
    - verifyJAR
    - projectUserInfoForOIDC
    - handleTokenExchangeGrant
    - handleDeviceSecretExchange
    - handleMFAComplete
    - verifyDPoPProof
    - checkTenantResidency
    - checkTenantNotSuspended
    - MeshAuthorize
    - handleLogout
    - handleCIBATokenGrant
    - handleDeviceTokenGrant
    - handleDeviceCode
    - handleUserInfo
    - handleRefreshTokenGrant
    - resolveLoginRequest
    - computeDiscoverySnapshot
    - fanOutBackchannelLogout
    - handleDeviceVerify
    - HandleSilentRenewal
    - HandleEndSession
    - MaybeSignUserInfo
    - HandleJWKS
    - HandleBackchannelAuth
    - HandlePAR
    - formIntoStruct
    - HandleIntrospect
    - parseClaimsSection
    - HandleRegister
    - Validate
    - Score
    - VerifyCompactJWS
    - matchAttributes
    - Match

architecture:
  # forbidden[a] = [b, c, ...] means package `a` MUST NOT import package `b`/`c`/...
  forbidden:
    core: [oauth, oidc, admin, security, defaultimpl, cmd]
    security: [oauth, oidc, admin, defaultimpl, cmd]
    oauth: [oidc, admin, defaultimpl, cmd]
    oidc: [oauth, admin, defaultimpl, cmd]
    admin: [defaultimpl, cmd]
    defaultimpl: [admin, cmd]
  excluded_dirs:
    - .git
    - .claude
    - gen
    - proto
    - vendor
    - kms
    - redis
    - saml
    - ldap
    - kerberos
    - radius
    - extauthz
    - examples
    - cmd

directory_fanout:
  max_subdirs: 15
  exempt_dirs:
    - .git
    - .claude
    - gen
    - vendor
    - testdata
    - ops
    - kms
    - __pycache__
    - .pytest_cache

root_policy:
  max_files: 15
  allowed_files:
    - README.md
    - LICENSE
    - AGENTS.md
    - CLAUDE.md
    - go.mod
    - go.sum
    - Makefile
    - Taskfile.yml
    - cli.py
    - pyproject.toml
    - Dockerfile
    - .gitignore
    - .editorconfig
    - .golangci.yml
    - .goreleaser.yaml
    - engineering.yaml
  allowed_prefixes:
    - server_
    - options
  banned_patterns:
    - "*_handler.go"
    - "*_service.go"
    - "*_store.go"
    - "*_grant.go"
    - "*_helpers.go"
    - "*_bundle.go"
    - "*_assertion.go"
    - "*_cache.go"
    - "*_rotation.go"
    - "*_revocation.go"
    - "*_aggregation.go"
    - "*_configuration.go"
    - "*_metadata.go"
    - "*_resolution.go"
  banned_files:
    - auth_code_handler.go
    - ciba_handler.go
    - device_code_handler.go
    - token_handler.go
    - token_exchange_handler.go
    - refresh_token_grant.go
    - backchannel_logout.go
    - logout_handler.go
    - userinfo_handler.go
    - discovery_handler.go
    - discovery_cache.go
    - discovery_config.go
    - oidc_configuration.go
    - login_handler.go
    - login_types.go
    - finish_login.go
    - resolve_login_request.go
    - mfa_handler.go
    - handle_signup.go
    - handle_email_change.go
    - handle_password_reset.go
    - handle_data_export.go
    - handle_native_sso.go
    - me_handler.go
    - me_mfa.go
    - me_security.go
    - me_sessions.go
    - handlers_admin.go
    - handlers_b2b.go
    - audit_helpers.go
    - authz_policy_bundle.go
    - dpop.go
    - mtls.go
    - jar_security.go
    - pairwise_client_assertion.go
    - coordinated_key_rotation.go
    - cross_replica_revocation.go
    - invalidation_bus.go
    - tenant_metrics.go
    - tenant_residency.go
    - tenant_residency_grant_gate.go
    - tenant_revoke.go
    - client_store_cache.go
    - federation_handler.go
    - federation_options.go
    - home_realm.go
    - protected_resource_metadata.go
    - logging.go
  exempt_files:
    - interfaces/sso/sso.go
    - interfaces/sso/handler.go
    - interfaces/sso/handlers.go
    - interfaces/sso/server_extensions.go
    - interfaces/sso/mesh_authz.go
    - interfaces/sso/signing_key_aggregation.go
    - storage_health.go
    - interfaces/sso/accessors.go
    - interfaces/sso/aliases.go
    - interfaces/sso/options.go
    - interfaces/sso/options_misc.go
    - interfaces/sso/options_passwd.go
    - interfaces/sso/options_security.go
    - interfaces/sso/server_routes.go
    - interfaces/sso/server_helpers.go
    - interfaces/sso/server_validation.go
    - interfaces/sso/server_health.go
    - types.go
    - consts.go

coverage:
  targets:
    core: 35
    oauth: 20
    oidc: 15
    security: 45
    ".": 10
    defaultimpl: 65

build:
  output_dir: bin
  binaries:
    - name: sso-server
      path: ./cmd/sso-server
    - name: sso-ctl
      path: ./cmd/sso-ctl

skills:
  dir: docs/skills
