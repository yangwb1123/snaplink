# Illustrative context for an OIDC RP-Initiated Logout review.
# Replace unknown deployment/project values; they are not Snaplink defaults.
# Use with: python ai-dev/ai/run-review.py --stage 02 --context ai-dev/ai/examples/oidc-logout-context.yaml

project: "Snaplink SSO"
subsystem: "OIDC RP-Initiated Logout"

files:
  - interfaces/sso/server_userinfo.go
  - interfaces/sso/handlers.go
  - interfaces/sso/server_logout.go
  - interfaces/sso/server_backchannel_logout.go
  - protocols/oidc/handle_end_session.go

rfcs:
  - OpenID Connect Core 1.0 (Section 16 — Security Considerations)
  - OpenID Connect RP-Initiated Logout 1.0
  - OpenID Connect Front-Channel Logout 1.0
  - OpenID Connect Back-Channel Logout 1.0
  - OpenID Connect Session Management 1.0
  - RFC 6749 (OAuth 2.0 — Section 10 Security Considerations)
  - RFC 7519 (JWT)
  - RFC 7636 (PKCE)

architecture_summary: |
  The RP-Initiated Logout flow handles session termination when an RP
  sends the user to the OP's end_session_endpoint. The implementation
  coordinates:
  1. id_token_hint validation (verify the JWT belongs to the current session)
  2. post_logout_redirect_uri validation against registered URIs
  3. Front-channel logout (iframe pings to registered logout URIs)
  4. Back-channel logout (HTTP POST with logout_token to registered endpoints)
  5. Session termination in the session store
  6. Audit logging of the logout event

storage: "(replace with the deployment's actual session, client, and audit stores)"

