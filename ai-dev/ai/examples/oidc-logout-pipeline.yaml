# pi-batch pipeline: run Stage 02 (Security & RFC) then Stage 03 (Distributed)
# on the OIDC RP-Initiated Logout subsystem.
#
# Usage:
#   python ai-dev/pi-batch.py --pipeline ai-dev/ai/examples/oidc-logout-pipeline.yaml
#   python ai-dev/pi-batch.py --pipeline ai-dev/ai/examples/oidc-logout-pipeline.yaml --reuse
#
# This pipeline uses the two-stage pi-batch pipeline feature:
#   Stage A: generates filled prompts from context + templates
#   Stage B: (manual or via run-review.py) sends filled prompts to pi
#
# For full workflow, prefer run-review.py which handles variable substitution.
# This YAML demonstrates the pi-batch pipeline concept for batch execution.

stages:
  - name: security-rfc-review
    from_dir: ai-dev/ai/reviews/oidc-logout/prompts
    suffix: .md
    output_suffix: .out.md
    mode: serial

  - name: distributed-review
    from_outputs: security-rfc-review
    tasks:
      - prompt_template: ai-dev/ai/prompts/03-distributed-review.md
        output: ai-dev/ai/reviews/oidc-logout/stage-03-distributed.out.md
        timeout: 600
