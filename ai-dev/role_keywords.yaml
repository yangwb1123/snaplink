# Role relevance keywords for meta-stage orchestration.
#
# The orchestrator sees the deliverables; before it picks review roles, the
# runner scores every role by keyword overlap against the deliverables and
# injects a "Suggested roles (relevance)" list into the orchestrator prompt.
# This prevents the orchestrator from touring all available roles on every
# iteration: only roles with clear relevance get executed.
#
# Keep entries bilingual (English + Chinese): deliverables may be written
# in either language. Scores: each hit adds 2 points, capped at 10.
