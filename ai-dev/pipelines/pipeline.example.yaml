# Pipeline 设计示例（仅用于 --dry-run）
#
# 当前 runner 不聚合并行角色输出，且 commands 钩子报错后仍以成功状态继续。
# 因此本文件不是可执行开发闭环，也不能提供 build/test/release gate。
#
# 使用方法：
#   python3 ai-dev/pi-batch.py --pipeline ai-dev/pipelines/pipeline.example.yaml --dry-run # 预览

git_commit: false # 默认不提交生成输出；需要时显式传 --git-commit

stages:
  # ═══════════════════════════════════════════════════════════════
  # 阶段 1：需求分析
  # 输入：需求文档（.md）
  # 输出：分析结果（.out.md）
  # ═══════════════════════════════════════════════════════════════
  - name: analyze
    from_dir: docs/requirements
    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 2：技术设计
  # 角色：架构师 + 技术负责人
  # 输入：需求分析
  # 输出：架构设计 + 实现计划
  # ═══════════════════════════════════════════════════════════════
  - name: technical-design
    from_outputs: analyze
    tasks:
      # 架构师：模块设计、接口定义、数据模型
      - role: architect
        prompt_template: ai-dev/prompts/architect.md
        output: docs/results/{input_stem}.arch.md
        model:
        timeout: 600

      # Tech Lead：任务拆解、实施计划
      - role: tech-lead
        prompt_template: ai-dev/prompts/tech_lead.md
        output: docs/results/{input_stem}.plan.md
        model:
        timeout: 600

    mode: parallel
    workers: 2

  # ═══════════════════════════════════════════════════════════════
  # 阶段 3：代码实现
  # 角色：代码实现者
  # 输入：架构设计 + 实现计划
  # 输出：实际代码 + 单元测试
  # ═══════════════════════════════════════════════════════════════
  - name: code-implementation
    from_outputs: technical-design
    tasks:
      - role: implementer
        prompt_template: ai-dev/prompts/code-implementer.md
        output: docs/results/{input_stem}.code.md
        model:
        timeout: 1800 # 代码实现较长时间

    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 4：代码测试 + 质量检查
  # 输入：代码实现
  # 角色：QA Lead 审查测试策略
  # 命令定义仅保留作 runner 修复后的设计输入；当前不会形成失败门禁
  # ═══════════════════════════════════════════════════════════════
  - name: code-testing
    from_outputs: code-implementation
    tasks:
      - role: qa-engineer
        prompt_template: ai-dev/prompts/qa_lead.md
        output: docs/results/{input_stem}.tests.md
        model:
        timeout: 600

    commands:
      - "go build ./..."
      - "go vet ./..."
      - "go test -run 'TestMaintainability_|TestArchitecture_' ."
      - "make ci"
    commands_parallel: false

    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 5：安全审查 + 最终确认
  # 角色：安全工程师 + Tech Lead
  # 输入：代码 + 测试结果
  # 输出：安全审查 + 最终确认
  # ═══════════════════════════════════════════════════════════════
  - name: security-and-final
    from_outputs: code-testing
    tasks:
      - role: security
        prompt_template: ai-dev/prompts/security_engineer.md
        output: docs/results/{input_stem}.security-review.md
        model:
        timeout: 600

      - role: tech-lead
        prompt_template: ai-dev/prompts/tech_lead.md
        output: docs/results/{input_stem}.final-ok.md
        model:
        timeout: 600

    mode: parallel
    workers: 2

  # ═══════════════════════════════════════════════════════════════
  # 阶段 6：可选 git commit
  # 默认不自动提交；审核工作树和生成输出后再显式启用。
  # 可以在命令行覆盖：
  #   --git-commit     强制启用
  #   --no-git-commit  强制禁用
  # ═══════════════════════════════════════════════════════════════
