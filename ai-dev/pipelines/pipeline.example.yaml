# Pipeline 完整工作闭环
#
# 这个 pipeline 实现了一个完整的开发工作单元：
# 需求分析 → 技术设计 → 代码实现 → 测试验证 → 最终确认 + git commit
#
# 使用方法：
#   python3 ai-dev/pi-batch.py --pipeline ai-dev/pipelines/pipeline.example.yaml           # 完整执行
#   python3 ai-dev/pi-batch.py --pipeline ai-dev/pipelines/pipeline.example.yaml --reuse   # 复用已有输出
#   python3 ai-dev/pi-batch.py --pipeline ai-dev/pipelines/pipeline.example.yaml --dry-run # 预览

git_commit: true # 全局启用自动 git commit

stages:
  # ═══════════════════════════════════════════════════════════════
  # 阶段 1：需求分析
  # 输入：需求文档（.md）
  # 输出：分析结果（.out.md）
  # ═══════════════════════════════════════════════════════════════
  - name: analyze
    from_dir: docs/requirements
    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 2：技术设计
  # 角色：架构师 + 技术负责人
  # 输入：需求分析
  # 输出：架构设计 + 实现计划
  # ═══════════════════════════════════════════════════════════════
  - name: technical-design
    from_outputs: analyze
    tasks:
      # 架构师：模块设计、接口定义、数据模型
      - role: architect
        prompt_template: ai-dev/prompts/architect.md
        output: docs/results/{input_stem}.arch.md
        model:
        timeout: 600

      # Tech Lead：任务拆解、实施计划
      - role: tech-lead
        prompt_template: ai-dev/prompts/tech_lead.md
        output: docs/results/{input_stem}.plan.md
        model:
        timeout: 600

    mode: parallel
    workers: 2

  # ═══════════════════════════════════════════════════════════════
  # 阶段 3：代码实现
  # 角色：代码实现者
  # 输入：架构设计 + 实现计划
  # 输出：实际代码 + 单元测试
  # ═══════════════════════════════════════════════════════════════
  - name: code-implementation
    from_outputs: technical-design
    tasks:
      - role: implementer
        prompt_template: ai-dev/prompts/code-implementer.md
        output: docs/results/{input_stem}.code.md
        model:
        timeout: 1800 # 代码实现较长时间

    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 4：代码测试 + 质量检查
  # 输入：代码实现
  # 角色：QA Lead 审查测试策略
  # 命令：go build + go test + cli.py harness
  # ═══════════════════════════════════════════════════════════════
  - name: code-testing
    from_outputs: code-implementation
    tasks:
      - role: qa-engineer
        prompt_template: ai-dev/prompts/qa_lead.md
        output: docs/results/{input_stem}.tests.md
        model:
        timeout: 600

    commands:
      - "echo '=== BUILD ===' && go build ./... 2>&1"
      - "echo '=== TESTS ===' && go test ./... 2>&1"
      - "echo '=== HARNESS ===' && python3 cli.py harness 2>&1 || echo 'harness completed (non-fatal)'"
      - "echo '=== FMT/VET ===' && go vet ./... 2>&1"
    commands_parallel: true # 4 个命令同时跑

    mode: serial

  # ═══════════════════════════════════════════════════════════════
  # 阶段 5：安全审查 + 最终确认
  # 角色：安全工程师 + Tech Lead
  # 输入：代码 + 测试结果
  # 输出：安全审查 + 最终确认
  # ═══════════════════════════════════════════════════════════════
  - name: security-and-final
    from_outputs: code-testing
    tasks:
      - role: security
        prompt_template: ai-dev/prompts/security_engineer.md
        output: docs/results/{input_stem}.security-review.md
        model:
        timeout: 600

      - role: tech-lead
        prompt_template: ai-dev/prompts/tech_lead.md
        output: docs/results/{input_stem}.final-ok.md
        model:
        timeout: 600

    commands:
      # 显示最终状态
      - "echo '=== WORK COMPLETED ===' && date"
      - "echo 'Files produced:' && ls -la docs/results/{input_stem}.* 2>/dev/null || true"
      - "echo 'Git status:' && git status -s | head -20"
      - "echo 'Done!'"

    mode: parallel
    workers: 2

  # ═══════════════════════════════════════════════════════════════
  # 阶段 6：自动 git commit（由全局 git_commit: true 处理）
  # 每个阶段完成后会自动执行 git add + git commit
  # 可以在命令行覆盖：
  #   --git-commit     强制启用
  #   --no-git-commit  强制禁用
  # ═══════════════════════════════════════════════════════════════
