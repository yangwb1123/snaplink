# Dependabot auto-update config — covers all 14 go.mod files across the monorepo.
# Each module gets weekly PRs that bump out-of-date deps; the `gomod` ecosystem
# handles Go module updates via `go get` + `go mod tidy`.
#
# ╔═══════════════════════════════════════════════════════════════════╗
# ║  Adding or removing a go.mod?  Add/remove its entry here.       ║
# ║  Every module must be listed — unlisted go.mod files never get  ║
# ║  automated CVE fix PRs.                                         ║
# ╚═══════════════════════════════════════════════════════════════════╝

version: 2
updates:
  # ── Root module (sso-server, sso-ctl) ──────────────────────────
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - auto-merge

  # ── Nested infrastructure modules ──────────────────────────────
