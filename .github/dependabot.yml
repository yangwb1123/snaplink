version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gomod
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  # ──────────────────────────────────────────────
  # Infrastructure: identity / auth backends
  # ──────────────────────────────────────────────

  - package-ecosystem: gomod
    directory: "/infrastructure/saml"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - saml

