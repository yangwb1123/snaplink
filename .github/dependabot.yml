# Dependabot keeps go modules, GitHub Actions, and the Dockerfile base
# image patched without a human polling Renovate. Grouping rules keep
# the PR firehose at one bundle per ecosystem per week.

version: 2

updates:
  # Go module updates. Grouped so a typical "google.golang.org/* +
  # buf.build/* + go.etcd.io/* minor bump" lands as ONE PR instead of
  # twelve.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
      # Majors come as individual PRs — they may carry breaking changes
      # worth reviewing on their own.

  # GitHub Actions in .github/workflows/. Bumping setup-go / checkout /
  # build-push-action lands here so CI stays on supported versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch, major]

  # Dockerfile base image (golang:1.26-alpine builder + distroless
  # runtime). Security patches in the base image land as a PR
  # automatically.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 3
