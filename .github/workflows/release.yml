# Release workflow. Fires when a `vX.Y.Z` tag is pushed to main.
# GoReleaser publishes signed archives, SBOMs, and the configured GHCR images.
# Tag protection and the release gate are therefore production controls.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # creates the GitHub Release and uploads archives
  id-token: write     # OIDC token for keyless cosign signing
  packages: write     # pushes release images to GHCR
  attestations: write # publishes signed SLSA provenance for release archives
  artifact-metadata: write # creates artifact metadata for attestations

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser's changelog needs full history to diff tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare public SKU release evidence
        shell: bash
        run: |
          evidence_root="${RUNNER_TEMP}/snaplink-profile-release"
          python ops/scripts/profile_release.py prepare \
            --version "${GITHUB_REF_NAME}" \
            --output-root "${evidence_root}" \
            --env-file "${evidence_root}/release.env"
          cat "${evidence_root}/release.env" >> "${GITHUB_ENV}"

      # syft is required for the sboms step in .goreleaser.yaml.
      - uses: anchore/sbom-action/download-syft@v0

      # cosign signs archives and images using the workflow's OIDC identity.
      - uses: sigstore/cosign-installer@v3

      # Docker buildx with the docker-container driver enables multi-platform
      # builds (linux/amd64 + linux/arm64) for the ghcr.io images configured
      # in .goreleaser.yaml dockers block. Without this step goreleaser falls
      # back to the default docker driver which only supports single-platform.
      - uses: docker/setup-buildx-action@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pin to the major; minor bumps within v2 are non-breaking.
          version: "~> v2"
          args: release --clean
        env:
          # GITHUB_TOKEN creates the release, uploads assets, and pushes images.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser writes the SHA-256 subject list after all archives are
      # built. Attest every release subject from that list with GitHub's
      # Sigstore-backed SLSA provenance action; this is intentionally after
      # GoReleaser so the attestation binds the exact published bytes.
      - name: Attest release archives with SLSA provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
