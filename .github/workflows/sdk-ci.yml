# Keep every public SDK on a real verification path. Registry-specific release
# workflows add protected publishing after these same package gates.

name: sdk-ci

on:
  push:
    paths:
      - "sdks/**"
      - "Package.swift"
      - "docs/sdks/typescript/**"
      - "docs/openapi.yaml"
      - "cmd/gensdk/**"
      - "ops/build/sdk-surface.json"
      - "ops/build/sdk-surface.schema.json"
      - "ops/build/sdk-paradigm.json"
      - "ops/build/sdk-paradigm.schema.json"
      - "ops/build/sdk-conformance/**"
      - "ops/build/capabilities.json"
      - "ops/scripts/sdk_surface.py"
      - "ops/scripts/sdk_versions.py"
      - "ops/scripts/sdk_toml.py"
      - "ops/scripts/sdk_schema.py"
      - "ops/scripts/sdk_baseline.py"
      - "ops/scripts/sdk_report.py"
      - "ops/scripts/test_sdk_surface.py"
      - "ops/scripts/test_sdk_versions.py"
      - "ops/scripts/sdk_paradigm.py"
      - "ops/scripts/test_sdk_paradigm.py"
      - "docs/sdk-paradigm.md"
      - "cli.py"
      - "Makefile"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-php-release.yml"
      - "ops/scripts/php_sdk_release.py"
      - "ops/scripts/test_sdk_php_release.py"
      - ".github/workflows/sdk-swift-release.yml"
      - "ops/scripts/swift_sdk_release.py"
      - "ops/scripts/test_sdk_swift_release.py"
      - "ops/scripts/swift_sdk_smoke.py"
      - "ops/scripts/test_sdk_swift_smoke.py"
  pull_request:
    paths:
      - "sdks/**"
      - "Package.swift"
      - "docs/sdks/typescript/**"
      - "docs/openapi.yaml"
      - "cmd/gensdk/**"
      - "ops/build/sdk-surface.json"
      - "ops/build/sdk-surface.schema.json"
      - "ops/build/sdk-paradigm.json"
      - "ops/build/sdk-paradigm.schema.json"
      - "ops/build/sdk-conformance/**"
      - "ops/build/capabilities.json"
      - "ops/scripts/sdk_surface.py"
      - "ops/scripts/sdk_versions.py"
      - "ops/scripts/sdk_toml.py"
      - "ops/scripts/sdk_schema.py"
      - "ops/scripts/sdk_baseline.py"
      - "ops/scripts/sdk_report.py"
      - "ops/scripts/test_sdk_surface.py"
      - "ops/scripts/test_sdk_versions.py"
      - "ops/scripts/sdk_paradigm.py"
      - "ops/scripts/test_sdk_paradigm.py"
      - "docs/sdk-paradigm.md"
      - "cli.py"
      - "Makefile"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-php-release.yml"
      - "ops/scripts/php_sdk_release.py"
      - "ops/scripts/test_sdk_php_release.py"
      - ".github/workflows/sdk-swift-release.yml"
      - "ops/scripts/swift_sdk_release.py"
      - "ops/scripts/test_sdk_swift_release.py"
      - "ops/scripts/swift_sdk_smoke.py"
      - "ops/scripts/test_sdk_swift_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        # sdks/go is its own module, so it is built from inside its directory
        # rather than as a path of the root module.
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Android SDK packages
        # android-actions/setup-android@v3 cannot be used: it installs a package
        # literally named `tools`, and Google's SDK repository no longer
        # publishes one, so the action fails with "Warning: Failed to find
        # package 'tools'" before a single build step runs. The GitHub runner
        # already ships the SDK and cmdline-tools, so install exactly what this
        # build needs and keep accepting licences explicitly.
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager_bin" ]] || sdkmanager_bin="$(command -v sdkmanager)"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$(dirname "$sdkmanager_bin")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Kotlin unit tests, lint, and release build
        # The Keystore instrumentation test is not here. It needs a real
        # emulator, so it depends on nested virtualization that shared runners
        # do not reliably provide, and the emulator action reports a failed boot
        # as a bare "adb could not connect to TCP port 5554" from its teardown.
        # That makes it a poor gate for every push. It runs in
        # .github/workflows/android-instrumentation.yml instead, which covers
        # main and can be dispatched on demand - the same reasoning that keeps
        # bench-gate out of `make ci`.
        run: ./gradlew :snaplink:testDebugUnitTest :snaplink:lintDebug :snaplink:assembleRelease
  swift:
    name: Swift SDK
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep Swift build records outside the worktree
        run: printf 'SWIFT_BUILD_PATH=%s/snaplink-swift\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run Swift package tests from the repository-root manifest
        run: swift test --scratch-path "$SWIFT_BUILD_PATH"
      - name: Build the library under complete strict concurrency
        # The package is actor- and Sendable-based, so a concurrency finding is
        # a defect, not style. Warnings are errors here: Swift 5 language mode
        # only reports strict-concurrency findings as warnings, and under the
        # Swift 6 language mode they would fail the build outright.
        run: swift build --scratch-path "$SWIFT_BUILD_PATH" -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build iOS Simulator package
        run: swift build --scratch-path "$RUNNER_TEMP/swift-simulator" --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
      - name: Build release package
        run: swift build --scratch-path "$SWIFT_BUILD_PATH" -c release
      - name: Install and run the candidate as a SwiftPM dependency
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(python ops/scripts/swift_sdk_release.py version)"
          python ops/scripts/swift_sdk_smoke.py candidate --version "$version" --source-sha "$SOURCE_SHA"

  surface:
    name: SDK surface compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff reads the PR base from this local checkout; it never fetches.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tool-cache interpreter ships no third-party packages, and the SDK
      # surface reader parses docs/openapi.yaml with PyYAML. The root
      # pyproject declares it; install it here so the gate tests the code
      # instead of the runner's Python.
      - name: Install declared Python dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0"
      - name: Test SDK surface tool
        run: python -m unittest discover -s ops/scripts -p 'test_sdk_*.py' -v
      - name: Verify SDK package versions
        run: python cli.py sdk-surface versions
      - name: Validate Swift prerelease version
        run: python ops/scripts/swift_sdk_release.py version
      - name: Verify hand-written SDK-layer paradigm registry
        run: python cli.py sdk-paradigm check
      - name: Compare operation and schema surface with pull request base
        if: github.event_name == 'pull_request'
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: python cli.py sdk-surface diff --baseline-ref "$BASELINE_REF"

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging verifier
        run: python -m pip install --upgrade build
      - name: Run SDK tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir "${RUNNER_TEMP}/snaplink-python-dist"

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run SDK tests
        run: cargo test --locked --all-targets
      - name: Validate crate packaging
        run: cargo package --locked --allow-dirty

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Validate Composer package
        # The manifest version is retained for the repository's per-package version gate.
        run: composer validate --strict --no-check-publish --no-check-version
      - name: Run SDK tests
        run: |
          php tests/hosted_login_test.php
          php tests/preferences_test.php
          php tests/errors_conformance_test.php
          php tests/entitlement_test.php
          php tests/license_file_test.php
      - name: Verify offline Composer path installation
        run: bash tests/package_install_smoke.sh
      - name: Build Composer package archive
        run: composer archive --format=zip --dir="${RUNNER_TEMP}/snaplink-php-dist"

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: bun test *.test.mjs
      - run: npm pack --dry-run
