# Publish the Rust SDK independently from the Go server release. The crates.io
# token belongs in the protected crates-io environment, never in repository
# variables or the source tree.

name: sdk-rust

on:
  push:
    tags: ["sdk-rs-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the crate after the verification gates
        required: true
        default: false
        type: boolean

concurrency:
  group: sdk-rust-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run package tests
        run: cargo test --locked --all-targets

      - name: Validate crate package
        run: cargo package --locked --allow-dirty

      - name: Verify tag matches crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected_tag="sdk-rs-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
            exit 1
          fi

      - name: Fail fast when the registry token is absent
        shell: bash
        # cargo reports "please provide a non-empty token" and exits 101, which
        # says nothing about which secret was missing or where it belongs. The
        # usual cause is a secret added under a different environment name than
        # the one this job declares, which GitHub silently replaces with an
        # empty one. The token is never printed; only its presence is checked.
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty for this job." >&2
            echo "Add a crates.io API token that may publish new crates as an" >&2
            echo "environment secret named CARGO_REGISTRY_TOKEN on the 'crates-io'" >&2
            echo "environment (Settings -> Environments -> crates-io -> Environment" >&2
            echo "secrets), then re-run this workflow. Do not re-tag: the tag is" >&2
            echo "already correct." >&2
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
