# Minimum-viable CI. Runs on every push to main and every PR.
#
# Jobs:
#   * test    — gofmt, go vet, go build, go test -race -count=1 (ROOT module)
#   * modules — build + race-test EACH nested go.mod (kms/*, redis, saml,
#               ldap, kerberos, radius, extauthz). The root `go ... ./...`
#               does NOT descend into them (deliberately no go.work), so
#               without this matrix the riskiest third-party code (SAML
#               XML/DSig, cloud KMS SDKs, gokrb5) would merge green
#               uncompiled. Mirrors `make ci-modules`.
#   * govulncheck — Go's official CVE scanner (golang.org/x/vuln) over the
#               root + every nested module's go.sum. Informational
#               (continue-on-error) so a freshly-published advisory can't
#               wedge unrelated PRs, but it runs as a real, visible job.
#   * proto   — buf lint (always) + buf breaking (PR only, vs base branch)
#   * docker  — `docker build .` smoke (single-arch, no push) so a broken
#               Dockerfile fails CI rather than being discovered when
#               someone runs `make docker` locally
#   * openapi — kin-openapi validate on docs/openapi.yaml so schema
#               typos / orphan refs fail the PR
#
# Intentionally NOT in scope for v1: container image push, multi-arch
# matrix, release-tag automation. Each needs a registry choice and a
# signing story; layer them on once the repo has a remote.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when a new commit lands on the same ref —
# wastes minutes to keep racing yourself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: vet + race + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true


      - name: Install engineering tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install github.com/uudashr/gocognit/cmd/gocognit@latest

      - name: Engineering gates (harness)
        run: make harness
      - name: gofmt
        # Fail loudly on unformatted files. `gofmt -l` prints offenders
        # and exits 0 regardless, so we test the output length ourselves.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: module catalog and profiles
        run: python cli.py modules check

      - name: cold-module profile smoke
        run: python cli.py modules smoke

      - name: compile examples
        # docs/examples/ import the SDK; compile them so API drift is
        # caught before a user tries to follow the quickstart.
        run: go build ./docs/examples/...

      - name: go test (race)
        # -race catches the concurrency bugs single-threaded runs hide.
        # -count=1 disables the test cache so flaky tests can't masquerade
        # as passing.
        run: go test -race -count=1 ./...

      - name: config validate (all 7 config.yaml files)
        # Validates every deploy config.yaml against the server binary's
        # --validate-only flag, catching config drift (missing fields,
        # renamed keys, incompatible backends) before deployment.
        run: make config-validate-all

  modules:
    # Build + race-test every NESTED module. The root `test` job's
    # `go ... ./...` stops at the root module boundary (there is
    # deliberately no go.work — a workspace would merge build lists and
    # surface the vendored SDKs in the core's `go list -m all`), so each
    # submodule has to be entered on its own. Mirrors `make ci-modules`.
    # Matrix-per-module = parallel runs + a per-module red/green signal.
    name: nested modules (build + race)
    runs-on: ubuntu-latest
    strategy:
      # One failing module shouldn't mask the others' results.
      fail-fast: false
      matrix:
        module:
          - infrastructure/kms/awskms
          - infrastructure/kms/gcpkms
          - infrastructure/kms/azurekeyvault
          - infrastructure/kms/pkcs11
          - infrastructure/saml
          - infrastructure/ldap
          - infrastructure/kerberos
          - infrastructure/radius
          - infrastructure/extauthz
          - infrastructure/kafka
          - infrastructure/mqtt
          - cmd/sso-mcp
          - cmd/sso-operator
    steps:
      - uses: actions/checkout@v4

      # kms/pkcs11 binds the C library github.com/miekg/pkcs11 via cgo, so
      # it needs CGO_ENABLED=1 + a C toolchain + libltdl headers even to
      # build (gcc ships on ubuntu-latest; libltdl-dev does not). Install
      # it only for that matrix entry. Every other module is pure-Go and
      # builds with the default CGO_ENABLED.
      - name: install pkcs11 C toolchain
        if: matrix.module == 'infrastructure/kms/pkcs11'
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev

      - uses: actions/setup-go@v5
        with:
          # Each nested module pins its own toolchain; read it from the
          # module's own go.mod so this stays correct if they ever diverge.
          go-version-file: ${{ matrix.module }}/go.mod
          # Cache is keyed on the module's go.sum so the heavy SDK modules
          # (aws/gcp/azure) don't re-download every run.
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go build + race test
        # Matches `make ci-modules`. kms/pkcs11 needs CGO on; the rest are
        # unaffected by exporting it (they have no C imports).
        working-directory: ${{ matrix.module }}
        env:
          CGO_ENABLED: ${{ matrix.module == 'infrastructure/kms/pkcs11' && '1' || '' }}
        run: |
          go build ./...
          go test -race -count=1 ./...

  govulncheck:
    # Go's official vulnerability scanner. Reads each module's go.sum and
    # reports advisories whose vulnerable symbols the code actually reaches
    # (call-graph aware, low false-positive). Run over the root AND every
    # nested module so an advisory in a vendored SDK (saml/KMS/gokrb5) is
    # surfaced too. Informational: continue-on-error keeps a newly-published
    # advisory from blocking unrelated PRs, while still flagging it in the
    # job log + the Checks tab. Promote to a hard gate once the noise floor
    # is understood.
    name: govulncheck (root + modules)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - infrastructure/kms/awskms
          - infrastructure/kms/gcpkms
          - infrastructure/kms/azurekeyvault
          - infrastructure/kms/pkcs11
          - infrastructure/saml
          - infrastructure/ldap
          - infrastructure/kerberos
          - infrastructure/radius
          - infrastructure/extauthz
          - infrastructure/kafka
          - infrastructure/mqtt
          - cmd/sso-mcp
          - cmd/sso-operator
    steps:
      - uses: actions/checkout@v4

      # govulncheck analyzes (does not build C) but kms/pkcs11 imports a
      # cgo package; give it the headers so the load doesn't choke.
      - name: install pkcs11 C toolchain
        if: matrix.module == 'infrastructure/kms/pkcs11'
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: govulncheck
        # @latest tracks the scanner itself (the vuln DB is fetched live at
        # run time regardless). Informational for now — see the job comment.
        continue-on-error: true
        working-directory: ${{ matrix.module }}
        env:
          CGO_ENABLED: ${{ matrix.module == 'kms/pkcs11' && '1' || '' }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gosec:
    # gosec security scanner (CWE-mapped: hardcoded credentials, weak crypto,
    # SQL/command injection, path traversal, unhandled errors in sensitive
    # sinks). Scans the ROOT module AND every nested module (like govulncheck)
    # so an insecure pattern in SAML/XML parsing, LDAP injection, or KMS key
    # handling is surfaced too. Report-only (-no-fail) so a low-confidence
    # false positive can't wedge unrelated PRs. Promote to a hard gate once
    # the finding floor is tuned.
    name: gosec (root + modules)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - infrastructure/kms/awskms
          - infrastructure/kms/gcpkms
          - infrastructure/kms/azurekeyvault
          - infrastructure/kms/pkcs11
          - infrastructure/saml
          - infrastructure/ldap
          - infrastructure/kerberos
          - infrastructure/radius
          - infrastructure/extauthz
          - infrastructure/kafka
          - infrastructure/mqtt
          - cmd/sso-mcp
          - cmd/sso-operator
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -no-fail -fmt sarif -out gosec-${{ matrix.module }}.sarif ./...

      - name: upload sarif to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec-${{ matrix.module }}.sarif
          category: gosec/${{ matrix.module }}

  lint:
    # golangci-lint over the root AND every nested module. Each module has
    # its own .golangci.yml (or inherits root's settings via a symlink).
    # A HARD GATE: the backlog is burned down (the tree is golangci-clean),
    # so new findings fail the PR.
    name: golangci-lint (root + modules)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - infrastructure/kms/awskms
          - infrastructure/kms/gcpkms
          - infrastructure/kms/azurekeyvault
          - infrastructure/kms/pkcs11
          - infrastructure/saml
          - infrastructure/ldap
          - infrastructure/kerberos
          - infrastructure/radius
          - infrastructure/extauthz
          - infrastructure/kafka
          - infrastructure/mqtt
          - cmd/sso-mcp
          - cmd/sso-operator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.0
          working-directory: ${{ matrix.module }}

  proto:
    name: buf lint + breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against the merge-base; we need full
          # history on PRs so the comparison has something to diff against.
          # 0 = unshallow.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          # Pin buf to keep CI signal stable across the buf release
          # cadence. Bump deliberately when buf adds a useful rule.
          version: 1.69.0

      - name: buf lint
        run: buf lint
        working-directory: proto

      - name: buf breaking (PRs only)
        # Skip on push-to-main — nothing to diff against. The base ref
        # for a PR is github.base_ref; resolve via the .git directory.
        if: github.event_name == 'pull_request'
        run: |
          buf breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=proto"
        working-directory: proto

  openapi:
    name: openapi schema validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: validate docs/openapi.yaml
        run: make docs-validate

  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx (with the docker driver, not docker-container) enables the
      # build-push-action's cache + future multi-arch story without a
      # registry login. Single-platform here keeps the run fast.
      - uses: docker/setup-buildx-action@v3

      - name: build (no push)
        uses: docker/build-push-action@v5

  kustomize:
    # Render all Kustomize overlays to catch YAML syntax errors,
    # missing resource references, and config drift between envs.
    name: Kustomize render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install kustomize
        run: |
          curl -sSLO https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz
          tar xzf kustomize_v5.6.0_linux_amd64.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: render dev overlay
        run: kustomize build ops/deploy/kustomize/overlays/dev/ > /dev/null

      - name: render prod overlay
        run: kustomize build ops/deploy/kustomize/overlays/prod/ > /dev/null

      - name: diff dev vs prod
        run: |
          kustomize build ops/deploy/kustomize/overlays/dev/ > /tmp/k8s-dev.yaml
          kustomize build ops/deploy/kustomize/overlays/prod/ > /tmp/k8s-prod.yaml
          diff /tmp/k8s-dev.yaml /tmp/k8s-prod.yaml || echo "INFO: dev/prod differ (expected — overlays diverge)"

  terraform:
    # Validate all Terraform configs to catch HCL syntax errors and
    # provider incompatibilities.
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: terraform init + validate
        working-directory: ops/deploy/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
        with:
          context: .
          push: false
          # GitHub Actions cache backend — survives across runs on the
          # same ref without external infra.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single-arch smoke is enough to catch Dockerfile breakage
          # (missing files, syntax errors, broken go build). Multi-arch
          # matrix lives in a follow-up once we have a push target.
          platforms: linux/amd64
          tags: snaplink/sso-server:ci
