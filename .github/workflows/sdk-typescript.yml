# Publish the browser/API TypeScript SDK independently from the Go server
# release. The protected npm environment should require maintainer approval and
# provide NPM_TOKEN (or an npm trusted publisher configured for this workflow).

name: sdk-typescript

on:
  push:
    tags: ["sdk-ts-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package after the verification gates
        required: true
        default: false
        type: boolean

concurrency:
  group: sdk-typescript-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: docs/sdks/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/sdks/typescript/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set up Bun test runner
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install package dependencies
        run: npm ci

      - name: Type-check package
        run: npm run typecheck

      - name: Build publish artifacts
        run: npm run build

      - name: Run package tests
        run: bun test *.test.mjs

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="sdk-ts-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
