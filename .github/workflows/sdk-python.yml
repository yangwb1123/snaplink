# Publish the installable Python SDK independently from the Go server release.
# Configure a protected pypi environment with PyPI trusted publishing for this
# workflow; the id-token permission is intentionally scoped to this job.

name: sdk-python

on:
  push:
    tags: ["sdk-py-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package after the verification gates
        required: true
        default: false
        type: boolean

concurrency:
  group: sdk-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging verifier
        run: python -m pip install --upgrade build

      - name: Run package tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist --outdir "${RUNNER_TEMP}/snaplink-python-dist"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="sdk-py-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
            exit 1
          fi

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/snaplink-python-dist/
