syntax = "proto3";

// Package admin/v1 — STABLE.
// See docs/adr/ADR-0008-proto-versioning.md for the versioning policy.
// Breaking changes are not permitted in this package without a minimum
// 6-month deprecation window.

package snaplink.admin.v1;

import "google/api/annotations.proto";
import "google/protobuf/wrappers.proto";
import "admin/v1/operations.proto";

option go_package = "github.com/yangwb1123/snaplink/gen/proto/admin/v1;adminv1";

// SnapshotAdminService exports / restores the operator-managed state
// (clients, users, roles, assignments, menus, network policies, plus the
// bootstrap Tracker high-water mark). Every method requires the admin:*
// scope; mutations write audit events.
service SnapshotAdminService {
  rpc Export(ExportSnapshotRequest) returns (ExportSnapshotResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/snapshots"
      body: "*"
    };
  }
  rpc List(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/snapshots" };
  }
  rpc Get(GetSnapshotRequest) returns (GetSnapshotResponse) {
    option (google.api.http) = { get: "/api/v1/admin/snapshots/{id}" };
  }
  rpc Restore(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/snapshots/{id}:restore"
      body: "*"
    };
  }
  rpc Delete(DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {
    option (google.api.http) = { delete: "/api/v1/admin/snapshots/{id}" };
  }
}

// ResourceCategory mirrors snapshot.ResourceCategory as a string. Stays
// a string (not enum) so the wire schema doesn't need bumping when the
// SDK adds a new category.
//
// Known values: clients, users, roles, assignments, menus, netpolicy,
// webauthn_credentials, totp_seeds.

message ExportSnapshotRequest {
  // Categories to omit from the export. Empty = include every wired
  // backend's data.
  repeated string exclude = 1;
  // Optional human-readable node identifier stamped onto the snapshot.
  // Useful when the same operator runs Export across many nodes.
  string source_node_id = 2;
  // Opt into exporting TOTP seeds inside the purpose-separated sealed
  // envelope (totp_seeds category). Unset (default) keeps the artifact
  // free of seed material. Once set, every missing gate (encryption
  // sealer, purpose derivation, seed exporter) fails the export with
  // failed_precondition — an explicit ask never degrades into silent
  // absence.
  bool include_credential_seeds = 3;
}

message ExportSnapshotResponse {
  // The exported snapshot envelope (header + counts; body resources
  // omitted from the wire response — fetch the full body via Get).
  SnapshotMeta meta = 1;
  // Storage key the snapshot was persisted under. Equal to
  // meta.snapshot_id today; reserved as a separate field so future
  // backends with translation layers can return e.g. an S3 object key.
  string stored_as = 2;
}

message ListSnapshotsRequest {
  string page_token = 1;
  int32  page_size  = 2;
}

message ListSnapshotsResponse {
  string next_page_token   = 2;
  int32  total_size        = 3;
  repeated SnapshotMeta items = 1;
}

message GetSnapshotRequest { string id = 1; }
message GetSnapshotResponse {
  SnapshotMeta meta = 1;
  // resources is the raw JSON body of snapshot.Snapshot.Resources,
  // returned as-is so admin UIs can render it without the server
  // having to mirror every SDK type into proto.
  bytes resources_json = 2;
}

message RestoreSnapshotRequest {
  string id = 1;
  // Mode: merge | overwrite | replace. Defaults to merge when empty.
  string mode = 2;
  bool dry_run = 3;
  bool advance_bootstrap = 4;
  // Confirm token — required iff mode = "replace"; must equal the
  // snapshot's own SnapshotID.
  string confirm = 5;
  repeated string exclude = 6;
  // Pre-restore safety snapshot (D1). Tri-state: nil = server default
  // (capture iff mode=replace, non-dry-run, and the source snapshot is not
  // itself a safety artifact); false = explicit opt-out (no capture even in
  // replace mode); true = capture regardless of mode. dry_run always wins —
  // a dry run never captures. The capture is an unredacted full-state
  // export of the destination node persisted as a kind="safety" envelope;
  // it is exempt from retention and must be deleted explicitly via the
  // Delete RPC after the rollback window.
  google.protobuf.BoolValue auto_safety_snapshot = 7;
  // Automatic rollback on failure (D3). Tri-state: nil = false. When true,
  // a FAILED non-dry-run restore re-applies the safety snapshot captured
  // for this run and the RPC fails with a status whose message and details
  // report the rollback (see RestoreReport.rolled_back). Requires
  // auto_safety_snapshot=true (an explicit net — the server default is not
  // enough), a non-safety source snapshot, and dry_run=false; violations
  // fail with failed_precondition before any write. Rollback re-applies the
  // net in replace mode and reverts any concurrent writes made after
  // capture — restore is a maintenance-window operation.
  google.protobuf.BoolValue rollback_on_error = 8;
  // Opt into replaying the artifact's TOTP seed envelope into the wired
  // TOTP store. Unset (default) restores every other category and flags
  // every user found in the envelope on
  // report.mfa_reenrollment_required so lockouts are discovered from the
  // report, not by users.
  bool restore_credential_seeds = 9;
}

message RestoreSnapshotResponse {
  RestoreReport report = 1;
  string operation_id = 2;
  AdminOperation operation = 3;
  // SnapshotID of the safety snapshot captured before this restore
  // (empty when no capture ran — dry-run, explicit opt-out, or a
  // safety-kind source).
  string safety_snapshot_id = 4;
}

message DeleteSnapshotRequest { string id = 1; }
message DeleteSnapshotResponse {}

// SnapshotMeta is the header projection of a Snapshot — enough for List
// rendering without forcing decryption. taken_at_unix is seconds since
// epoch.
message SnapshotMeta {
  string schema_version = 1;
  string snapshot_id = 2;
  int64 taken_at_unix = 3;
  string source_namespace = 4;
  string source_node_id = 5;
  int64 size_bytes = 6;
  string codec = 7;
  string encryption_algorithm = 8;
  // Bootstrap tracker high-water mark recorded in this snapshot's
  // namespace at the moment of export.
  int32 bootstrap_applied_version = 9;
  // Artifact kind: empty = ordinary export, "safety" = pre-restore safety
  // snapshot (retention-exempt; removed by the Delete RPC). Read from the
  // envelope header without decryption.
  string kind = 10;
}

// RestoreReport mirrors snapshot.Report. Counts roll up across resources.
message RestoreReport {
  string mode = 1;
  bool dry_run = 2;
  map<string, CategoryCounts> items = 3;
  BootstrapAdvance bootstrap = 4;
  repeated string errors = 5;
  // True iff a non-dry-run restore completed every phase without error.
  // Dry runs always report false (predictions, not writes). On a failed
  // Phase B the Deleted counts are partial while Inserted/Updated are
  // complete — key on committed, not counts.
  bool committed = 6;
  // True iff a failed restore's safety snapshot was re-applied (D3). Set
  // by the orchestrator; the failing RPC carries it in status details and
  // the operation record's compensations/result_json.
  bool rolled_back = 7;
  // SnapshotID of the safety artifact for this run: the captured net on
  // success, the re-applied net after a rollback.
  string safety_snapshot_id = 8;
  // One entry per client whose secret was regenerated by this restore.
  // The plaintext secret is an RPC-response-only value: operation
  // records and audit events carry client IDs only (see
  // result_json stripping).
  repeated CredentialRecovery credential_recovery = 9;
  // User IDs whose TOTP enrollment could not be restored (opt-out,
  // undecryptable envelope, or import failure) and need re-enrollment.
  // On an undecryptable envelope this conservatively covers every user
  // in the snapshot's users category.
  repeated string mfa_reenrollment_required = 10;
}

// CredentialRecovery names one client whose secret was regenerated by a
// restore, plus the new plaintext (the recovery channel). Never persisted
// to operation records or audit events — client IDs only there.
message CredentialRecovery {
  string client_id = 1;
  string secret = 2;
}

message CategoryCounts {
  int32 inserted = 1;
  int32 updated = 2;
  int32 deleted = 3;
  int32 skipped = 4;
  // Count of clients this restore left in a state where a usable client
  // secret is missing: active clients whose rotation did not run or
  // failed, plus inactive secret-auth clients (flag-on-enable). Dry-run
  // predicts the exact set the real run would leave.
  int32 requires_rotation = 5;
}

message BootstrapAdvance {
  bool attempted = 1;
  int32 from = 2;
  int32 to = 3;
  bool no_op = 4;
  string reason = 5;
}
