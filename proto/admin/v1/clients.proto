syntax = "proto3";

// Package admin/v1 — STABLE.
// See docs/adr/ADR-0008-proto-versioning.md for the versioning policy.
// Breaking changes are not permitted in this package without a minimum
// 6-month deprecation window.

package snaplink.admin.v1;

import "google/api/annotations.proto";

option go_package = "github.com/yangwb1123/snaplink/gen/proto/admin/v1;adminv1";

// ClientAdminService manages registered SSO client applications. Every
// method requires the admin:* scope; mutations write audit events.
service ClientAdminService {
  rpc List(ListClientsRequest) returns (ListClientsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/clients" };
  }
  rpc Get(GetClientRequest) returns (GetClientResponse) {
    option (google.api.http) = { get: "/api/v1/admin/clients/{id}" };
  }
  rpc Create(CreateClientRequest) returns (CreateClientResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/clients"
      body: "client"
    };
  }
  rpc Update(UpdateClientRequest) returns (UpdateClientResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/clients/{client.id}"
      body: "client"
    };
  }
  rpc Delete(DeleteClientRequest) returns (DeleteClientResponse) {
    option (google.api.http) = { delete: "/api/v1/admin/clients/{id}" };
  }
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/clients/{id}/rotate-secret"
      body: "*"
    };
  }
  // Approve and Reject are the developer-app registration review workflow:
  // a client registered with active=false (e.g. via DCR with
  // default_active=false) sits pending until an admin reviews it. Approve
  // flips active to true; Reject deletes the never-activated client
  // outright. Both emit a distinct audit event from the generic Update/
  // Delete so the review action is separately attributable.
  rpc Approve(ApproveClientRequest) returns (ApproveClientResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/clients/{id}/approve"
      body: "*"
    };
  }
  rpc Reject(RejectClientRequest) returns (RejectClientResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/clients/{id}/reject"
      body: "*"
    };
  }
}

// Client mirrors sso.Client. Secret is write-only — the server never echoes
// it back on Get/List responses (the field is cleared); RotateSecret is the
// only RPC that returns a fresh secret.
message Client {
  string id     = 1;
  string secret = 2;
  string name   = 3;
  repeated string redirect_uris          = 4;
  repeated string allowed_scopes         = 5;
  repeated string allowed_authenticators = 6;
  string token_strategy = 7;
  bool   active         = 8;
}

message ListClientsRequest {
  // Opaque cursor from the previous response. Empty on the first page.
  string page_token = 1;
  // Max items per page — server clamps to a system maximum (default 100).
  // 0 means "use the server default".
  int32  page_size  = 2;
  // Sort field: "name", "id", "created_at". Prefix with "-" for descending.
  // Empty means server-defined default order (typically by created_at desc).
  string order_by   = 3;
  // Simple filter expression: "field:value" or "field eq value" (impl-specific).
  // Supported fields: name, active.
  string filter     = 4;
}
message ListClientsResponse {
  // Opaque cursor for the next page. Empty when there are no more results.
  string next_page_token = 2;
  // Approximate total count matching the filter (for UI display).
  int32  total_size      = 3;
  repeated Client clients = 1;
}

message GetClientRequest    { string id = 1; }
message GetClientResponse   { Client client = 1; }

message CreateClientRequest  { Client client = 1; }
message CreateClientResponse { Client client = 1; }

message UpdateClientRequest  { Client client = 1; }
message UpdateClientResponse { Client client = 1; }

message DeleteClientRequest  { string id = 1; }
message DeleteClientResponse {}

message RotateSecretRequest  { string id = 1; }
message RotateSecretResponse { string secret = 1; }

message ApproveClientRequest  { string id = 1; }
message ApproveClientResponse { Client client = 1; }

message RejectClientRequest  {
  string id     = 1;
  // Optional operator-supplied reason, carried into the audit event's
  // metadata (e.g. "redirect_uri not owned by the requester").
  string reason = 2;
}
message RejectClientResponse {}
