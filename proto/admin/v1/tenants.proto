syntax = "proto3";

// Package admin/v1 — STABLE.
// See docs/adr/ADR-0008-proto-versioning.md for the versioning policy.
// Breaking changes are not permitted in this package without a minimum
// 6-month deprecation window.

package snaplink.admin.v1;

import "google/api/annotations.proto";

option go_package = "github.com/snaplink/sso/gen/proto/admin/v1;adminv1";

// TenantAdminService manages multi-tenant routing — Tenants (business
// boundaries) and Domains (hostname -> tenant mappings). Every method
// requires the admin:* scope; mutations write audit events.
//
// SetStatus is split from Update so flipping suspended/active stays
// surgical (no read-modify-write race) and the server can invalidate
// the per-request suspension cache cleanly on the flip.
service TenantAdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/tenants" };
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = { get: "/api/v1/admin/tenants/{id}" };
  }
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenants"
      body: "tenant"
    };
  }
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/tenants/{tenant.id}"
      body: "tenant"
    };
  }
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option (google.api.http) = { delete: "/api/v1/admin/tenants/{id}" };
  }
  rpc SetTenantStatus(SetTenantStatusRequest) returns (SetTenantStatusResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/tenants/{id}:set-status"
      body: "*"
    };
  }

  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/domains" };
  }
  rpc GetDomain(GetDomainRequest) returns (GetDomainResponse) {
    option (google.api.http) = { get: "/api/v1/admin/domains/{hostname}" };
  }
  rpc CreateDomain(CreateDomainRequest) returns (CreateDomainResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/domains"
      body: "domain"
    };
  }
  rpc UpdateDomain(UpdateDomainRequest) returns (UpdateDomainResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/domains/{domain.hostname}"
      body: "domain"
    };
  }
  rpc DeleteDomain(DeleteDomainRequest) returns (DeleteDomainResponse) {
    option (google.api.http) = { delete: "/api/v1/admin/domains/{hostname}" };
  }
}

// Tenant mirrors tenant.Tenant. Status uses the same string values the
// SDK defines ("active", "suspended").
//
// home_region/allowed_regions/enforce_writes are the data-residency
// policy consumed by the multi-region layer. Carried on the Tenant
// message itself so CreateTenant/UpdateTenant (both wrap a Tenant) set
// them and GetTenant/ListTenants read them back without a separate RPC.
// Zero value ("" / empty / false) = unconstrained + fail-open, so
// tenants predating these fields stay wire-compatible.
message Tenant {
  string id     = 1;
  string slug   = 2;
  string name   = 3;
  string status = 4;
  map<string, string> settings = 5;
  string home_region            = 6;
  repeated string allowed_regions = 7;
  bool   enforce_writes         = 8;
}

// Domain mirrors tenant.Domain.
message Domain {
  string hostname           = 1;
  string tenant_id          = 2;
  string default_client_id  = 3;
  bool   is_apex            = 4;
  map<string, string> branding = 5;
}

message ListTenantsRequest {
  string page_token = 1;
  int32  page_size  = 2;
  string order_by   = 3;
  string filter     = 4;
}
message ListTenantsResponse {
  string next_page_token  = 2;
  int32  total_size       = 3;
  repeated Tenant tenants = 1;
}

message GetTenantRequest    { string id = 1; }
message GetTenantResponse   { Tenant tenant = 1; }

message CreateTenantRequest  { Tenant tenant = 1; }
message CreateTenantResponse { Tenant tenant = 1; }

message UpdateTenantRequest  { Tenant tenant = 1; }
message UpdateTenantResponse { Tenant tenant = 1; }

message DeleteTenantRequest  { string id = 1; }
message DeleteTenantResponse {}

message SetTenantStatusRequest {
  string id     = 1;
  string status = 2;
}
message SetTenantStatusResponse { Tenant tenant = 1; }

message ListDomainsRequest {
  string tenant_id  = 1;
  string page_token = 2;
  int32  page_size  = 3;
}
message ListDomainsResponse {
  string next_page_token  = 2;
  int32  total_size       = 3;
  repeated Domain domains = 1;
}

message GetDomainRequest    { string hostname = 1; }
message GetDomainResponse   { Domain domain = 1; }

message CreateDomainRequest  { Domain domain = 1; }
message CreateDomainResponse { Domain domain = 1; }

message UpdateDomainRequest  { Domain domain = 1; }
message UpdateDomainResponse { Domain domain = 1; }

message DeleteDomainRequest  { string hostname = 1; }
message DeleteDomainResponse {}
