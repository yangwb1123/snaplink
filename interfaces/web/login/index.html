<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <div class="logo">
    <img id="brand-logo" alt="" style="display:none; max-height:48px; max-width:180px;">
    <svg id="brand-mark" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="44" height="44" rx="10" fill="var(--brand-primary)"/>
      <path d="M22 10C15.373 10 10 15.373 10 22s5.373 12 12 12 12-5.373 12-12S28.627 10 22 10zm0 5a4 4 0 110 8 4 4 0 010-8zm0 17c-3.315 0-6.26-1.517-8.2-3.9a9.96 9.96 0 0116.4 0C28.26 30.483 25.315 32 22 32z" fill="#fff"/>
    </svg>
  </div>

  <!-- Login view -->
  <div id="view-login" class="view active">
    <h1>Sign in</h1>
    <div id="login-error" class="error-box"></div>
    <!-- Home-realm discovery (B2B): shown when the provider probe resolves the
         org's enterprise connection. Routes to the org IdP instead of password. -->
    <div id="hr-notice" class="hr-notice"></div>
    <form id="login-form" autocomplete="on">
      <div class="field" id="field-provider" style="display:none">
        <label for="provider">Authentication method</label>
        <select id="provider" name="provider">
          <option value="password">Password</option>
        </select>
      </div>
      <div class="field" id="field-username">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" autocomplete="username webauthn" required placeholder="you@example.com">
      </div>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="login-btn">
          <span class="btn-label">Sign in</span>
          <span class="spinner"></span>
        </button>
      </div>
    </form>

    <!-- Self-service entry points. Both endpoints are optional on the backend;
         the submit handlers detect 404 and disclose "not enabled" gracefully. -->
    <div class="self-service">
      <span class="self-service-link" id="forgot-link">Forgot password?</span>
      &nbsp;·&nbsp;
      <span class="self-service-link" id="signup-link">Create an account</span>
    </div>

    <!-- Forgot-password panel (POST /auth/forgot-password). -->
    <div id="forgot-panel" class="panel">
      <h2>Reset your password</h2>
      <div id="forgot-error" class="error-box"></div>
      <div id="forgot-success" class="success-box"></div>
      <form id="forgot-form" autocomplete="on">
        <div class="field">
          <label for="forgot-identifier">Username or email</label>
          <input type="text" id="forgot-identifier" name="identifier" autocomplete="username" required placeholder="you@example.com">
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="forgot-btn">
            <span class="btn-label">Send reset link</span>
            <span class="spinner"></span>
          </button>
        </div>
      </form>
      <a class="back-link" id="forgot-back">Back to sign in</a>
    </div>

    <!-- Signup panel (POST /auth/register). -->
    <div id="signup-panel" class="panel">
      <h2>Create an account</h2>
      <div id="signup-error" class="error-box"></div>
      <form id="signup-form" autocomplete="on">
        <div class="field">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="signup-email">Email <span style="color:#9ca3af;font-weight:400">(optional)</span></label>
          <input type="email" id="signup-email" name="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" autocomplete="new-password" required>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="signup-btn">
            <span class="btn-label">Create account</span>
            <span class="spinner"></span>
          </button>
        </div>
      </form>
      <a class="back-link" id="signup-back">Back to sign in</a>
    </div>
  </div>

  <!-- MFA view -->
  <div id="view-mfa" class="view">
    <h1>Two-factor verification</h1>
    <div id="mfa-error" class="error-box"></div>
    <div id="mfa-methods" class="mfa-methods"></div>
    <div id="mfa-totp-field" class="field" style="display:none">
      <label for="mfa-code">Verification code</label>
      <input type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="8" placeholder="000000">
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="mfa-btn" style="display:none">
        <span class="btn-label">Verify</span>
        <span class="spinner"></span>
      </button>
    </div>
    <a class="back-link" id="mfa-back">Back to sign in</a>
  </div>

  <!-- Consent view -->
  <div id="view-consent" class="view">
    <h1>Authorize access</h1>
    <div id="consent-error" class="error-box"></div>
    <p style="font-size:.9rem;color:#374151;margin-bottom:8px">
      <span class="client-name" id="consent-client"></span> is requesting access to:
    </p>
    <ul class="scope-list" id="consent-scopes"></ul>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="consent-allow-btn">
        <span class="btn-label">Allow access</span>
        <span class="spinner"></span>
      </button>
      <button type="button" class="btn btn-secondary" id="consent-deny-btn">Deny</button>
    </div>
  </div>

  <!-- Success view -->
  <div id="view-success" class="view">
    <h1>Signed in</h1>
    <div class="success-box visible">Authentication successful.</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
