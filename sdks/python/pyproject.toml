[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snaplink-sso"
version = "0.3.0"
description = "Python SDK for the Snaplink OAuth 2.0 and OpenID Connect API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Snaplink contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
snaplink_sso = ["py.typed"]
