# golangci-lint configuration (schema v2).
#
# Requires a golangci-lint built with Go >= 1.26 (the repo's toolchain) — older
# releases' bundled type-checker cannot parse 1.26 source and emit false
# "declared and not used" positives. The CI lint job pins a compatible version.
#
# The default high-value linters (errcheck, govet, ineffassign, staticcheck,
# unused) are enabled, plus misspell + unconvert. The tree is clean against
# this config, so the CI `lint` job is a HARD GATE (new findings fail the PR).
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      # "strat" is a deliberate abbreviation for token strategy, not a typo.
      ignore-rules:
        - strat
  exclusions:
    # Generated protobuf + gateway code is not ours to lint.
    generated: lax
    paths:
      - gen/proto
