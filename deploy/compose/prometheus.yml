# Prometheus config for the compose observability profile. Scrapes
# sso-server's /metrics endpoint every 5s (tight for dev visibility;
# production usually wants 15-30s). Alerts file from deploy/grafana/
# is mounted in at /etc/prometheus/alerts.yaml.

global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: snaplink-sso
    static_configs:
      - targets: ["sso-server:8080"]
        labels:
          service: sso-server
          env: dev
