apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-server
  labels:
    app.kubernetes.io/name: sso-server
    app.kubernetes.io/part-of: snaplink-sso
spec:
  # 2 replicas is the smallest count that survives a single-node drain;
  # bump up once an HPA (left out of the base — too opinionated) or a
  # PodDisruptionBudget is layered on in an overlay.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sso-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sso-server
        app.kubernetes.io/part-of: snaplink-sso
    spec:
      # Distribute replicas across nodes when possible — soft pref so
      # single-node clusters (dev, edge) still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sso-server
                topologyKey: kubernetes.io/hostname

      # Pod-level security. The container hardening below layers on
      # top of these.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: sso-server
          # Replace with your registry + a pinned tag (sha256@... is best)
          # in an overlay. The base intentionally uses :latest so the
          # quickstart works against `docker push` without tagging
          # rituals; production deployments MUST pin.
          image: snaplink/sso-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/sso/config.yaml"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP

          # 12-factor env overrides. Any SSO_<UPPER>__<UPPER>... variable
          # is picked up by config/source_env.go at boot and overrides
          # the matching key in /etc/sso/config.yaml. Uncomment and tune
          # per environment instead of forking the base ConfigMap.
          env:
            # - name: SSO_LOGGING__LEVEL
            #   value: debug
            # - name: SSO_AUDIT__MEMORY_CAPACITY
            #   value: "50000"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 2

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: config
              mountPath: /etc/sso
              readOnly: true
            # The distroless static image has no writable tmp by default;
            # if a feature ever needs /tmp, declare an emptyDir here.

      volumes:
        - name: config
          configMap:
            # Kustomize hashes the generated ConfigMap; the volume
            # reference is rewritten to the hashed name so a config
            # edit triggers a rolling restart.
            name: sso-server-config
