# Base Kustomization for the snaplink/sso server. Apply directly with
# `kubectl apply -k deploy/k8s/` for a quick stand-up, or reference
# this directory from an overlay (deploy/k8s/overlays/{staging,prod})
# that patches image tag, replicas, env vars, and ingress.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: snaplink-sso

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# configMapGenerator hashes config.yaml into the generated name so any
# edit to the file triggers a rolling restart automatically. Adjacent
# volume references in deployment.yaml are rewritten to the hashed
# name; do NOT hand-write `name: sso-server-config-abc123` anywhere.
configMapGenerator:
  - name: sso-server-config
    files:
      - config.yaml

# `labels:` is the post-deprecation replacement for `commonLabels`.
# includeSelectors:false avoids rewriting Deployment .spec.selector,
# which is immutable after creation and would block in-place updates.
labels:
  - pairs:
      app.kubernetes.io/part-of: snaplink-sso
    includeSelectors: false

# An overlay typically adds:
#   images:
#     - name: snaplink/sso-server
#       newName: ghcr.io/<org>/sso-server
#       newTag: v0.1.0
#   replicas:
#     - name: sso-server
#       count: 3
#   patches:
#     - path: ingress.yaml          # bring your own controller
#     - path: hpa.yaml              # autoscaling per env
