# Routes:
#   /auth/*  /token  /userinfo  /logout  /menus/*  /permissions/*  /roles/*
#   /api/*   /.well-known/jwks.json   /health
# All proxy to the Go SSO server on 127.0.0.1:8080 by default. Override with
# the SSO_UPSTREAM env var if you run elsewhere.

upstream sso_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 8443 ssl http2;
    server_name sso.local;

    # Self-signed dev certs — replace for prod.
    ssl_certificate     ssl/dev.crt;
    ssl_certificate_key ssl/dev.key;

    # Stamp X-Network: intranet|public|... on every request before location
    # matching, based on the leftmost trusted XFF / remote_addr and the Host
    # header. Authenticated routes still re-check identity downstream — this
    # header is for routing, response shaping, and audit context, not auth.
    access_by_lua_block {
        require("netpolicy_cache").stamp_header()
    }

    # Public endpoints (no auth) — pass straight through.
    location = /health                  { proxy_pass http://sso_backend; }
    location = /.well-known/jwks.json   { proxy_pass http://sso_backend; }
    location = /auth/login              { include conf.d/proxy_pass.inc; }
    location = /auth/send-code          { include conf.d/proxy_pass.inc; }
    location = /auth/callback           { include conf.d/proxy_pass.inc; }
    location = /token                   { include conf.d/proxy_pass.inc; }
    location = /logout                  { include conf.d/proxy_pass.inc; }

    # Authenticated endpoints — verify JWT locally before proxying.
    location ~ ^/(userinfo|menus/me|permissions/me|roles/me)$ {
        access_by_lua_block {
            require("auth").verify()
        }
        include conf.d/proxy_pass.inc;
    }

    # Admin / audit API — same JWT check; downstream can layer extra RBAC.
    location /api/v1/ {
        access_by_lua_block {
            require("auth").verify()
        }
        include conf.d/proxy_pass.inc;
    }

    # Per-request audit emission.
    log_by_lua_block {
        require("audit").log()
    }
}
