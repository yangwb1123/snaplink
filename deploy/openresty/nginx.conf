# OpenResty front-end for snaplink/sso.
#
# What this config does:
#   * Reverse-proxies /auth/* /token /userinfo /logout /menus/* /permissions/*
#     /roles/* /api/* /.well-known/jwks.json to the upstream Go SSO server.
#   * Verifies EdDSA JWTs *locally* using the SSO server's published JWKS.
#     A 60-second cache avoids re-fetching JWKS on every request.
#   * Calls /permissions/me on first hit per (token, client) and caches the
#     result in a shared dict for 60s — protected routes are gated locally.
#   * Emits a one-line JSON audit event for every request via log_by_lua,
#     including upstream status, latency, and the X-Request-Id / Traceparent
#     that TracingMiddleware on the SSO side echoes back.
#
# Run from this directory:
#   openresty -p . -c nginx.conf
# (use absolute paths if you copy this elsewhere.)

worker_processes auto;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Audit log format: one JSON object per request line. Tail with
    # Filebeat / Vector / Promtail for downstream shipping.
    log_format audit_jsonl escape=none
        '{"request_id":"$http_x_request_id","traceparent":"$http_traceparent",'
        '"method":"$request_method","path":"$request_uri","status":$status,'
        '"latency_ms":$request_time,"client_ip":"$remote_addr",'
        '"user_agent":"$http_user_agent","upstream":"$upstream_addr"}';
    access_log logs/audit.jsonl audit_jsonl;

    # Shared dicts for the Lua caches. Sized for ~10k tokens / 256 services.
    lua_shared_dict jwks_cache 1m;
    lua_shared_dict permission_cache 16m;
    lua_shared_dict netpolicy_cache 1m;   # ~50 policies × ~2KB each
    lua_shared_dict locks 1m;             # used by lua-resty-lock for cache fill

    # Lua module path — points at ./lua/*.lua in this directory.
    lua_package_path "$prefix/lua/?.lua;;";

    # Resolver is required by lua-resty-http when calling upstream by host.
    # Adjust to your network's DNS.
    resolver 127.0.0.11 ipv6=off;

    # Init phase: pre-fetch the JWKS on worker boot so the very first request
    # already has the keys. Failure here is non-fatal — the per-request fetch
    # path will recover.
    init_worker_by_lua_block {
        local jwks = require("jwks_cache")
        local ok, err = jwks.refresh()
        if not ok then
            ngx.log(ngx.WARN, "initial jwks fetch failed: ", err)
        end
        -- Pre-fetch and schedule periodic refresh of network policies. The
        -- policies cache is consulted by access_by_lua to stamp X-Network on
        -- every upstream-bound request.
        local netpolicy = require("netpolicy_cache")
        local _, perr = netpolicy.refresh()
        if perr then
            ngx.log(ngx.WARN, "initial netpolicy fetch failed: ", perr)
        end
        netpolicy.start_refresh_timer()
    }

    include conf.d/*.conf;
}
