# OIDC/FAPI conformance server configuration.
#
# Consumed by the docker-compose harness in this directory: mounted into the
# sso-server container as /etc/sso/conformance.yaml. Tuned for the OIDF
# conformance suite (browser at http://localhost:8180, server container at
# http://sso-server:8080 on the compose network).
#
# Supported test profiles are defined in README.md; only code-based modules
# may be selected (the runtime accepts response_type code + direct-mint
# token; implicit and hybrid OP profiles are NOT claimed).

version: 1

server:
  issuer: http://localhost:8180   # canonical URL the browser reaches
  listen: ":8080"                 # inside the container / compose network
  default_token_strategy: jwt
  http2:
    enabled: true

identity:
  backend: sqlite
  sqlite:
    dsn: "file:/var/lib/sso/sso.db?_journal=WAL"

oauth:
  backend: sqlite

self_service:
  # The conformance suite provisions its test users through the public
  # signup endpoint.
  signup: true
  password:
    backend: sqlite

client_registration:
  # The conformance suite registers its own test clients via RFC 7591.
  # Open registration is acceptable ONLY inside this isolated harness
  # network; never enable it in a production topology.
  enabled: true
  allow_open_registration: true
  default_active: true
  default_token_strategy: jwt

authenticators:
  password:
    enabled: true

oidc:
  response_encryption:
    backend: ""        # JARM/encryption modules are exercised via client JWKS

feature_gates:
  oidc: true
  admin_api: true

logging:
  level: debug
