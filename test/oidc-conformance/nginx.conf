# TLS-terminating reverse proxy in front of the conformance suite.
# The suite refuses non-https requests and inspects X-Forwarded-Proto
# (server.forward-headers-strategy=NATIVE); the official deployment puts
# Apache in front, this harness uses nginx with a self-signed cert.

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    location / {
        proxy_pass http://conformance-suite:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
