# TLS-terminating reverse proxy in front of the server under test (the
# HTTPS issuer topology, --issuer-https). The OIDF suite refuses non-https
# discovery documents and client-management URLs, so the issuer must be
# reachable over https. This proxy terminates the self-signed cert
# (certs/server.crt+key, regenerated by the harness with the sso-issuer
# SAN) and forwards X-Forwarded-Proto so the server's request-derived
# metadata (discovery endpoints, registration_client_uri) advertises https.
#
# Host is forwarded verbatim (sso-issuer:8181) so BaseURL-derived URLs
# match the discovery issuer exactly; X-Forwarded-Port mirrors the
# published host port for tools that consult it.

server {
    listen 443 ssl;
    server_name sso-issuer;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    # Keep the conformance resource endpoint inside the FAPI 2.0 / BCP 195
    # TLS 1.2 recommendation set. nginx's distro defaults may include legacy
    # CBC or static-RSA suites, which would make the harness report a proxy
    # configuration failure rather than an issuer/resource failure.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://sso-server:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8181;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
