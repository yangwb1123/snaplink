# OIDC Conformance Test Suite — docker compose
#
# Runs the OpenID Foundation's conformance test suite against a local
# SSO server instance built from this repository.
#
# Usage:
#   docker compose up -d --build
#   # Open http://localhost:8080 in a browser, create a test plan from the
#   # supported modules in README.md, and point the suite at the server
#   # under test (browser URL http://localhost:8180).
#
# The image is PINNED to a release tag of the official OIDF suite — never
# change it to :latest. Bump deliberately, re-run, and archive the results
# per README.md before updating the tag.
#
# Environment variables in config.env override the defaults below (compose
# interpolates ${VAR:-default} from that file when run with
# `docker compose --env-file config.env up`; the compose file also loads
# config.env directly via env_file for the containers).

services:
  # SSO server under test — built from the local source tree
  sso-server:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: sso-server
    ports:
      - "8180:8080"
    volumes:
      # Bind-mounted so the harness pins the exact server configuration
      # under test. Validate it first with:
      #   docker compose run --rm --no-deps sso-server --validate-only
      #   -grpc-listen "" --config /etc/sso/conformance.yaml
      - ./config.yaml:/etc/sso/conformance.yaml:ro
      # Persistent sqlite state (identity/oauth/password stores) so the
      # DCR-registered suite client + signup admin survive container
      # recreation; 0777 host dir because the distroless runtime is nonroot.
      - ./data:/data
    # gRPC plane disabled: the harness exercises only the HTTP OIDC surface,
    # and the fail-closed gRPC transport preflight (f585545e) refuses a
    # non-loopback plaintext listener without TLS material. Empty
    # -grpc-listen is the listener-disabled branch of that decision.
    command: ["--config", "/etc/sso/conformance.yaml", "-grpc-listen", ""]
    environment:
      # ISSUER_URL is interpolated by compose: unset => the HTTP topology
      # (byte-identical to the committed default), "https://sso-issuer:8181"
      # => the HTTPS issuer topology (run-headless.sh --issuer-https).
      - SSO_SERVER__ISSUER=${ISSUER_URL:-http://sso-issuer:8180}
      - SSO_LOGGING__LEVEL=debug
    healthcheck:
      # distroless runtime has no wget/shell; the image ships the static Go
      # health probe built in the Dockerfile (test/oidc-conformance/healthcheck).
      test: ["CMD", "/healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s
    networks:
      - conformance-net

  # OIDF conformance test suite — official image, pinned release tag
  conformance-suite:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.2.1
    ports:
      # Host 8088 (not 8080) — a local dev box commonly has something on
      # 8080; the suite is reached via CONFORMANCE_SERVER_EXTERNAL_URL.
      # HTTPS is terminated by the nginx proxy below (the suite itself
      # only listens on 8080 and refuses non-https requests).
      - "8088:8080"
    env_file:
      - config.env
    environment:
      # The suite's entrypoint forwards these as -D overrides; empty values
      # would blank the defaults and abort boot. Placeholder credentials are
      # enough to start (the gitlab/google login buttons are unusable in a
      # local harness — plans are created via the API below).
      # The suite's admin login is OIDC: point the "gitlab" registration at
      # the LOCAL server under test (its own discovery), with a client
      # registered via DCR and a signup user whose preferred_username
      # matches the admin group. This makes the whole harness self-contained
      # (no external gitlab/google account).
      - OIDC_GITLAB_CLIENTID=OuGBQD0tOyf4sgWY7Kwu99zm
      - OIDC_GITLAB_SECRET=v8RzbLs4Ml5kLiCVdZ15cTZlu_e9gBrRPZerVVIQ2NM
      - OIDC_GOOGLE_CLIENTID=google-client
      - OIDC_GOOGLE_SECRET=google-secret
      - JAVA_EXTRA_ARGS=-Doidc.gitlab.iss=${ISSUER_URL:-http://sso-issuer:8180}
          -Doidc.admin.issuer=${ISSUER_URL:-http://sso-issuer:8180}
          -Doidc.admin.group=openid-conformance-suite-admins
          -Dspring.security.oauth2.client.provider.gitlab.user-name-attribute=sub
          -Doidc.gitlab.admin-group-indicator-claims={'sub':{'openid-conformance-suite-admins'}} -Dlogging.level.org.springframework.security=DEBUG ${ISSUER_TLS_JVM_ARGS:-}
      - CONFORMANCE_DB_HOST=conformance-db
      - CONFORMANCE_DB_PORT=5432
      - CONFORMANCE_DB_NAME=conformance
      - CONFORMANCE_DB_USER=conformance
      - CONFORMANCE_DB_PASSWORD=conformance
      - CONFORMANCE_SERVER_EXTERNAL_URL=http://localhost:8088
      # Inside the compose network the suite's server-side calls reach the
      # server-under-test directly; the BROWSER reaches it via localhost:8180
      # (the issuer configured in config.yaml).
      - CONFORMANCE_SSO_SERVER=http://sso-server:8080
      - CONFORMANCE_SSO_DISCOVERY=http://sso-server:8080/.well-known/openid-configuration
    # The suite's JVM validates the issuer's self-signed TLS cert; the
    # harness mounts certs/ (gitignored) so the --issuer-https run can
    # install a truststore containing the generated cert via
    # ISSUER_TLS_JVM_ARGS.
    volumes:
      - ./certs:/certs:ro
    extra_hosts:
      # The issuer under test is http://sso-issuer:8180 (HTTP topology) or
      # https://sso-issuer:8181 (HTTPS topology, terminated by the
      # issuer-proxy service). The suite container resolves it via
      # host-gateway to the host, where compose publishes 8180 ->
      # sso-server:8080 and 8181 -> issuer-proxy:443. A real browser would
      # add a hosts entry too; the headless runner uses curl --resolve
      # sso-issuer:<port>:127.0.0.1.
      - "sso-issuer:host-gateway"
    depends_on:
      sso-server:
        condition: service_healthy
      conformance-db:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - conformance-net

  # TLS-terminating reverse proxy in front of the server under test for
  # the HTTPS issuer topology (run-headless.sh --issuer-https). Reuses the
  # same self-signed certs/ pair and nginx pattern as suite-proxy; only
  # started when the issuer-https compose profile is active, so the default
  # HTTP topology starts exactly the services it always did.
  issuer-proxy:
    image: nginx:latest
    profiles: ["issuer-https"]
    ports:
      - "8181:443"
    volumes:
      - ./issuer-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      sso-server:
        condition: service_healthy
    networks:
      - conformance-net

  # TLS-terminating reverse proxy (the suite requires https + proper
  # X-Forwarded-Proto; the official deployment uses Apache in front).
  suite-proxy:
    image: nginx:latest
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      conformance-suite:
        condition: service_started
    networks:
      - conformance-net

  # MongoDB for the conformance suite (Spring Data MongoDB; the suite's
  # hardcoded default connection string is mongodb://mongodb:27017, so the
  # service MUST be named "mongodb" for compose DNS to resolve it).
  mongodb:
    image: mongo:6.0  # the suite sets FCV 6.0; Mongo 8 rejects it
    ports:
      - "27018:27017"
    networks:
      - conformance-net

  # Database for the conformance test suite
  conformance-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=conformance
      - POSTGRES_USER=conformance
      - POSTGRES_PASSWORD=conformance
    # Host mapping 5433 (not 5432) so a local postgres on 5432 does not
    # collide; the suite reaches the DB over the compose network at
    # conformance-db:5432 regardless of this mapping.
    ports:
      - "5433:5432"
    networks:
      - conformance-net

networks:
  conformance-net:
    driver: bridge
