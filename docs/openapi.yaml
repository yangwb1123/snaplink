# OpenAPI 3.0.3 specification for the snaplink/sso HTTP REST surface.
#
# Source of truth for Postman / Insomnia / ReadMe.io / Mintlify /
# Stoplight / swagger-ui — every mainstream third-party API doc platform
# accepts this file directly.
#
# Coverage scope (v1): core auth flow (including upstream IdP
# federation return URL) + self-service endpoints + operational probes
# + OIDC discovery + RP-initiated logout + the WebAuthn (CTAP/FIDO2)
# ceremony + the OAuth /token family (/token, /token/introspect,
# /token/revoke — covers RFC 6749 grants, RFC 8628 device flow, RFC
# 8693 token-exchange, RFC 7662 introspection, RFC 7009 revocation,
# RFC 9449 DPoP, RFC 8705 mTLS binding, RFC 7521/7523 private_key_jwt)
# + Pushed Authorization Requests (/par, RFC 9126) + device-flow
# user-facing endpoints (/device/code, /device/verify, RFC 8628)
# + Dynamic Client Registration (/register, /register/{client_id};
# RFC 7591 + 7592).
# Plus the operator-side surfaces: GET /api/v1/clients/{id} (open),
# the audit query API (/api/v1/audit/events[/{id}], /api/v1/audit/facets), the netpolicy
# CRUD + classify surface (/api/v1/netpolicy/...), and the full admin
# gRPC service surface exposed via grpc-gateway under /api/v1/admin/* —
# Snapshot, Release, Tenant, Domain, Client, User, Token, Permission.
# Coverage scope is now complete for every endpoint cmd/sso-server
# registers in its reference configuration.
#
# Validate locally:    make docs-validate
# Serve swagger-ui:    make docs-serve   (then open http://localhost:8088)

openapi: 3.0.3

info:
  title: snaplink/sso HTTP API
  version: 0.1.0
  description: |
    HTTP REST surface for the snaplink/sso server. Companion to the
    gRPC services in `proto/` (Authorizer, AuditWriter, Discovery,
    SnapshotAdminService, etc.) — operators typically expose this
    HTTP surface to browsers/SPAs and the gRPC surface to in-cluster
    apps.

    JWTs returned by `/auth/login` are signed with Ed25519; verify
    them locally using the JWKS at `/.well-known/jwks.json` (see
    `ssoclient/remote/JWKSCache` for a Go reference implementation).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    name: snaplink/sso maintainers
    url: https://github.com/snaplink/sso

servers:
  - url: http://localhost:8080
    description: Local dev (cmd/sso-server default listen).
  - url: https://{host}
    description: Production deployment behind your TLS terminator.
    variables:
      host:
        default: sso.example.com

tags:
  - name: auth
    description: Login, token issuance, logout, code-based 2FA delivery.
  - name: discovery
    description: Health probe + JWKS + OIDC discovery for offline token verification.
  - name: me
    description: Self-service endpoints scoped to the bearer token's subject.
  - name: userinfo
    description: OpenID-style user profile fetch.
  - name: operational
    description: Kubernetes / load-balancer liveness + readiness probes.
  - name: webauthn
    description: CTAP/FIDO2 registration + login ceremony (four-call begin/finish).
  - name: mesh
    description: |
      Service-mesh data-plane integrations (cluster C1). The ext_authz
      HTTP-mode endpoint is mesh-internal: only the trusted sidecar may
      call it, and the mesh MUST strip client-supplied X-Auth-* at ingress.
  - name: ssf
    description: |
      OpenID Shared Signals (CAEP/SSF) push-delivery receiver — the inbound
      half of Shared Signals. Consumes signed Security Event Tokens from
      CONFIGURED trusted upstream transmitters and revokes local access for
      the precisely-mapped subject. Opt-in; default-off (route unmounted).
  - name: federation
    description: |
      OpenID Federation 1.0 surface. The entity configuration endpoint serves
      the OP's self-signed Entity Statement (iss == sub == issuer, signed by a
      key already in JWKS) so the OP is discoverable as a federation ENTITY.
      The §8 Federation Fetch endpoint (`/fetch`, mounted only when this server
      is configured as a SUPERIOR with ≥1 subordinate) issues SIGNED
      Subordinate Statements (iss == this server, sub == the looked-up
      subordinate, jwks == the subordinate's operator-configured keys) so a
      resolver can climb THROUGH this server. Opt-in; default-off (routes
      unmounted, no `federation_fetch_endpoint` advertised). Trust-chain
      validation is a separate slice.
  - name: scim
    description: |
      SCIM 2.0 (RFC 7643 schema / RFC 7644 protocol) user + group
      provisioning, mounted under `/api/v1/scim/v2`. Composed over the
      existing `core.UserProvider` (no new datastore); SCIM-only
      attributes round-trip through `core.User.Attributes` under a
      `scim:` namespace. Admin-gated by the AdminMiddleware (GET needs
      `admin:read`, POST/PUT/PATCH/DELETE need `admin:write`) — the whole
      surface reads + mutates the user directory. Errors use the SCIM
      `application/scim+json` envelope (RFC 7644 §3.12) with a `scimType`
      code, NOT the OAuth `error` body (see `docs/error-codes.md`). The
      `/Groups` resource is opt-in (`scim.groups.enabled`, requires a
      `permissions.Provider`); `/Users` always mounts.
  - name: admin
    description: |
      Operator-side REST surface. Admin endpoints are gated by the
      AdminMiddleware (Bearer-validated, scoped to `admin:read` /
      `admin:write`). Open SDK-internal counterparts exist on the
      gRPC layer too — `grpcserver/admin_*.go`.

paths:

  /health:
    get:
      tags: [discovery]
      summary: Liveness + identity probe.
      description: |
        Returns 200 with the issuer name as long as the process is
        running. Used by Kubernetes liveness / readiness probes and by
        load balancers as a cheap "is this instance alive" check.
      operationId: getHealth
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /.well-known/jwks.json:
    get:
      tags: [discovery]
      summary: JSON Web Key Set for local JWT verification.
      description: |
        Public keys for every registered `TokenIssuer` that implements
        `JWKSProvider`. Cache for at most `Cache-Control: max-age`
        seconds; refresh sooner when a token carries an unknown `kid`
        (see `remote.JWKSCache` for the single-flight refetch pattern).
      operationId: getJWKS
      responses:
        "200":
          description: Active signing keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate and receive a token.
      description: |
        Two-mode endpoint:

        * **Discovery** (omit `provider`): returns the list of
          authenticator names this client may use. Useful for SPAs
          rendering a "Log in with…" picker.

        * **Authenticate** (set `provider`): runs the named
          authenticator's `Authenticate` step. Success returns an
          access token + session id. The token's strategy
          (`jwt` / `session`) is determined by the client's
          `token_strategy` field in config.
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              passwordLogin:
                summary: Password login for client "web-app".
                value:
                  provider: password
                  client_id: web-app
                  credential:
                    username: alice
                    password: "s3cret!"
              discovery:
                summary: Discover available providers for "web-app".
                value:
                  client_id: web-app
      responses:
        "200":
          description: |
            One of three shapes:
            - `LoginResponse` — credentials accepted, tokens minted.
            - `LoginDiscoveryResponse` — `provider` was omitted; the
              server returns the providers this client may use.
            - `MFARequiredResponse` — credentials accepted but the
              configured RiskScorer demanded a step-up factor.
              `mfa_challenge_id` + `mfa_methods` direct the client
              to POST `/auth/mfa` next.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/LoginDiscoveryResponse"
                  - $ref: "#/components/schemas/MFARequiredResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Credentials rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Client inactive / tenant mismatch / authenticator not allowed /
            data-residency violation (`region_not_allowed` when the serving
            region is outside the tenant's allowed set, `residency_violation`
            when a write would leave the home region under enforced writes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mfa:
    post:
      tags: [auth]
      summary: Complete an MFA step-up challenge.
      description: |
        Second leg of the MFA orchestration flow. When `/auth/login`
        succeeds against the primary credential but the configured
        RiskScorer returns `require_mfa` AND `WithMFAProvider` +
        `WithMFAChallengeStore` are wired, the login response carries
        `error: mfa_required`, `mfa_challenge_id`, and `mfa_methods`
        instead of tokens.

        The client picks one of the offered methods and POSTs it here.
        On success the server replays the original login flow and
        returns the standard direct-mint (or auth_code, or form_post)
        response — the caller can't distinguish an MFA-gated login
        from a non-gated one except by the extra round trip.

        **Oracle-leak hardening**: every failure path (unknown /
        expired / already-consumed challenge, unsupported method,
        wrong factor) collapses to one wire response (`400` +
        `error: mfa_invalid`) so probes can't enumerate the cases.
        Operator-side detail rides on the `mfa_failure` audit event
        only.

        **Single-use**: a successful `/auth/mfa` atomically deletes
        the challenge. Replaying the same `mfa_challenge_id` returns
        `mfa_invalid`.

        Returns 404 when MFA is not configured on this deployment
        (same shape as `mfa_invalid` body — probes can't fingerprint
        the capability).
      operationId: postMFAComplete
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MFACompleteRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/MFACompleteRequest"
      responses:
        "200":
          description: |
            Factor verified; the response body is the same shape
            `/auth/login` would have returned without MFA gating
            (direct-mint tokens, or `code` for response_type=code,
            or HTML for response_mode=form_post).
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: |
            mfa_invalid. Unknown / expired / consumed challenge,
            unsupported method, wrong factor, or malformed body —
            all collapsed to the same wire shape.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Client became inactive (or tenant suspended) between
            challenge issue and completion. Distinguished from
            mfa_invalid so operators triaging audit can tell it
            wasn't the factor that failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MFA not configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/send-code:
    post:
      tags: [auth]
      summary: Send a one-time code for the named authenticator.
      description: |
        Triggers code delivery for authenticators that implement
        `CodeSender` (phone, email). The follow-up call to
        `/auth/login` carries the delivered code as
        `credential.code`.
      operationId: postSendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
            examples:
              phoneCode:
                value: { provider: phone, target: "+15551234567" }
              emailCode:
                value: { provider: email, target: "user@example.com" }
      responses:
        "200":
          description: Code sent. Body is empty / minimal.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Delivery failed (downstream SMS / email error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      tags: [auth]
      summary: Self-service signup (opt-in, default-off).
      description: |
        Creates a new account and sets its password (reusing the UserProvider +
        PasswordCredentialStore). Distinct from `/register` (RFC 7591 Dynamic
        CLIENT Registration). DEFAULT-OFF and rate-limited — open signup is an
        abuse surface most enterprise deployments don't want (they provision via
        SCIM/admin); enable deliberately for B2C and front with CAPTCHA /
        domain-allowlist / email verification as needed. Never overwrites an
        existing account (409 on a taken username). `Cache-Control: no-store`.
      operationId: selfRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                email: { type: string, format: email }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: created }
                  user_id: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: account_exists (username taken).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Begin an unauthenticated password reset.
      description: |
        Resolves the identifier to a user, mints a single-use reset token, and
        delivers it out-of-band (email/SMS). ANTI-ENUMERATION: ALWAYS returns
        200 `{status:"sent"}` — an unknown identifier, a user with no delivery
        address, and a delivery failure are indistinguishable on the wire (the
        cause is only in the server log + audit `delivery_ok`). The token is
        never returned. Mounted only when a reset-token store + credential store
        are wired. `Cache-Control: no-store`.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, description: Username or email the user logs in with. }
      responses:
        "200":
          description: Always returned (whether or not the account exists).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: sent }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Complete a password reset with a token.
      description: |
        Consumes the single-use reset token (before setting the password, so a
        race/failure can't replay it), sets the new password, and best-effort
        revokes the user's existing sessions. Oracle-safe: unknown / expired /
        consumed token, user gone, and set-password errors ALL collapse to one
        `reset_invalid` (400, never 500). `Cache-Control: no-store`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "400":
          description: reset_invalid (any failure — oracle-safe).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/home-realm:
    post:
      tags: [auth]
      summary: B2B home-realm discovery — resolve an email domain to its IdP.
      description: |
        Maps a login identifier (email or bare domain) to the enterprise
        connection serving that domain, so a B2B login UI can route the user to
        their organization's upstream IdP. Accepts `login_hint` (or `identifier`)
        as a query param, form field, or JSON body; GET is also accepted. A miss
        returns `{"found": false}` — a routing decision (which IdP), NOT a
        credential oracle (it never reveals whether an account exists). The
        response carries only non-secret routing metadata. Mounted only when an
        enterprise-connection store is configured (`connections.enabled`); a
        build/config without it does not expose this endpoint.
      operationId: homeRealmDiscovery
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                login_hint: { type: string, example: "user@acme.com" }
                identifier: { type: string }
      responses:
        "200":
          description: Routing decision (found or not).
          content:
            application/json:
              schema:
                type: object
                properties:
                  found: { type: boolean }
                  connection_id: { type: string }
                  type: { type: string, enum: [oidc, saml] }
                  tenant_id: { type: string }
                  display_name: { type: string }

  /auth/callback:
    get:
      tags: [auth]
      summary: Upstream IdP federation return URL.
      description: |
        Where upstream OIDC / OAuth 2.0 providers (Google, Microsoft,
        GitHub, Auth0, Keycloak, ...) redirect after a federated login
        kicked off by `/auth/login?provider=<name>`. This endpoint
        finishes the redirect leg of the upstream flow: it pops the
        per-provider `state`, exchanges `code` for tokens at the
        upstream IdP, materializes a local `User` via `UserProvider`,
        and mints a single-use `session_id` the SPA can carry into
        subsequent calls.

        The `provider` query is optional — when omitted, every wired
        `oidc_federation` authenticator is tried in registration order
        until one accepts the `(code, state)` pair. Missing or
        unparseable `code` / `state` returns `400 invalid_callback`;
        an unknown / mismatched `state` collapses to
        `401 callback_failed` to keep state-binding probes from
        leaking which provider issued the original kickoff (one of the
        oracle-leak hardening rules in AGENTS.md).
      operationId: getAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
          description: Authorization code returned by the upstream IdP.
        - name: state
          in: query
          required: true
          schema: { type: string }
          description: Opaque CSRF binding minted at `/auth/login` kickoff.
        - name: provider
          in: query
          required: false
          schema: { type: string }
          description: |
            Federation provider name (matches the `provider:` value in
            the cmd `authenticators.oidc_federation[]` block). When
            omitted, every wired federation authenticator is probed.
      responses:
        "200":
          description: Federation succeeded; session minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResponse"
        "400":
          description: Missing / malformed `code` or `state`, or unknown provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Upstream exchange or state validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Local session storage failed after upstream succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /token:
    post:
      tags: [auth]
      summary: OAuth 2.0 token endpoint (RFC 6749 §3.2).
      description: |
        Mints / refreshes / exchanges tokens. The same endpoint
        dispatches across every grant type the server supports:

        | grant_type | RFC | Required body fields |
        |------------|-----|----------------------|
        | `authorization_code` | RFC 6749 §4.1.3 | `code`, `redirect_uri` (when registered at issuance), `code_verifier` (when PKCE was used at /auth/login) |
        | `refresh_token` | RFC 6749 §6 | `refresh_token` |
        | `client_credentials` | RFC 6749 §4.4 | (none beyond client auth) |
        | `urn:ietf:params:oauth:grant-type:device_code` | RFC 8628 §3.4 | `device_code` |
        | `urn:ietf:params:oauth:grant-type:token-exchange` | RFC 8693 §2 | `subject_token`, `subject_token_type` (+ optional `actor_token`/`actor_token_type`, `audience`, `requested_token_type`, `acr_values`) |

        **Client authentication** — per RFC 6749 §2.3.1, `Authorization:
        Basic <base64(client_id:client_secret)>` beats body
        `client_id` / `client_secret`. RFC 7521 + 7523 `private_key_jwt`
        is accepted via `client_assertion` + `client_assertion_type =
        urn:ietf:params:oauth:client-assertion-type:jwt-bearer` for
        clients whose `Client.JWKS` is registered. Public clients
        authenticate with `client_id` only (PKCE-bound). RFC 8705 mTLS
        is accepted when `WithClientCertExtractor` is wired (cert
        thumbprint binds the issued token via `cnf.x5t#S256`).

        **DPoP** (RFC 9449) — supply `DPoP: <proof>` header to bind the
        issued access token to a sender-constrained key. Server may
        respond `400 use_dpop_nonce` (with `DPoP-Nonce` header) when
        §8 nonce enforcement is wired; clients retry with the nonce
        echoed in their next proof.

        **Resource indicators** (RFC 8707) — repeat `resource=<uri>`
        per requested audience. Allowed values come from
        `Client.AllowedResources`; mismatches return
        `invalid_target`.

        **Form + JSON** — both `application/x-www-form-urlencoded`
        (RFC 6749 mandatory) and `application/json` are accepted via
        the dispatcher in `oauth_bind.go`. Repeated form keys form
        the `resource` / `audience` lists; the JSON shape uses arrays.

        Successful responses ALWAYS carry `Cache-Control: no-store`
        and `Pragma: no-cache` per RFC 6749 §5.1 — apply on the
        client side too, otherwise an intermediary cache may serve
        the response cross-user.

        **Oracle-leak hardening** — unknown / expired / consumed /
        client-mismatch code or refresh-token failures all collapse
        to a single `400 invalid_grant` response so an attacker
        polling can't distinguish failure modes.
      operationId: postToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              authorizationCode:
                value:
                  grant_type: authorization_code
                  code: ac_xJzq...
                  redirect_uri: https://app.example.com/cb
                  code_verifier: V3rifi3rRaw...
                  client_id: my-app
              refreshToken:
                value:
                  grant_type: refresh_token
                  refresh_token: rt_xJzq...
                  client_id: my-app
              clientCredentials:
                value:
                  grant_type: client_credentials
                  client_id: svc-id
                  client_secret: svc-secret
                  scope: items:read
              deviceCode:
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  device_code: dc_xJzq...
                  client_id: kiosk-app
              tokenExchange:
                value:
                  grant_type: urn:ietf:params:oauth:grant-type:token-exchange
                  subject_token: eyJhbGciOiJFZERTQSI...
                  subject_token_type: urn:ietf:params:oauth:token-type:access_token
                  audience: [https://downstream-api.example.com]
                  requested_token_type: urn:ietf:params:oauth:token-type:access_token
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Issued / refreshed / exchanged token.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
            Pragma:
              schema: { type: string, example: no-cache }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenIssuance"
        "400":
          description: |
            Grant-specific failure — `invalid_request`,
            `invalid_grant`, `invalid_target`, `invalid_dpop_proof`,
            `use_dpop_nonce`. Body shape is the standard
            ErrorResponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            Client authentication failed — wrong `client_id` /
            `client_secret`, missing / bad `client_assertion`,
            unknown registered client. Wire code: `invalid_client`
            (RFC 6749 §5.2 — one code for every client-auth failure, so
            the response never reveals which `client_id`s exist).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Client allowed but tenant binding rejected the request
            (the resolved tenant ≠ `Client.TenantID`). Wire code:
            `tenant_mismatch`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Grant requested but the corresponding store / option
            isn't wired (e.g. `authorization_code` without
            `WithAuthCodeStore`). Wire codes:
            `authorization_code_not_configured`,
            `device_code_not_configured`, etc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /token/introspect:
    post:
      tags: [auth]
      summary: OAuth 2.0 token introspection (RFC 7662).
      description: |
        Resource servers query token state here when local JWT
        validation isn't enough (e.g. revocation check, opaque
        session tokens). RFC 7662 §2.2 — an inactive token returns
        `{"active": false}` and nothing else; presence of any other
        field on the response implies the token was valid at the
        moment of introspection.

        Client authentication follows the same rules as /token:
        Basic > body > private_key_jwt. Caller MUST be a registered
        client; anonymous introspection is intentionally not
        supported.
      operationId: postIntrospect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/IntrospectRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/IntrospectRequest"
      responses:
        "200":
          description: |
            Introspection succeeded. `active: false` means revoked /
            expired / never-issued (RFC 7662 §2.2 — same wire shape
            for all three so callers can't enumerate token state).
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectResponse"
        "401":
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /token/revoke:
    post:
      tags: [auth]
      summary: OAuth 2.0 token revocation (RFC 7009).
      description: |
        Marks the named token consumed. The server returns 200
        regardless of whether the token existed (RFC 7009 §2.2 —
        prevents an attacker from probing which tokens are valid by
        observing the 200/404 split). The optional `token_type_hint`
        lets the server short-circuit the lookup (`access_token` →
        the JWT/session store; `refresh_token` → the refresh store).

        Revoking a refresh token also kills its rotation family
        when `RefreshTokenFamilyTracker` is wired (OAuth Security
        BCP §4.14): every prior + future refresh derived from the
        same auth event is invalidated atomically.
      operationId: postRevoke
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: Revocation accepted (token may or may not have existed).
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
        "401":
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /token/revoke-all:
    post:
      tags: [auth]
      summary: Bulk revoke every refresh token bound to the bearer's subject.
      description: |
        "Sign out of all devices" — given a valid bearer access token,
        kills every refresh token bound to the same (subject, client_id)
        pair, then revokes the presented access token across all issuers
        so it stops working immediately.

        Authentication is **bearer-only** (unlike /token/revoke which
        accepts client credentials). The actor is the user — they are
        authorizing the revocation of their own tokens. The client_id
        for the bulk delete is read from the bearer's `aud` claim;
        pairwise subjects are translated to local before the lookup
        (OIDC §8) so the bulk delete actually finds the rows.

        Requires the wired `RefreshTokenStore` to implement the optional
        `RefreshTokenSubjectIndex` extension. Without it the response
        is `501 refresh_token_not_configured` — operators relying on
        this endpoint must wire a store that supports bulk lookup
        (SQLite + memory both do; custom backends opt in).
      operationId: postRevokeAll
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bulk revocation succeeded; count returned.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  refresh_tokens_revoked:
                    type: integer
                    description: Number of refresh tokens deleted.
                    example: 3
        "401":
          description: |
            Missing or invalid bearer. WWW-Authenticate carries the
            Bearer challenge per RFC 6750 §3.
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Bearer realm="sso", error="invalid_token"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Pairwise resolution or bulk delete failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Wired RefreshTokenStore doesn't implement
            RefreshTokenSubjectIndex; bulk delete is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /par:
    post:
      tags: [auth]
      summary: Pushed Authorization Request (RFC 9126).
      description: |
        Confidential clients POST their full authorization request
        parameters here BEFORE redirecting the user agent, getting
        back an opaque `request_uri` to pass to /auth/login. The
        pre-registration pattern (1) authenticates the client
        upstream of the redirect, (2) removes long auth-request
        URLs from browser logs / proxies, (3) prevents tampering —
        nothing beyond client_id + request_uri can be modified
        without invalidating the lookup.

        Client auth follows the same rules as /token: HTTP Basic >
        body > private_key_jwt. PAR rejections happen at PAR time
        rather than at the redirect (the whole point of the
        pattern) — invalid_redirect_uri / invalid_target /
        invalid_authorization_details / invalid_request all surface
        as 400 here.

        When a client has `Client.RequirePAR: true`, direct
        /auth/login calls without request_uri are rejected with
        `invalid_request`. Combine with private_key_jwt for FAPI
        2.0-grade confidentiality.
      operationId: postPAR
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PARRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/PARRequest"
      responses:
        "201":
          description: PAR succeeded; request_uri minted.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PARResponse"
        "400":
          description: |
            invalid_request / invalid_redirect_uri / invalid_target
            / invalid_authorization_details — the parameter the
            spec mandates for each respective rejection class.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Client authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Client inactive or tenant mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            PAR store not wired — operator hasn't called
            `WithPARStore`. Wire code: `par_not_configured`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /device/code:
    post:
      tags: [auth]
      summary: Device-flow initiation (RFC 8628 §3.1).
      description: |
        The device POSTs its client_id (+ optional scope/resource).
        Server returns a long-lived `device_code` (the device's
        polling key) and a short `user_code` (the human types this
        on a second device). The device displays
        `verification_uri` + `user_code` (or scans
        `verification_uri_complete` as a QR code) and starts
        polling /token with `grant_type=urn:ietf:params:oauth:grant-type:device_code`.

        Polling cadence: `interval` (seconds). Server may extend
        the interval on subsequent /token polls by responding
        `slow_down` — clients MUST respect.
      operationId: postDeviceCode
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceCodeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCodeRequest"
      responses:
        "200":
          description: Device code issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
        "400":
          description: invalid_request / invalid_target / missing client_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unknown client_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Inactive client or tenant mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            Device-code store not wired — operator hasn't called
            `WithDeviceCodeStore`. Wire code:
            `device_code_not_configured`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /register:
    post:
      tags: [auth]
      summary: Dynamic Client Registration (RFC 7591).
      description: |
        Mints a new Client record from caller-supplied metadata.
        Returns `client_id`, `client_secret` (omitted when
        `token_endpoint_auth_method=none` per RFC 7591 §2),
        `registration_access_token`, and `registration_client_uri`
        for subsequent RFC 7592 self-management.

        **Auth gate** — by default, callers MUST present
        `Authorization: Bearer <initial_access_token>`. The token is
        operator-provisioned and distributed out-of-band.
        `AllowOpenRegistration: true` on the policy disables the
        gate (every public DCR endpoint in the wild eventually gets
        used for resource exhaustion — leave it off unless you have
        a rate-limit + admin-cleanup story).

        Requires `WithDynamicClientRegistration` at boot; otherwise
        returns 501 `registration_not_configured`.
      operationId: postRegister
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DCRRequest"
      responses:
        "201":
          description: Client registered.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DCRResponse"
        "400":
          description: |
            invalid_client_metadata — DCR metadata validation
            failed (unknown grant type, bad redirect URI, etc.).
            The description carries the specific cause.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: |
            Missing / wrong initial access token. Wire code:
            `invalid_token`. WWW-Authenticate: Bearer challenge
            included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            Tenant client-create quota exhausted. Wire code:
            `quota_exceeded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: DCR not enabled. Wire code `registration_not_configured`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /register/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [auth]
      summary: Read current DCR metadata (RFC 7592 §2.1).
      description: |
        Authenticates with the `registration_access_token` issued
        at /register time. The token MUST match exactly
        (constant-time compare); unknown / wrong-token / unknown
        client_id all collapse to the same `401 invalid_token`
        response per the anti-enumeration rule in AGENTS.md.
      operationId: getRegistration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current registration metadata.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DCRResponse"
        "401":
          description: Missing / wrong registration_access_token (or unknown client_id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [auth]
      summary: Update DCR metadata (RFC 7592 §2.2).
      description: |
        Same validation rules as POST /register. The
        client_secret stays unchanged across updates — operators
        rotate secrets out-of-band via admin tooling, not via
        this self-service surface. When the deployment enables
        registration-access-token rotation (`client_registration.
        rotate_access_token`, RFC 7592 §3.2), the response carries a
        fresh `registration_access_token` (one-time reveal) and the
        prior token stops working; otherwise the token is omitted and
        stays stable.
      operationId: putRegistration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DCRRequest"
      responses:
        "200":
          description: Registration updated.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DCRResponse"
        "400":
          description: Validation failed. Wire code `invalid_client_metadata`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Auth failed (anti-enumeration collapse).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [auth]
      summary: Deregister the client (RFC 7592 §2.3).
      description: |
        Permanently removes the client record. Idempotent — a
        repeat call returns the same 401 collapse as if the
        client never existed.
      operationId: deleteRegistration
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Client deregistered.
        "401":
          description: Auth failed (anti-enumeration collapse).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /device/verify:
    post:
      tags: [auth]
      summary: User-side device-code approval (RFC 8628 §3.3).
      description: |
        The user (already authenticated via /auth/login on this
        second device, holding a bearer) POSTs the `user_code` they
        read off the first device plus `approve: true|false`. The
        server flips the device code's state so the device's next
        /token poll returns either success or `access_denied`.

        user_code lookup is case-insensitive and dash-insensitive —
        a user typing `WXYZ-1234`, `wxyz1234`, or `WXYZ1234` all
        resolve to the same record. The device receives the
        dashed form for display only.
      operationId: postDeviceVerify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceVerifyRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceVerifyRequest"
      responses:
        "200":
          description: Approval / denial recorded.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: invalid_request / invalid_grant (unknown user_code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /logout:
    post:
      tags: [auth]
      summary: Revoke the current bearer token and / or named session.
      description: |
        Body is optional; bearer-only logouts are allowed. When both
        a session id and a bearer are supplied, both are revoked
        (covers the "log me out everywhere" case where the SPA holds
        a JWT but the device that started the session is gone).
      operationId: postLogout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Neither session id nor bearer supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me:
    get:
      tags: [self-service]
      summary: Authenticated self-service account overview.
      description: |
        Returns the bearer's own `sub`, profile (`user`), and
        `active_sessions` / `granted_apps` counts — the landing entry for a
        self-service portal, consolidating data a SPA would otherwise assemble
        from `/sessions/me` + `/consents/me` + the token. Each enrichment is
        best-effort: a store outage drops that field, never the whole response.
        Mounted only when a `UserProvider` is wired. `Cache-Control: no-store`.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  iss: { type: string }
                  user: { $ref: "#/components/schemas/User" }
                  active_sessions: { type: integer }
                  granted_apps: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [self-service]
      summary: Authenticated self-service profile update.
      description: |
        Edits the bearer's own profile. The display `name` is always editable
        (an empty/omitted value leaves it unchanged). `attributes` are applied
        only for keys in the operator's self-editable allowlist
        (`WithSelfEditableProfileAttributes`); any other key is silently
        dropped, so a user can never set an authorization-relevant attribute.
        Identity-critical fields (`id`, `external_id`, `provider`, `email`,
        timestamps) are never self-editable — email changes need a verification
        flow outside self-service. Mounted with a `UserProvider`;
        `Cache-Control: no-store`.
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New display name. Empty/omitted = unchanged.
                attributes:
                  type: object
                  additionalProperties: { type: string }
                  description: Presentation attributes; only allowlisted keys are applied.
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  iss: { type: string }
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No profile record for the authenticated subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/data-export:
    get:
      tags: [self-service]
      summary: Export the authenticated user's own data (GDPR Art. 15).
      description: |
        Returns a portable JSON bundle of the bearer's OWN data (profile,
        sessions, and any registered exporter domains — including `consent`
        recorded consent grants and `mfa_enrollments` registered second-factor
        metadata, when those stores are wired), scoped to the caller's
        subject — the self-service counterpart to the admin-gated
        /api/v1/compliance export. Best-effort: a per-store failure yields a
        partial bundle (recorded in the audit event), never an error. Mounted
        only when an exporter is wired. `Cache-Control: no-store`.
      operationId: exportMyData
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The subject's data bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  generated_at: { type: string, format: date-time }
                  data:
                    type: object
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/email/change:
    post:
      tags: [self-service]
      summary: Begin a verified email change.
      description: |
        Mints a single-use token bound to (subject, new_email) and sends it to
        the NEW address (proving the user controls it) — the verification flow
        PATCH /me routes email edits through. Returns 200 {status:"sent"}.
        Mounted only when an email-change store + sender + UserProvider are
        wired. `Cache-Control: no-store`.
      operationId: changeMyEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: { type: string, format: email }
      responses:
        "200":
          description: Verification token sent to the new address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: sent }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/email/verify:
    post:
      tags: [self-service]
      summary: Complete a verified email change.
      description: |
        Consumes the single-use token, checks it belongs to the authenticated
        caller, and commits the new email. Oracle-safe: unknown / expired /
        consumed token, or one for a different user, ALL collapse to
        email_change_invalid (400). `Cache-Control: no-store`.
      operationId: verifyMyEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email committed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  email: { type: string }
        "400":
          description: email_change_invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/account/erase:
    post:
      tags: [self-service]
      summary: Erase the authenticated user's own account (GDPR Art. 17).
      description: |
        IRREVERSIBLE self-service deletion of the bearer's OWN account
        (sessions + refresh tokens + user record), scoped to the caller's
        subject. The caller MUST echo their own subject in `confirm` to
        authorize the delete (accidental/CSRF guard); `dry_run` previews
        without mutating. Best-effort per step. Opt-in + default-off (often
        undesirable for org-managed accounts). `Cache-Control: no-store`.
      operationId: eraseMyAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: string, description: Must equal the caller's subject (required unless dry_run). }
                dry_run: { type: boolean }
      responses:
        "200":
          description: Erasure report (or dry-run preview).
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  dry_run: { type: boolean }
                  refresh_tokens_deleted: { type: integer }
                  sessions_destroyed: { type: integer }
                  user_deleted: { type: boolean }
                  skipped: { type: array, items: { type: string } }
        "400":
          description: confirmation_required (confirm missing or mismatched).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      tags: [self-service]
      summary: Authenticated self-service password change.
      description: |
        Verifies the bearer's current password against the configured
        `PasswordCredentialStore`, then sets a new one. The caller is
        authenticated as their own account, so a wrong current password
        returns `invalid_password` (not an enumeration leak). Mounted only when
        a password credential store is wired. `Cache-Control: no-store`.
      operationId: changeMyPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204":
          description: Password changed.
        "400":
          description: |
            `invalid_password` (current password wrong) or `invalid_request`
            (missing/empty new password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/mfa:
    get:
      tags: [self-service]
      summary: List the authenticated user's registered second factors.
      description: |
        Returns non-sensitive metadata (id, method, label, added_at) for each
        factor — never the TOTP secret or WebAuthn key material. Mounted only
        when an MFA enrollment store is wired. `Cache-Control: no-store`.
      operationId: listMyMFAFactors
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's registered factors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        method: { type: string }
                        label: { type: string }
                        added_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/mfa/{id}:
    delete:
      tags: [self-service]
      summary: Unbind one of the authenticated user's second factors.
      description: |
        Removes the factor by id. A factor owned by another user (or a missing
        id) returns the same 404 — ownership is enforced via the user-scoped
        list, so a cross-user delete can never remove someone else's factor.
        `Cache-Control: no-store`.
      operationId: deleteMyMFAFactor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Factor unbound.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such factor for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mfa/totp/begin:
    post:
      tags: [self-service]
      summary: Begin self-service TOTP enrollment.
      description: |
        Mints a fresh TOTP secret and returns it (base32) plus an `otpauth://`
        provisioning URI for QR rendering. The secret is NOT persisted: the flow
        is stateless and the client returns it to `/me/mfa/totp/confirm` with a
        code proving possession. Round-tripping is safe — the secret only ever
        becomes a second factor for the caller's own account. Mounted only when
        a TOTP enroller and a TOTP-capable enrollment store are wired.
        `Cache-Control: no-store`.
      operationId: beginMyTOTPEnrollment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A fresh secret + provisioning URI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: Base32 (no padding) shared secret. }
                  otpauth_uri: { type: string, description: otpauth://totp/... URI for QR. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: TOTP enrollment is not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mfa/totp/confirm:
    post:
      tags: [self-service]
      summary: Confirm and commit a self-service TOTP factor.
      description: |
        Verifies `code` against the supplied `secret` (proof of possession),
        then persists the secret and records the factor so it is immediately
        usable at login and listed by `GET /me/mfa`. Oracle-safe: a malformed
        secret and a wrong code collapse to one `totp_invalid_code` response;
        the cause is recorded only in the `mfa_totp_enroll_failed` audit event.
        `Cache-Control: no-store`.
      operationId: confirmMyTOTPEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string, description: The base32 secret from begin. }
                code: { type: string, description: Current 6-digit TOTP code. }
                label: { type: string, description: Optional device name. }
      responses:
        "201":
          description: Factor enrolled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  factor_id: { type: string }
                  label: { type: string }
        "400":
          description: Malformed request, or `totp_invalid_code` (wrong code / bad secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: TOTP enrollment is not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mfa/recovery-codes:
    post:
      tags: [self-service]
      summary: Regenerate the caller's single-use MFA recovery codes.
      description: |
        Revokes any prior batch (so a leaked earlier set dies), mints a fresh
        batch, and returns the plaintext codes EXACTLY ONCE — they are hashed at
        rest and never retrievable again. Recovery codes are credentials:
        `Cache-Control: no-store`. Redemption is separate — spend a code as a
        second factor via `POST /auth/mfa` with `mfa_method=recovery`. Mounted
        only when a recovery-code store is wired.
      operationId: regenerateMyRecoveryCodes
      security:
        - bearerAuth: []
      responses:
        "201":
          description: A fresh batch of recovery codes (shown once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
                    description: Plaintext codes, shown only in this response.
                  count: { type: integer, description: Number of codes issued. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Recovery codes are not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [self-service]
      summary: Count the caller's remaining recovery codes.
      description: |
        Returns the number of unused codes (for a low-pool warning). NEVER
        returns the codes themselves — the plaintext is shown only at
        generation. `Cache-Control: no-store`.
      operationId: countMyRecoveryCodes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The remaining unused recovery-code count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remaining: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Recovery codes are not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mfa/webauthn/begin:
    post:
      tags: [self-service]
      summary: Begin authenticated self-service passkey registration.
      description: |
        Starts a WebAuthn registration ceremony bound to the BEARER subject —
        the new credential can only ever be added to the caller's own account
        (unlike the unauthenticated /webauthn/registration signup ceremony,
        which takes the username from the body). Returns the CredentialCreation
        `options` for `navigator.credentials.create` and an opaque `session_id`
        to return to finish. Body: optional {display_name}. Mounted only when a
        WebAuthn registrar is wired. `Cache-Control: no-store`.
      operationId: beginMyPasskeyRegistration
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
      responses:
        "200":
          description: Ceremony options + session id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  options: { type: object, description: WebAuthn CredentialCreation options. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Passkey registration is not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/mfa/webauthn/finish:
    post:
      tags: [self-service]
      summary: Finish authenticated self-service passkey registration.
      description: |
        Verifies the attestation and commits the passkey, which then appears in
        `GET /me/mfa`. The begin session (not request input) determines the
        owning user; a valid bearer is still required. Failures collapse to one
        `webauthn_registration_failed` (cause in logs). `Cache-Control: no-store`.
      operationId: finishMyPasskeyRegistration
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: The WebAuthn PublicKeyCredential attestation response (standard shape).
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Passkey registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential_id: { type: string }
        "400":
          description: Missing session_id, or `webauthn_registration_failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          description: Passkey registration is not wired on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /.well-known/oauth-protected-resource:
    get:
      tags: [discovery]
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728).
      description: |
        Public discovery document letting clients — notably MCP / AI-agent
        clients following the protected-resource discovery flow — learn which
        authorization server issues tokens for this resource, the JWKS,
        supported scopes, and token-binding requirements. Derived from server
        state (resource defaults to the request base URL, authorization_servers
        to the server issuer). Mounted only when
        `protected_resource_metadata.enabled`.
      operationId: protectedResourceMetadata
      responses:
        "200":
          description: Protected Resource Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [resource]
                properties:
                  resource: { type: string }
                  authorization_servers: { type: array, items: { type: string } }
                  jwks_uri: { type: string }
                  scopes_supported: { type: array, items: { type: string } }
                  bearer_methods_supported: { type: array, items: { type: string } }
                  resource_signing_alg_values_supported: { type: array, items: { type: string } }
                  dpop_signing_alg_values_supported: { type: array, items: { type: string } }
                  tls_client_certificate_bound_access_tokens: { type: boolean }
                  resource_name: { type: string }
                  resource_documentation: { type: string }

  /sessions/me:
    get:
      tags: [self-service]
      summary: List the authenticated user's own active sessions.
      description: |
        Returns the bearer subject's active sessions. Requires a
        SessionManager; `Cache-Control: no-store`.
      operationId: listMySessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's active sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [self-service]
      summary: Sign out everywhere — revoke the user's sessions in bulk.
      description: |
        Revokes the authenticated user's active sessions. By default it
        preserves the caller's current session (the one whose id matches the
        token's `sid` claim), matching the "sign out of all other devices"
        UX; pass `all=true` to revoke the current session too. When the token
        carries no `sid`, every session is revoked. Scope mirrors single-
        session revoke (sessions only — bulk refresh-token revocation remains
        `/token/revoke-all`). Requires a SessionManager; `Cache-Control: no-store`.
      operationId: revokeMySessions
      security:
        - bearerAuth: []
      parameters:
        - name: all
          in: query
          required: false
          description: When `true`, also revoke the caller's current session.
          schema: { type: boolean }
      responses:
        "200":
          description: Bulk revoke result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                    description: Number of sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/me/{id}:
    delete:
      tags: [self-service]
      summary: Revoke one of the authenticated user's own sessions.
      description: |
        Destroys the session by id. A session owned by another user (or a
        missing id) returns the same 404 — ownership is enforced so a
        cross-user revoke cannot terminate someone else's session.
        `Cache-Control: no-store`.
      operationId: deleteMySession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such session for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consents/me:
    get:
      tags: [self-service]
      summary: List the authenticated user's consent grants.
      description: |
        Returns the bearer subject's consent grants (connected applications).
        Requires a ConsentStore; `Cache-Control: no-store`.
      operationId: listMyConsents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's consent grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string }
                        client_id: { type: string }
                        scopes: { type: array, items: { type: string } }
                        granted_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /consents/me/{client_id}:
    delete:
      tags: [self-service]
      summary: Revoke the authenticated user's consent for a client.
      description: |
        Removes the bearer subject's consent grant for the given client.
        A missing grant returns 404. `Cache-Control: no-store`. Emits a
        `consent_revoked` audit event keyed on the subject (the self-service
        parallel to the admin-plane `admin_consent_revoked`).
      operationId: deleteMyConsent
      security:
        - bearerAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Consent revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No consent grant for this user + client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /branding:
    get:
      tags: [self-service]
      summary: Public per-host white-label branding for the hosted login SPA.
      description: |
        Unauthenticated. Resolves the request Host to a tenant `Domain` and
        returns its non-sensitive `branding` map (e.g. `brand_name`,
        `primary_color`, `logo_url`) for theming the sign-in page before
        authentication. Non-enumerable: an unknown host or a domain with no
        branding returns the same `200` with an empty `branding` object.
        Mounted only when a tenant store is wired.
      operationId: getBranding
      responses:
        "200":
          description: Branding map (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  branding:
                    type: object
                    additionalProperties: { type: string }
                  iss: { type: string }

  /userinfo:
    get:
      tags: [userinfo]
      summary: Fetch the user record for the bearer's subject.
      description: |
        OpenID-style `/userinfo` endpoint — validates the bearer,
        resolves the subject id, and returns the `User` record from
        the configured `UserProvider`. The shape mirrors the User
        struct in `types.go`.
      operationId: getUserInfo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Data-residency denial (`region_not_allowed`): the bearer is VALID,
            but the token's tenant constrains its serving regions and this
            region is outside the allowed set, so its tenant data is not served
            here. This is a policy denial, distinct from a `401 invalid_token`
            (the token is not rejected as a credential). The access-side
            counterpart to the `/auth/login` write-gate; only the
            allowed-regions check fires on reads, so `residency_violation`
            (write-only) cannot appear here. Carries `Cache-Control: no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token valid but subject id has no User record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mesh/ext-authz:
    get:
      tags: [mesh]
      summary: Envoy/Istio ext_authz HTTP-mode authorization check (opt-in).
      description: |
        Opt-in (`WithMeshExtAuthz`, config `mesh.ext_authz.enabled`) HTTP
        external-authorization endpoint for a service-mesh sidecar — Envoy's
        `ext_authz` HTTP filter, or an Istio `AuthorizationPolicy` CUSTOM
        action with an HTTP provider. The sidecar calls it per request to
        validate the inbound bearer:

        - **200 = ALLOW.** The endpoint stamps DERIVED identity response
          headers (`X-Auth-Subject`, `X-Auth-Client-Id`, `X-Auth-Scopes`,
          `X-Auth-Expires`, and `X-Auth-Roles` when a permissions provider
          is wired) which the sidecar injects into the upstream request. The
          response body is empty.
        - **401 = DENY.** A missing token returns a bare `Bearer` challenge
          (no `error=`); an invalid, expired, or sender-constraint-failing
          token returns `error="invalid_token"` — the exact opaque-failure
          shape `/userinfo` returns (no oracle leak).

        It reuses the same alg-confusion-safe bearer validation `/userinfo`
        uses, including the RFC 9449 DPoP and RFC 8705 mTLS sender-constraint
        checks, so a stolen sender-constrained token cannot be replayed
        through the mesh as a plain bearer. No request body is read.

        TRUST MODEL: every `X-Auth-*` header is DERIVED from the validated
        token; the endpoint NEVER trusts an inbound `X-Auth-*`. The upstream
        trusts the injected headers ONLY because the sidecar ran this check,
        so the mesh MUST strip any client-supplied `X-Auth-*` at ingress —
        the same "edge must strip untrusted headers" model that governs
        `X-Forwarded-*` and `security.mtls.backend: header`. The endpoint is
        mesh-internal: only the trusted sidecar should be able to reach it.
      operationId: meshExtAuthz
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            ALLOW. Empty body; the bearer's identity is carried in the
            `X-Auth-*` response headers for the sidecar to inject upstream.
          headers:
            X-Auth-Subject:
              description: The validated token's subject (`sub`).
              schema:
                type: string
            X-Auth-Client-Id:
              description: The OAuth client the token was minted for.
              schema:
                type: string
            X-Auth-Scopes:
              description: Space-joined token scopes.
              schema:
                type: string
            X-Auth-Expires:
              description: Token expiry as a Unix timestamp (seconds).
              schema:
                type: string
            X-Auth-Roles:
              description: |
                Comma-joined role codes — present only when a permissions
                provider is wired and a role lookup succeeds.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ssf/receive:
    post:
      tags: [ssf]
      summary: OpenID Shared Signals (CAEP/SSF) push-delivery receiver (opt-in).
      description: |
        Opt-in (`WithCAEPReceiver`, config `caep.receiver.enabled`) inbound
        half of OpenID Shared Signals — the SSF "push" delivery receiver
        (RFC 8935). A CONFIGURED trusted upstream transmitter POSTs a signed
        Security Event Token (a compact JWS, RFC 8417) in the request body
        with `Content-Type: application/secevent+jwt`; the receiver validates
        it FAIL-CLOSED and, on a session-revoked / account-disabled /
        token-claims-change event for a PRECISELY-mapped local subject,
        revokes that subject's local access (sessions + refresh tokens) via
        the same seams `/token/revoke-all` uses.

        Validation chain (every trust failure collapses to the SAME coarse
        SSF error code — no oracle leak of which gate failed):

        - **trusted-issuer allowlist** — the SET `iss` MUST name a configured
          transmitter; an unknown issuer triggers nothing.
        - **signature** — verified against THAT transmitter's published JWKS
          via the same alg-confusion-safe verifier the SPIFFE JWT-SVID path
          uses (asymmetric-only, `alg=none` and every HS* blocked).
        - **typ** — the JOSE header `typ` MUST be `secevent+jwt`, so a plain
          access/id token signed by the same upstream key cannot be replayed
          as a SET.
        - **aud-binding** — the SET `aud` MUST contain this server's
          configured audience; a SET addressed to a different receiver does
          NOT act here (no cross-receiver replay).
        - **freshness** — `iat`/`exp` within a configurable skew.
        - **jti replay** — a replayed SET (same `jti`) does NOT re-trigger.

        Subject mapping is the precision crux: a subject that does NOT map to
        a KNOWN local user is ACKED but NOT acted on — revoking a guessed /
        partial-match subject would be wrongful revocation (a targeted DoS).

        This is a credential-bearing endpoint; every response carries
        `Cache-Control: no-store`. It is intended to be reached only by the
        trusted upstream transmitter (operator network policy).
      operationId: ssfReceive
      requestBody:
        required: true
        description: The Security Event Token as a compact JWS.
        content:
          application/secevent+jwt:
            schema:
              type: string
              description: A compact-JWS SET (`header.payload.signature`).
      responses:
        "202":
          description: |
            Accepted. The SET was VALID and processed — including the cases
            where it mapped to no local subject or carried only unknown
            events (the transmitter did its job; the receiver had nothing to
            do, or revoked the mapped subject's local access). Empty body.
        "400":
          description: |
            The SET was malformed, unsigned, from an untrusted issuer,
            addressed to a different audience, expired, or replayed. The body
            is a minimal SSF error object; `err` is a COARSE standard code
            (`invalid_request` for a malformed body, `invalid_key` for any
            authentication failure) that does NOT reveal which precise gate
            failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                    enum: [invalid_request, invalid_key]
                  description:
                    type: string
        "500":
          description: |
            A transient internal failure AFTER full validation (a
            resolve/revoke store outage). The validated revocation intent is
            real, so the transmitter should retry. Generic body (no detail).

  /permissions/me:
    get:
      tags: [me]
      summary: Permissions of the bearer's subject for the inferred client.
      description: |
        Returns the flat permission list (no wildcards expanded) the
        configured `permissions.Provider` resolves for the bearer.
        Client id is taken from the JWT `aud` claim (first element)
        when present.
      operationId: getMyPermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permission codes assigned to this subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /roles/me:
    get:
      tags: [me]
      summary: Roles of the bearer's subject for the inferred client.
      operationId: getMyRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /menus/me:
    get:
      tags: [me]
      summary: Menu tree the bearer's subject is authorized to see.
      description: |
        Tree shape (nested children + per-node buttons) matches the
        `permissions.MenuTree` Go type. SPAs render this directly as
        the navigation sidebar.
      operationId: getMyMenus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized menu tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuTree"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /livez:
    get:
      tags: [operational]
      summary: Liveness probe.
      description: |
        Returns 200 unconditionally as long as the HTTP handler is
        running — the handler responding at all is itself the
        signal. Wired outside the rate-limit + metrics middleware
        stack so kubelet probes can't be throttled. Distinct from
        `/health`, which also returns the configured issuer name.
      operationId: getLivez
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /readyz:
    get:
      tags: [operational]
      summary: Readiness probe — aggregates every registered ReadyCheck.
      description: |
        Runs every wired `ReadyCheck` in parallel (bounded by a 3s
        context deadline) and returns 200 when all pass / 503 when
        any fail. The cmd binary auto-registers one check per SQLite
        store via `appendReadyCheck` (names like
        `sqlite-identity-clients`, `sqlite-jti-replay`,
        `sqlite-webauthn-users`, etc.). Memory-backed stores
        contribute no readiness signal.

        Wired outside the rate-limit + metrics middleware stack so
        kubelet probes can't be throttled.
      operationId: getReadyz
      responses:
        "200":
          description: All registered checks reported ok.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failed; per-check detail in body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /.well-known/openid-configuration:
    get:
      tags: [discovery]
      summary: OpenID Connect Discovery 1.0 document.
      description: |
        Derived from the server's wired feature set on every fetch
        (then double-cached: a `clientDiscoverySnapshot` for client-
        store projection + a marshaled-body cache keyed by request
        base URL, both default 5s; see `WithDiscoveryCacheTTL` and
        `WithDiscoveryDocCacheTTL`). The response shape conforms to
        OpenID Connect Discovery 1.0 + RFC 8414 — only the fields the
        AS actually supports are emitted (e.g. `pushed_authorization_request_endpoint`
        appears only when a PAR store is wired; `registration_endpoint`
        only when DCR is enabled). Honors `If-None-Match` against the
        body sha256 and returns 304 on a match.
      operationId: getOpenIDConfiguration
      responses:
        "200":
          description: Live OIDC + RFC 8414 metadata.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<ttl>` when caching is enabled.'
            ETag:
              schema:
                type: string
              description: Short sha256 prefix of the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"
        "304":
          description: Not Modified — body matches the supplied If-None-Match.

  /.well-known/oauth-authorization-server:
    get:
      tags: [discovery]
      summary: RFC 8414 OAuth 2.0 Authorization Server Metadata (alias).
      description: |
        Byte-identical alias of `/.well-known/openid-configuration` — the
        same handler serves both paths (same body cache, same `ETag`).
        Published for pure-OAuth clients (notably MCP agents) that resolve
        the RFC 8414 well-known suffix instead of OIDC discovery; the OIDC
        document is a compatible superset of RFC 8414 §2 metadata.
      operationId: getOAuthAuthorizationServerMetadata
      responses:
        "200":
          description: Live OIDC + RFC 8414 metadata (identical to /.well-known/openid-configuration).
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<ttl>` when caching is enabled.'
            ETag:
              schema:
                type: string
              description: Short sha256 prefix of the response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"
        "304":
          description: Not Modified — body matches the supplied If-None-Match.

  /.well-known/openid-federation:
    get:
      tags: [federation]
      summary: OpenID Federation 1.0 entity configuration.
      description: |
        The OP's SELF-SIGNED Entity Statement (OpenID Federation 1.0 §9),
        served only when `WithFederationEntity` is wired (opt-in; the route is
        unmounted otherwise — a request then 404s). The response is a compact
        JWS (media type `application/entity-statement+jwt`) whose payload is an
        Entity Statement with `iss` == `sub` == the issuer (self-signed),
        `jwks` carrying the OP's published signing keys inline,
        `metadata.openid_provider` DERIVED from the OpenID Connect Discovery
        document, optional `metadata.federation_entity` (organization /
        contacts), and `authority_hints` from configuration. It is signed via
        the issuer's generic JWT seam with JOSE `typ` `entity-statement+jwt`
        using a key already in JWKS, so a federation consumer validates it with
        no new trust setup.

        This is PUBLIC metadata (Cache-Control `public, max-age`, NOT
        no-store), ETag-cached with `If-None-Match` → 304. Trust-chain
        VALIDATION (resolving `authority_hints` up to a trust anchor) is NOT
        performed by this endpoint.
      operationId: getFederationEntityConfiguration
      responses:
        "200":
          description: |
            The signed Entity Configuration as a compact JWS. The body is the
            JWS itself (not JSON) — decode + verify it against the OP's JWKS.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<ttl>` (public metadata, not a credential).'
            ETag:
              schema:
                type: string
              description: Short sha256 prefix of the signed body.
          content:
            application/entity-statement+jwt:
              schema:
                type: string
                description: Compact JWS (header.payload.signature).
        "304":
          description: Not Modified — body matches the supplied If-None-Match.
        "500":
          description: Entity statement signing failed.

  /fetch:
    get:
      tags: [federation]
      summary: OpenID Federation 1.0 §8 Federation Fetch endpoint.
      description: |
        Issues a SIGNED Subordinate Statement about a requested subordinate
        entity (OpenID Federation 1.0 §8), letting THIS server act as a
        federation SUPERIOR / INTERMEDIATE. Mounted ONLY when
        `WithFederationEntity` is wired AND at least one subordinate is
        configured (opt-in; the route is unmounted otherwise — a request then
        404s — and the Entity Configuration advertises no
        `federation_fetch_endpoint`).

        The request supplies the required `sub` (the subordinate's Entity
        Identifier) and an OPTIONAL `iss` (which, when present, MUST equal this
        server's entity id). `sub` is LOOKED UP in the operator-configured
        subordinates: the response is a compact JWS (media type
        `application/entity-statement+jwt`, JOSE `typ` `entity-statement+jwt`)
        whose payload has `iss` == this server (the issuing superior), `sub` ==
        the subordinate, `jwks` == the subordinate's OPERATOR-CONFIGURED keys
        this server vouches for (NOT request input), and optionally the
        `metadata_policy` / `constraints` this superior imposes. It is signed
        with a key already in this server's JWKS, so a resolver validates it
        against this server's entity-config `jwks` (chained trust).

        Security: this server NEVER issues a statement about an entity it was
        not configured to vouch for — an unknown/unregistered `sub` → 404
        `not_found`. The error body is the §8 federation error JSON
        (`{"error": ..., "error_description": ...}`), NOT the OAuth error shape
        of a credential endpoint. This is PUBLIC metadata (Cache-Control
        `public, max-age`, NOT no-store), ETag-cached per `(iss, sub)` with
        `If-None-Match` → 304.
      operationId: getFederationFetch
      parameters:
        - name: sub
          in: query
          required: true
          schema:
            type: string
          description: The subordinate entity's Entity Identifier (an HTTPS URL).
        - name: iss
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional expected issuer. When present it MUST equal this server's
            entity id, else 400 `invalid_request`.
      responses:
        "200":
          description: |
            The signed Subordinate Statement as a compact JWS (the body is the
            JWS itself, not JSON). Decode + verify it against this server's
            JWKS.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<ttl>` (public metadata, not a credential).'
            ETag:
              schema:
                type: string
              description: Short sha256 prefix of the signed body.
          content:
            application/entity-statement+jwt:
              schema:
                type: string
                description: Compact JWS (header.payload.signature).
        "304":
          description: Not Modified — body matches the supplied If-None-Match.
        "400":
          description: |
            §8 `invalid_request` (federation error JSON) — `sub` is missing, or a
            supplied `iss` does not equal this server's entity id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_request
                  error_description:
                    type: string
        "404":
          description: |
            §8 `not_found` (federation error JSON) — the requested `sub` is not a
            configured subordinate of this entity. No statement is issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: not_found
                  error_description:
                    type: string
        "500":
          description: Subordinate statement signing failed.

  /end_session:
    get:
      tags: [auth]
      summary: OpenID Connect RP-Initiated Logout 1.0.
      description: |
        Relying-party-initiated logout. The RP redirects the user
        agent here with `id_token_hint` (a previously-issued
        id_token); the server validates the hint signature, kills
        the corresponding session + best-effort revokes the access-
        token-side counterpart, then redirects to
        `post_logout_redirect_uri` (when in the client's allowlist)
        or returns 204.

        `post_logout_redirect_uri` MUST exact-match a registered
        URI — no path tolerance, no scheme-only match. Unrecognized
        URIs fall back to 204 rather than opening a redirect vector
        for unauthenticated callers.
      operationId: getEndSession
      parameters:
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
          description: |
            Previously-issued ID Token identifying the user. Signature
            is verified before any session action.
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: |
            Where to send the user after logout. MUST be in the
            client's `post_logout_redirect_uris` allowlist.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value echoed back on the 302 Location.
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description: |
            Fallback when `id_token_hint` is absent. Used only to look
            up the redirect-uri allowlist — no session is revoked
            without a verified id_token_hint.
      responses:
        "204":
          description: |
            Session terminated (or no session to terminate).
            `post_logout_redirect_uri` was absent or not in the
            client's allowlist, so no redirect was issued.
        "302":
          description: |
            Session terminated and the user agent is being redirected
            to `post_logout_redirect_uri` (with `state` appended when
            supplied).
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: The post-logout redirect target.
        "400":
          description: |
            `id_token_hint` was supplied but failed signature / expiry
            / format validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webauthn/registration/begin:
    post:
      tags: [webauthn]
      summary: Start a WebAuthn registration ceremony.
      description: |
        Step 1 of 2 for enrolling a new credential. The server
        generates `PublicKeyCredentialCreationOptions` (challenge,
        RP info, user info) + a single-use `session_id` the client
        echoes back on `/webauthn/registration/finish`.

        Mount this endpoint by setting `webauthn.enabled: true` in
        the cmd YAML config — the cmd registers all four ceremony
        routes on the SSO router automatically when the helper is
        configured.
      operationId: postWebAuthnRegistrationBegin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnBeginRequest"
            examples:
              registration:
                value:
                  username: alice
                  display_name: Alice Lovelace
      responses:
        "200":
          description: Creation options + session_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnBeginRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: WebAuthn library or store error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webauthn/registration/finish:
    post:
      tags: [webauthn]
      summary: Complete a WebAuthn registration ceremony.
      description: |
        Step 2 of 2. The body is the raw
        `PublicKeyCredential.AttestationResponse` produced by the
        browser's `navigator.credentials.create()` call. The server
        consumes the `session_id` (single-use; SQLite-backed stores
        use `DELETE ... RETURNING` so concurrent finish calls can't
        both succeed) and persists the new credential.

        Unknown / expired session_id and unknown user both collapse
        to `404 session_invalid` — probes can't distinguish "wrong
        session_id" from "never enrolled" (oracle-leak resistance,
        same pattern the OAuth code paths use).
      operationId: postWebAuthnRegistrationFinish
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
          description: Session id returned by `/webauthn/registration/begin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                `PublicKeyCredential.AttestationResponse` (CBOR-encoded
                attestation object + clientDataJSON, base64url-wrapped
                per WebAuthn Level 2). Forwarded to the
                `go-webauthn/webauthn` library unchanged — see its
                `protocol.ParseCredentialCreationResponseBody` for the
                exact shape.
      responses:
        "200":
          description: Credential persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnFinishRegistrationResponse"
        "400":
          description: Attestation parse or verification failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            `attestation_denied` — the operator's attestation policy
            (`webauthn.attestation`, opt-in) rejected the authenticator:
            its AAGUID is not on the allowlist (or is on the denylist).
            The credential was NOT persisted. The response is deliberately
            generic ("authenticator not permitted"); the rejected AAGUID +
            the gating mode are recorded only in the
            `webauthn_attestation_denied` audit event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `session_invalid` — session_id is unknown / expired, or the
            user record disappeared mid-ceremony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webauthn/login/begin:
    post:
      tags: [webauthn]
      summary: Start a WebAuthn login (assertion) ceremony.
      description: |
        Step 1 of 2 for authenticating with a previously-enrolled
        credential. The server generates
        `PublicKeyCredentialRequestOptions` (challenge + the
        credential id list for the named user) + a single-use
        `session_id`. The browser passes the options to
        `navigator.credentials.get()`.
      operationId: postWebAuthnLoginBegin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnBeginRequest"
            examples:
              login:
                value: { username: alice }
      responses:
        "200":
          description: Request options + session_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnBeginLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: |
            `session_invalid` — username is not enrolled (same code
            unknown-session uses, so probes can't enumerate
            registered users).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webauthn/login/finish:
    post:
      tags: [webauthn]
      summary: Complete a WebAuthn login — optionally mint a token.
      description: |
        Step 2 of 2. The body carries the raw
        `PublicKeyCredential.AssertionResponse`. Without a
        `client_id` query parameter the response stays in v1
        credential-verification mode — `{username, credential_id}`
        only.

        When `client_id` is supplied AND the cmd binary has a
        `ClientStore` + `TokenIssuer` wired (the default config
        does), the server mints an access token for the
        authenticated subject and includes it inline. The same
        emission rules `/auth/login` uses apply:

        * `id_token` rides along when the resolved client's
          `allowed_scopes` contains `openid` **and** a
          `WithIDTokenIssuer` is wired.
        * `refresh_token` rides along when a
          `WithRefreshTokenStore` is wired (unconditional on scope,
          matching `/auth/login` — RFC 6749 §1.5 AS discretion).

        Token `AMR` is `["webauthn"]`; `Provider` is `"webauthn"`;
        scopes default to the client's full `allowed_scopes` (the
        ceremony has no scope-selection step). Per-client
        `refresh_token_ttl` overrides the global TTL.
      operationId: postWebAuthnLoginFinish
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
          description: Session id returned by `/webauthn/login/begin`.
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description: |
            Registered Client.ID — when present, the response
            additionally carries access / refresh / id tokens for
            this client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                `PublicKeyCredential.AssertionResponse` (authenticator
                data + signature + clientDataJSON). Forwarded to
                `go-webauthn/webauthn` unchanged.
      responses:
        "200":
          description: |
            Assertion verified. Token fields are present only when
            `client_id` was supplied and the cmd has the matching
            backends wired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnFinishLoginResponse"
        "400":
          description: |
            Assertion failed (`ceremony_failed`) or unknown client
            (`invalid_client`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `session_invalid` — session_id unknown / expired or user
            disappeared mid-ceremony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Token issuer / refresh-token store failure (`server_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch one Client record.
      description: |
        Read-only fetch of a registered Client. Does NOT return the
        `client_secret` (zero-valued in the response — clients are
        rotated out-of-band via admin tooling, not this surface).

        Open endpoint by design: SPAs need it to discover their
        registered redirect_uris / allowed_scopes for the
        /auth/login bootstrap. Operators wanting to lock it down
        should front the path with an auth proxy.
      operationId: getClientByID
      responses:
        "200":
          description: Client metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMetadata"
        "404":
          description: Unknown client_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/compliance/users/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The data subject's user id.
    get:
      tags: [admin]
      summary: Export a subject's data (GDPR Art. 15 / 20).
      description: |
        Assembles a portable JSON bundle of the subject's data across
        the wired stores (profile + active sessions + any registered
        SubjectExporter domains — including `consent` recorded consent
        grants and `mfa_enrollments` registered second-factor metadata,
        when those stores are wired). Admin-gated — leaks the subject's PII;
        the admin middleware enforces `admin:read`. Refresh tokens are
        intentionally excluded (opaque credentials are never exported).
        Best-effort: a partial store failure still returns 200 with the
        data that was gathered (the failure is recorded in the audit log).
      operationId: exportSubject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export bundle (possibly partial).
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  generated_at: { type: string, format: date-time }
                  data:
                    type: object
                    additionalProperties: true
        "400":
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/compliance/users/{id}/erase:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The data subject's user id.
    post:
      tags: [admin]
      summary: Erase a subject's data (GDPR Art. 17).
      description: |
        Revokes the subject's refresh tokens across every client,
        destroys their active sessions, and deletes the account —
        credentials first, so a mid-way failure leaves the subject
        locked out rather than half-erased-but-usable. Idempotent.
        Admin-gated — destructive; the admin middleware enforces
        `admin:write`. Returns 207 when a step partially failed (some
        data was still erased).
      operationId: eraseSubject
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  description: Preview without mutating. Refresh-token counts are previewed only when the store supports a non-destructive count.
      responses:
        "200":
          description: Erasure (or dry-run preview) completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureReport"
        "207":
          description: Partial erasure — a step failed; see errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureReport"
        "400":
          description: Malformed path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/audit/events:
    get:
      tags: [admin]
      summary: Query audit events.
      description: |
        Filters at least one of the query parameters and returns
        matching events newest-first. Pagination via
        `limit` / `offset`. Admin-gated — leaks subject IDs / IPs /
        geo data; the admin middleware enforces `admin:read`.

        Time params accept RFC 3339 (`2026-01-15T12:00:00Z`) or
        Unix seconds for CLI convenience.

        Requires `WithAuditAPI` + an `audit.Recorder` whose Sink
        implements `Query` (the built-in `MemorySink` does;
        `WebhookSink` doesn't — query that downstream collector
        instead).
      operationId: queryAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: One of the canonical audit event types (login, logout, refresh_token_issued, ...).
        - name: actor_id
          in: query
          schema: { type: string }
        - name: client_id
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: request_id
          in: query
          schema: { type: string }
        - name: trace_id
          in: query
          schema: { type: string }
          description: W3C trace context — joins audit + APM data.
        - name: since
          in: query
          schema: { type: string }
          description: RFC 3339 or unix seconds.
        - name: until
          in: query
          schema: { type: string }
          description: RFC 3339 or unix seconds.
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Query succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          description: Malformed time / int parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            `audit_not_enabled` when no recorder is wired;
            `server_error` when the Sink's Query call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/audit/facets:
    get:
      tags: [admin]
      summary: Aggregate audit-event facet counts.
      description: |
        Returns per-dimension candidate filter values + counts over the
        events matching the SAME filter query as `/api/v1/audit/events`
        (time range + non-dimension filters). Lets a filter UI render
        "Outcome: success (1.2k) / failure (40)", "Client: ...", etc.
        without an N+1 round trip per candidate value.

        Dimensions are deliberately bounded — `outcome`, `type`,
        `client_id`, `provider`. High-cardinality per-user / per-request
        fields (`actor_id`, `trace_id`, `request_id`) are NOT faceted (the
        value space grows with traffic; filter on them directly instead).

        `limit` / `offset` are accepted but ignored — facets describe the
        whole filtered window, not a page of it. Admin-gated identically to
        `/api/v1/audit/events` (`admin:read`).

        Requires `WithAuditAPI` + a Sink implementing the optional
        `audit.FacetQuerier` (the built-in `MemorySink` + the SQLite sink
        do). A write-only Sink (e.g. `WebhookSink`) yields HTTP 501
        `audit_not_enabled` so the UI can fall back to plain queries.
      operationId: queryAuditFacets
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema: { type: string }
          description: One of the canonical audit event types (login, logout, refresh_token_issued, ...).
        - name: actor_id
          in: query
          schema: { type: string }
        - name: client_id
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: request_id
          in: query
          schema: { type: string }
        - name: trace_id
          in: query
          schema: { type: string }
          description: W3C trace context — joins audit + APM data.
        - name: since
          in: query
          schema: { type: string }
          description: RFC 3339 or unix seconds.
        - name: until
          in: query
          schema: { type: string }
          description: RFC 3339 or unix seconds.
      responses:
        "200":
          description: Facet aggregation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditFacetsResponse"
        "400":
          description: Malformed time parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            `audit_not_enabled` when no recorder is wired; `server_error`
            when the Sink's Facets call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: |
            `audit_not_enabled` — the configured Sink does not implement
            facet aggregation (`audit.FacetQuerier`). Fall back to
            `/api/v1/audit/events`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/audit/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch one audit event by id.
      description: |
        Lookup by `Event.ID`. Returns the full event payload
        including `prev_hash` + `hash` when the recorder was
        constructed with `WithHashChain`.
      operationId: getAuditEvent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |
            `audit_event_not_found` — id never existed or has been
            evicted from the bounded MemorySink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/netpolicy/policies:
    get:
      tags: [admin]
      summary: List network policies.
      description: |
        Returns every registered netpolicy entry (name, CIDRs,
        hostnames, priority, advertised URLs, metadata). Admin-gated
        via the admin middleware — leaks network topology.
      operationId: listNetPolicies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policies list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetPolicyList"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            `netpolicy_not_configured` when no store is wired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [admin]
      summary: Apply (create or overwrite) a network policy.
      description: |
        Upserts the policy by `name`. Server stamps `version` +
        `updated_at` on persist; caller-supplied values for those
        fields are ignored.
      operationId: applyNetPolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetPolicy"
      responses:
        "200":
          description: Policy applied (returned with server-stamped fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetPolicyEnvelope"
        "400":
          description: Missing name / malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/netpolicy/policies/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a single network policy.
      operationId: getNetPolicy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetPolicyEnvelope"
        "404":
          description: '`netpolicy_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [admin]
      summary: Delete a network policy.
      description: |
        Idempotent — deleting an unknown name returns 200 (matches
        the SDK's "Delete is idempotent" contract). Emits a
        `net_policy_delete` audit event.
      operationId: deleteNetPolicy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/netpolicy/classify:
    get:
      tags: [admin]
      summary: Classify an arbitrary (remote_addr, host) pair.
      description: |
        Operator-facing diagnostic — feed a remote IP + host and
        get back the matched policy. Useful for verifying classifier
        config before rolling it out, or for `whoami`-style scripts
        run from a known network segment. Admin-gated.
      operationId: classifyNetPolicy
      security:
        - bearerAuth: []
      parameters:
        - name: remote_addr
          in: query
          required: true
          schema: { type: string }
          example: 10.0.0.5:54321
        - name: host
          in: query
          required: false
          schema: { type: string }
          example: api.internal.example.com
      responses:
        "200":
          description: |
            Classification result. Empty `class` means no policy
            matched (the request would fall through to the
            unclassified default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "501":
          description: '`netpolicy_not_configured`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/netpolicy/resolve-me:
    get:
      tags: [discovery]
      summary: Classify the caller's own (remote_addr, host).
      description: |
        Self-classifier — the server reads `r.RemoteAddr` + `r.Host`
        and runs them through the classifier. SPAs / agents use it
        to discover "which JWKS / callback URL should I use" without
        re-implementing the classifier. Intentionally open: this is
        the client-facing "what network am I from" lookup.
      operationId: resolveMeNetPolicy
      responses:
        "200":
          description: Classification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "501":
          description: '`netpolicy_not_configured`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/authz/policy-bundle:
    get:
      tags: [admin]
      summary: Export the role-definition authorization policy bundle.
      description: |
        Read-only export of the permissions role-DEFINITION model as a
        portable JSON bundle a service-mesh sidecar (OPA/Cedar/custom)
        pulls to enforce authorization LOCALLY — no per-request Authorizer
        RPC. The bundle carries ONLY role definitions (code →
        permissions[]) plus the static wildcard match semantics, NOT the
        per-subject role assignments: a sidecar already has the caller's
        roles from the token (the SSO server embeds them when
        `WithEmbedPermissionsInLogin` is set), so the bundle stays
        O(roles) and contains no subject PII.

        Admin-gated — the admin middleware enforces `admin:read` (the path
        sits under `/api/v1/admin/`). Cacheable read (NOT a credential
        endpoint): stamps `public` Cache-Control + a strong content-based
        ETag (sha256 over the canonical role bytes, EXCLUDING
        `generated_at`) so the same role set yields the same ETag across
        regenerations; honors `If-None-Match` → 304. The cache is
        invalidated on any role/menu mutation (locally and, when an
        invalidation bus is wired, cluster-wide) so a sidecar's next pull
        sees a change before the cache TTL (`WithAuthzPolicyBundleCacheTTL`,
        default 5m). A reference OPA Rego that reproduces the wildcard
        match lives in `docs/examples/opa-authz-policy.rego`.
      operationId: getAuthzPolicyBundle
      security:
        - bearerAuth: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
          description: The app whose role definitions to export.
      responses:
        "200":
          description: The role-definition policy bundle.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<ttl>` when caching is enabled.'
            ETag:
              schema:
                type: string
              description: Short sha256 prefix over the canonical role bytes (stable across rebuilds with unchanged roles).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthzPolicyBundle"
        "304":
          description: Not Modified — roles unchanged since the supplied If-None-Match.
        "400":
          description: '`missing_client_id` — `client_id` query parameter absent.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Bearer lacks the `admin:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '`client_not_found` — no such client.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: '`internal_error` — provider read or render failure.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/storage-health:
    get:
      tags: [admin]
      summary: Per-store storage-health report (reachability + schema version + latency).
      description: |
        Read-only per-store health report for operators: for every wired
        store (identity / oauth / audit / tenant / permissions / webauthn /
        mfa / …) it reports reachability (a timed Ping → `reachable` +
        `ping_latency_ms`) and, for SQLite-backed stores, the schema version
        per migrate namespace (`schema_versions`). This is the detailed
        counterpart to `/readyz`'s pass/fail aggregate — the view needed for
        DR drills and rolling-upgrade safety (which store is on which schema,
        which is slow, which is down).

        Returns `200` with a per-store status array even when individual
        stores are unreachable: a store that fails Ping reports
        `reachable: false` plus an operator-facing `error` string (a generic
        reachability message — never the DSN or any secret), while the
        healthy stores still report normally. One store being down does NOT
        fail the whole report.

        Admin-gated — the admin middleware enforces `admin:read` (the path
        sits under `/api/v1/admin/`). Opt-in via `WithStorageHealth`; the
        route is not mounted (404) when no sources are wired (an all-memory
        deployment).
      operationId: getStorageHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The per-store storage-health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHealthReport"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Bearer lacks the `admin:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/backup:
    post:
      tags: [admin]
      summary: Trigger an online VACUUM INTO backup of every registered SQLite source.
      description: |
        Runs `VACUUM INTO` against each registered `BackupSource` and
        writes a timestamped snapshot file
        (`<BackupFilePrefix><source>-<UTC stamp>.db`) into the configured
        destination directory (`backup.dir` / `WithBackupDir`; defaults to
        the OS temp dir). Filenames use a fixed-width UTC timestamp so
        lexicographic order equals chronological order — this is what the
        optional retention pruner (`backup.keep` / `WithBackupRetention`)
        relies on when deleting all but the newest N files per source.

        Returns `200` with a per-source result array even when an
        individual source fails: a failed `BackupTo` reports
        `status: "failed"` only (detail goes to the server log, not the
        response — same fail-open contract as `/api/v1/admin/storage-health`).
        A successful source reports `path`, `size_bytes`, and
        `duration_ms`; when retention is enabled it also reports `pruned`
        (count of files removed for that source).

        Admin-gated — the admin middleware enforces `admin:write` (the
        path sits under `/api/v1/admin/`). Opt-in via one or more
        `WithBackupSource` calls; the route is not mounted (404) when no
        sources are wired.
      operationId: triggerBackup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The per-source backup result summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupReport"
        "401":
          description: Missing / invalid admin bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Bearer lacks the `admin:write` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---- Admin gRPC services exposed via grpc-gateway ----
  #
  # Every endpoint below requires the AdminMiddleware Bearer-validated
  # admin:read (GET) or admin:write (POST/PUT/DELETE) scope. The wire
  # contract is the gRPC-defined message shape — see proto/admin/v1/*.
  # Mutations fire the matching admin_* audit event automatically.

  /api/v1/admin/snapshots:
    post:
      tags: [admin]
      summary: Export a snapshot of operator-managed state.
      description: |
        Pulls every wired backend's data (clients, users, roles,
        assignments, menus, network policies, plus the bootstrap
        Tracker high-water mark) and writes the resulting envelope
        to the configured snapshot.storage backend. Returns the
        header projection (size, codec, encryption alg, ...) plus
        the storage key.
      operationId: snapshotExport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportSnapshotRequest"
      responses:
        "200":
          description: Snapshot exported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportSnapshotResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [admin]
      summary: List stored snapshots.
      description: |
        Returns each snapshot's header projection. Body resources
        live encrypted inside the envelope; fetch one via Get.
      operationId: snapshotList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshots list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSnapshotsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/snapshots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a single snapshot (header + decoded resources).
      operationId: snapshotGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Snapshot envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSnapshotResponse"
        "404":
          description: '`snapshot_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a stored snapshot.
      operationId: snapshotDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/snapshots/{id}:restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Restore a snapshot.
      description: |
        Replays a snapshot's resources into wired backends. Modes:
        `merge` (insert-only; default), `overwrite` (upsert),
        `replace` (wipe + seed — requires `confirm` equal to the
        snapshot id so accidental drops can't happen). `dry_run`
        returns counts only without persisting. `advance_bootstrap`
        bumps the Tracker high-water to the snapshot's recorded
        version (skip already-covered seeds on the same boot).
      operationId: snapshotRestore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreSnapshotRequest"
      responses:
        "200":
          description: Restore report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreSnapshotResponse"
        "400":
          description: |
            `confirmation_required` / `confirmation_mismatch` (mode=replace
            without a matching `confirm`) or `unknown_schema_version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '`snapshot_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/releases:
    post:
      tags: [admin]
      summary: Register a paired frontend+backend release.
      description: |
        Stores a Release definition (no pin). Operators later call
        Pin to make it current. At least one of `git_ref` / `uri`
        MUST be set on each Artifact half.
      operationId: releaseRegister
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReleaseRequest"
      responses:
        "200":
          description: Release registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterReleaseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [admin]
      summary: List registered releases.
      operationId: releaseList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Releases list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListReleasesResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/releases:current:
    get:
      tags: [admin]
      summary: Fetch the currently-pinned release.
      description: |
        Returns the active release plus the pin time / pinner. The
        `release` field is unset when nothing is pinned (fresh
        install).
      operationId: releaseGetCurrent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current release (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentReleaseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/releases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a single release by id.
      operationId: releaseGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetReleaseResponse"
        "404":
          description: '`release_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a registered release.
      operationId: releaseDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/releases/{id}:pin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Pin (make current) a registered release.
      description: |
        Forward pin: backend-first ordering. Rejects pins that
        regress schema_version (use Rollback). Health probe gates
        when wired; an all-fail probe triggers auto-rollback.
      operationId: releasePin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pin report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinReleaseResponse"
        "400":
          description: '`schema_regress` — use the Rollback endpoint instead.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/releases/{id}:rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Rollback to a previously-pinned release.
      description: |
        Reverse pin: frontend-first ordering. Triggers the
        SnapshotRestorer hook when the target's `config_snapshot`
        is non-empty (admin state restored BEFORE the Pinner
        flips). No probe gating on Rollback by design.
      operationId: releaseRollback
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rollback report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinReleaseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants:
    get:
      tags: [admin]
      summary: List tenants.
      operationId: tenantList
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenants list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create a tenant.
      description: |
        Body MUST set status to a known value (`active` /
        `suspended`); SetStatus is the only RPC that mutates it
        post-create so accidental backdoor suspensions via Update
        can't happen.
      operationId: tenantCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenant"
      responses:
        "200":
          description: Created tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a tenant.
      operationId: tenantGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTenantResponse"
        "404":
          description: '`tenant_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      summary: Update a tenant (preserves status).
      description: |
        Update intentionally ignores body `status` — operators MUST
        use SetStatus to flip suspension, so the cache invalidation
        callback fires. UpdateTenant changes name / slug / settings
        only.
      operationId: tenantUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Tenant"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTenantResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a tenant.
      description: |
        Fires the cache invalidation callback so the deleted
        tenant re-resolves as "no tenant" on the next request
        rather than staying cached as Active until TTL expiry.
      operationId: tenantDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants/{id}/usage:
    get:
      tags: [admin]
      summary: Per-tenant usage/metering report.
      description: |
        Returns aggregated usage for the tenant over a period (logins, tokens
        issued, active users, MFA challenges), computed from the audit_events
        table. Admin-gated (admin:read) via the /api/v1/admin/ prefix. Mounted
        only when a usage aggregator is wired (tenant.usage_metering).
      operationId: getTenantUsage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [day, month], default: day }
        - name: start
          in: query
          required: false
          description: "Start date YYYY-MM-DD (default: today UTC)."
          schema: { type: string, format: date }
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing tenant id or malformed period/start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/usage/top-tenants:
    get:
      tags: [admin]
      summary: Top-tenants usage leaderboard.
      description: |
        Returns the N tenants with the most successful logins over a period,
        with the same aggregated counters as the per-tenant usage report
        (logins, tokens issued, active users, MFA challenges), computed from
        the audit_events table. Admin-gated (admin:read) via the
        /api/v1/admin/ prefix. Mounted only when a usage aggregator is wired
        (tenant.usage_metering).
      operationId: getAdminTopTenants
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [day, month], default: day }
        - name: start
          in: query
          required: false
          description: "Start date YYYY-MM-DD (default: today UTC)."
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          description: "Number of tenants to return."
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        "200":
          description: Top-tenants usage leaderboard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  tenants:
                    type: array
                    items: { type: object }
                  total: { type: integer }
        "400":
          description: Malformed period/start/limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/tenants/{id}:set-status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Flip a tenant's suspension status.
      description: |
        The surgical entry point for suspension changes. Fires the
        cache invalidation callback so the flip takes effect on the
        next request (not just after the suspension-check TTL
        expires). Status MUST be `active` or `suspended`.
      operationId: tenantSetStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTenantStatusRequest"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetTenantStatusResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/domains:
    get:
      tags: [admin]
      summary: List domains (hostname → tenant mappings).
      operationId: domainList
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: { type: string }
          description: Filter to one tenant; empty returns every domain.
      responses:
        "200":
          description: Domains list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDomainsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create a domain.
      operationId: domainCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Domain"
      responses:
        "200":
          description: Created domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDomainResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/domains/{hostname}:
    parameters:
      - name: hostname
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a domain.
      operationId: domainGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDomainResponse"
        "404":
          description: '`domain_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      summary: Update a domain.
      operationId: domainUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Domain"
      responses:
        "200":
          description: Updated domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDomainResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a domain.
      operationId: domainDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/clients:
    get:
      tags: [admin]
      summary: List registered clients.
      description: |
        `secret` is write-only — never returned on List/Get. Use
        RotateSecret to mint a fresh secret an operator can copy
        once.

        Results are filtered, then sorted, then paged — `order_by`
        and `filter` MUST be held constant across a paging sequence
        (the page_token offset is only valid against that same
        filtered+sorted view). Default sort is `id` ascending.
      operationId: adminClientList
      security:
        - bearerAuth: []
      parameters:
        - name: page_token
          in: query
          required: false
          schema: { type: string }
          description: |
            Opaque cursor from a previous response's
            `next_page_token`. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema: { type: integer, format: int32 }
          description: |
            Max rows to return. Default 100, clamped to a maximum
            of 1000. Values <= 0 fall back to the default.
        - name: order_by
          in: query
          required: false
          schema: { type: string }
          description: |
            One of `id`, `name`, `created_at` (alias for `id` —
            clients have no created_at field), optionally prefixed
            with `-` for descending. Defaults to `id` ascending.
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: |
            `field:value` or `field eq value`. Supported fields:
            `id`, `name` (substring), `active` (bool). Omit to
            match all.
      responses:
        "200":
          description: Clients list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClientsResponse"
        "400":
          description: '`invalid page_token`, or an unsupported `order_by`/`filter` field or value.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create a client.
      operationId: adminClientCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClient"
      responses:
        "200":
          description: Created client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClientResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a client (secret cleared).
      operationId: adminClientGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAdminClientResponse"
        "404":
          description: '`client_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      summary: Update a client.
      operationId: adminClientUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminClient"
      responses:
        "200":
          description: Updated client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateClientResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a client.
      operationId: adminClientDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/clients/{id}/rotate-secret:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Mint a fresh client_secret.
      description: |
        Returns the new secret ONCE; the caller MUST capture it
        immediately. Subsequent Get / List responses will not
        re-emit it. Audit event `admin_client_rotate_secret`
        records the rotation.
      operationId: adminClientRotateSecret
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List users.
      description: |
        Results are filtered, then sorted, then paged — `order_by`
        and `filter` MUST be held constant across a paging sequence
        (the page_token offset is only valid against that same
        filtered+sorted view). Default sort is `id` ascending.
      operationId: adminUserList
      security:
        - bearerAuth: []
      parameters:
        - name: page_token
          in: query
          required: false
          schema: { type: string }
          description: |
            Opaque cursor from a previous response's
            `next_page_token`. Omit for the first page.
        - name: page_size
          in: query
          required: false
          schema: { type: integer, format: int32 }
          description: |
            Max rows to return. Default 100, clamped to a maximum
            of 1000. Values <= 0 fall back to the default.
        - name: order_by
          in: query
          required: false
          schema: { type: string }
          description: |
            One of `id`, `created_at`, `provider`, optionally
            prefixed with `-` for descending. Defaults to `id`
            ascending. Unlike the clients endpoint, `created_at` is
            a real field here (users have one).
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: |
            `field:value` or `field eq value`. Supported fields:
            `id`, `provider`, `external_id` (exact), `name`,
            `email` (substring). Omit to match all.
      responses:
        "200":
          description: Users list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
        "400":
          description: '`invalid page_token`, or an unsupported `order_by`/`filter` field or value.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create a user.
      operationId: adminUserCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUser"
      responses:
        "200":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Fetch a user.
      operationId: adminUserGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAdminUserResponse"
        "404":
          description: '`user_not_found`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [admin]
      summary: Update a user.
      operationId: adminUserUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUser"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Delete a user.
      operationId: adminUserDelete
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a user's active sessions.
      description: |
        Session-strategy only; JWT-strategy users have no listable
        sessions (stateless). For JWT-only deployments operators
        rely on the audit log of issuance events.
      operationId: adminUserListSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUserSessionsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/consents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a user's consent grants (helpdesk).
      description: |
        Which applications the user has authorized. admin:read. Reuses the same
        ConsentStore the user's own /consents/me reads, so admin + user see one
        consistent view. Mounted only when a ConsentStore is wired.
      operationId: adminUserListConsents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's consent grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string }
                        client_id: { type: string }
                        scopes: { type: array, items: { type: string } }
                        granted_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/consents/{client_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: client_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Revoke a user's consent for an app (helpdesk).
      description: |
        Removes the user's authorization for the given client on their behalf.
        admin:write; emits admin_consent_revoked. A missing grant returns 404.
      operationId: adminUserRevokeConsent
      security:
        - bearerAuth: []
      responses:
        "204": { description: Grant revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such grant for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/users/{id}/mfa:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a user's registered second factors (helpdesk).
      description: |
        admin:read. Reuses the same MFAEnrollmentStore the user's own /me/mfa
        reads. Mounted only when an MFAEnrollmentStore is wired.
      operationId: adminUserListMFA
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's second factors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        method: { type: string }
                        label: { type: string }
                        added_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/mfa/{factor_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: factor_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Unbind a user's second factor (helpdesk MFA reset).
      description: |
        Removes a factor on the user's behalf — the "user lost their phone,
        reset their MFA" flow. admin:write; emits admin_mfa_factor_removed. A
        factor the user doesn't have returns 404 (ownership enforced via the
        user-scoped list).
      operationId: adminUserRemoveMFA
      security:
        - bearerAuth: []
      responses:
        "204": { description: Factor unbound. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such factor for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/users/{id}/mfa/recovery-codes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Reset a user's MFA recovery codes (helpdesk).
      description: |
        Revokes ALL of the user's remaining recovery codes — the "lost my codes"
        helpdesk flow. admin:write; emits admin_recovery_codes_reset. NEVER
        returns codes to the operator (a user's credentials must not be exposed
        to helpdesk); the user regenerates their own via
        `POST /me/mfa/recovery-codes`. Mounted only when a recovery-code store is
        wired.
      operationId: adminUserResetRecoveryCodes
      security:
        - bearerAuth: []
      responses:
        "204": { description: Recovery codes revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Set a user's password (helpdesk reset).
      description: |
        Sets the user's password on their behalf — the helpdesk "reset this
        user's password" flow. admin:write; emits admin_password_reset (never
        the password). Writes the same credential the self-service
        /me/password change does, so it takes effect on the user's next login.
        Mounted only when a PasswordCredentialStore is wired.
      operationId: adminUserResetPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string }
      responses:
        "204": { description: Password set. }
        "400":
          description: Missing new_password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/email:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Force-set a user's email (operational recovery).
      description: |
        Force-sets the user's email directly — the operational-recovery path
        (onboarding typo, domain migration) that bypasses the user-facing
        verified email-change flow (POST /me/email/change+verify), which requires
        the user to prove control of the new address. admin:write; emits
        admin_user_email_changed (never the email value — it is PII). A missing
        user is a 404. Mounted only when a UserProvider is wired.
      operationId: adminUserSetEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: Email set. }
        "400":
          description: Missing email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/account-lockout/clear:
    post:
      tags: [admin]
      summary: Clear a brute-force account lockout (helpdesk unlock).
      description: |
        Clears an account lockout so a legitimately-locked user can retry
        immediately, without waiting out the auto-unlock duration. admin:write;
        emits admin_account_unlocked. The lockout is keyed on
        `<client_id>:<identifier>` (the credential the user authenticates with),
        NOT the userID — so both `client_id` and `identifier` are required.
        Idempotent (clearing a non-locked key succeeds). Mounted only when an
        AccountLockout is wired.
      operationId: adminClearAccountLockout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, identifier]
              properties:
                client_id: { type: string }
                identifier: { type: string, description: "the locked login identifier (username/email/phone as used at login)" }
      responses:
        "204": { description: Lockout cleared. }
        "400":
          description: Missing client_id or identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/connections:
    get:
      tags: [admin]
      summary: List a tenant's B2B enterprise connections.
      description: |
        Lists the enterprise connections for `tenant_id` (required — the store
        indexes by tenant; there is no cross-tenant list). admin:read. Mounted
        only when a connection store is wired.
      operationId: adminListConnections
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The tenant's connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "400": { description: Missing tenant_id. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Create or replace a B2B enterprise connection.
      description: |
        Upserts a connection (and its email-domain routing) at runtime so an
        operator can onboard a new org's upstream IdP without a redeploy.
        admin:write. Requires id + tenant_id; type must be `oidc` or `saml`.
        Emits admin_connection_upserted. Mounted only when a connection store is
        wired.
      operationId: adminUpsertConnection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Connection" }
      responses:
        "200":
          description: The upserted connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400":
          description: Missing id/tenant_id or invalid type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: Get a B2B enterprise connection by id.
      operationId: adminGetConnection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [admin]
      summary: Delete a B2B enterprise connection.
      description: |
        Removes the connection (and its domain routing). admin:write. Idempotent
        (a missing id succeeds). Emits admin_connection_deleted.
      operationId: adminDeleteConnection
      security:
        - bearerAuth: []
      responses:
        "204": { description: Connection deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a tenant's org roster (B2B membership).
      description: |
        Lists the org membership roster for a tenant — explicit (tenant, user)
        edges with an org role, distinct from SCIM app-role groups. admin:read.
        Mounted only when a TenantUserStore is wired.
      operationId: adminListTenantMembers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The org roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/TenantMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants/{id}/members/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Add a user to an org or change their org role.
      description: |
        Upserts a user's org membership (member|admin|guest; defaults to member).
        admin:write. Idempotent. Emits admin_tenant_member_added.
      operationId: adminPutTenantMember
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [member, admin, guest] }
      responses:
        "200": { description: Membership upserted. }
        "400":
          description: Missing ids or invalid role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Remove a user from an org.
      description: |
        Removes the user's org membership. admin:write. Idempotent. Emits
        admin_tenant_member_removed.
      operationId: adminRemoveTenantMember
      security:
        - bearerAuth: []
      responses:
        "204": { description: Membership removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/organizations:
    get:
      tags: [self-service]
      summary: List the orgs the authenticated user belongs to.
      description: |
        Returns the bearer subject's org memberships (B2B). `Cache-Control:
        no-store`. Mounted only when a TenantUserStore is wired.
      operationId: listMyOrganizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's org memberships.
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/TenantMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/organizations/{tenant_id}:
    delete:
      tags: [self-service]
      summary: Leave an organization (self-service).
      description: |
        The authenticated user leaves an org without admin intervention.
        Idempotent. `Cache-Control: no-store`. Emits org_left.
      operationId: leaveMyOrganization
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Left the organization. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tenants/{id}/invitations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a tenant's pending org invitations (no token value).
      description: |
        Lists pending org invitations (email + role + expiry). admin:read. NEVER
        returns the token value. Mounted only when an InvitationStore is wired.
      operationId: adminListInvitations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending invitations (metadata only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        role: { type: string, enum: [member, admin, guest] }
                        expires_at: { type: string, format: date-time }
                        expired: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Send an org invitation.
      description: |
        Mints a single-use invitation token and delivers it to the invited email
        via the configured InvitationSender. admin:write. Body: {email, role}
        (role member|admin|guest; default member). The token is NEVER returned —
        501 when no sender is wired. Emits invitation_sent.
      operationId: adminSendInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [member, admin, guest] }
      responses:
        "202": { description: Invitation sent. }
        "400":
          description: Missing email or invalid role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: No InvitationSender is wired. }

  /api/v1/admin/tenants/{id}/invitations/{email}:
    delete:
      tags: [admin]
      summary: Revoke every pending invitation for a recipient email.
      description: |
        Bulk-deletes all pending invitation tokens for (tenant, email) —
        re-sends can leave multiple live tokens per recipient. Idempotent:
        returns 204 whether or not anything was pending (no
        pending-invitation oracle). Requires admin:write.
      operationId: adminRevokeInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitations revoked (or none pending).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/invitations/accept:
    post:
      tags: [self-service]
      summary: Accept an org invitation (join the org).
      description: |
        The authenticated subject redeems a single-use invitation token and joins
        the invited org at the invited role. `Cache-Control: no-store`. Oracle-safe:
        unknown / expired / already-consumed token all collapse to one
        `invitation_invalid`. Emits invitation_accepted. Mounted only when both an
        InvitationStore and a TenantUserStore are wired.
      operationId: acceptInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Joined the org.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  role: { type: string }
        "400":
          description: invitation_invalid (any failure — oracle-safe).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/users/{id}/device-secrets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Revoke a user's Native SSO device secrets (lost-device lockout).
      description: |
        Revokes ALL of the user's outstanding Native SSO device-secret bindings
        — the "lost/compromised device, cut off Native SSO token minting now"
        lockout (admin session/token revocation does not reach these, since the
        device-secret exchange validates a stateless id_token). admin:write;
        emits admin_device_secrets_revoked. Mounted only when a DeviceSecretStore
        that supports revoke-by-subject is wired (else 501).
      operationId: adminUserRevokeDeviceSecrets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of device-secret bindings revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: The wired DeviceSecretStore cannot revoke by subject.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/users/{id}/password-reset-tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a user's pending forgot-password tokens (no token value).
      description: |
        Lists the user's outstanding reset tokens with their expiry so a helpdesk
        can check "I didn't get the reset email". admin:read. NEVER returns the
        token value (it is a live credential) — only expires_at + an expired
        flag. 501 when the wired store cannot list.
      operationId: adminUserListPasswordResetTokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending reset tokens (metadata only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        expires_at: { type: string, format: date-time }
                        expired: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: The wired PasswordResetStore cannot list. }
    delete:
      tags: [admin]
      summary: Revoke a user's pending forgot-password tokens.
      description: |
        Invalidates ALL of the user's outstanding forgot-password reset tokens
        without waiting for TTL expiry — the recovery path when a token was sent
        to the wrong address, leaked, or the user lost access to the delivery
        channel. admin:write; emits admin_password_reset_tokens_revoked with the
        count. Idempotent (no pending tokens returns 0). Mounted only when a
        PasswordResetStore is wired; 501 when the wired store cannot revoke by
        user.
      operationId: adminUserRevokePasswordResetTokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of reset tokens revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: The wired PasswordResetStore cannot revoke by user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/users/{id}/email-change-tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List a user's pending email-change tokens (no token value).
      description: |
        Lists the user's outstanding email-change tokens with their target
        address + expiry for verification-loop debugging. admin:read. NEVER
        returns the token value — only new_email, expires_at, and an expired
        flag. 501 when the wired store cannot list.
      operationId: adminUserListEmailChangeTokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending email-change tokens (metadata only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        new_email: { type: string }
                        expires_at: { type: string, format: date-time }
                        expired: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: The wired EmailChangeStore cannot list. }
    delete:
      tags: [admin]
      summary: Revoke a user's pending email-change verification tokens.
      description: |
        Invalidates ALL of the user's outstanding email-change verification
        tokens — the recovery path for a token sent to the wrong address or an
        email-ownership dispute. admin:write; emits
        admin_email_change_tokens_revoked with the count. Idempotent. Mounted
        only when an EmailChangeStore is wired; 501 when the wired store cannot
        revoke by user.
      operationId: adminUserRevokeEmailChangeTokens
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of email-change tokens revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: The wired EmailChangeStore cannot revoke by user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/tokens/sessions:
    get:
      tags: [admin]
      summary: List active session-backed tokens.
      operationId: adminTokenListSessions
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string }
          description: Filter to one user; empty returns every active session.
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSessionsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tokens/revoke:
    post:
      tags: [admin]
      summary: Revoke a token or session.
      description: |
        Supply either `token` (raw access token or session id) OR
        `session_id`. Response reports what was revoked — `token`,
        `session`, or `both`.
      operationId: adminTokenRevoke
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTokenRevokeRequest"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenRevokeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/tokens/temp:
    post:
      tags: [admin]
      summary: Issue a temp token for a user.
      description: |
        Operator-driven one-time token bound to a user — password
        resets, magic-link distribution, first-login flows.
        TTL is server-side via authenticators.temp_token.ttl.
        Display the returned token ONCE; never echo it back.
      operationId: adminTokenIssueTemp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTempTokenRequest"
      responses:
        "200":
          description: Temp token (display once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueTempTokenResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/roles:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List roles for a client.
      operationId: permissionListRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Roles list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRolesResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin]
      summary: Add a role to the client's role registry.
      operationId: permissionAddRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Added role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddRoleResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/roles/{role_code}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
      - name: role_code
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Update a role.
      operationId: permissionUpdateRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRoleResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [admin]
      summary: Remove a role.
      operationId: permissionRemoveRole
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/assignments:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: List role assignments for a client.
      operationId: permissionListAssignments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAssignmentsResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/assignments/{user_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Assign roles to a user (additive).
      operationId: permissionAssignRoles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRolesRequest"
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/assignments/{user_id}/unassign:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      summary: Unassign roles from a user.
      operationId: permissionUnassignRoles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnassignRolesRequest"
      responses:
        "200":
          description: Unassigned.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/permissions/{client_id}/menus:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Set the menu tree for a client.
      description: |
        Replaces the client's menu tree wholesale. Items carry a
        `permission` field — login responses filter the tree to
        items the caller can access (when permissions.embed_in_login
        is on).
      operationId: permissionSetMenus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMenusRequest"
      responses:
        "200":
          description: Menus updated.
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/scim/v2/ServiceProviderConfig:
    get:
      tags: [scim]
      summary: SCIM service-provider configuration (RFC 7643 §5).
      description: |
        Advertises the supported SCIM features (patch, filter,
        pagination caps, etc.). Admin-gated — `admin:read`. Response is
        `application/scim+json`.
      operationId: scimServiceProviderConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service-provider configuration.
          content:
            application/scim+json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/ScimUnauthorized" }

  /api/v1/scim/v2/Schemas:
    get:
      tags: [scim]
      summary: SCIM resource schemas (RFC 7643 §7).
      description: |
        Returns the implemented resource schemas (always `User`; `Group`
        only when `scim.groups.enabled`) wrapped in the SCIM
        `ListResponse` envelope. Admin-gated — `admin:read`.
      operationId: scimSchemas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Schema ListResponse.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }

  /api/v1/scim/v2/Bulk:
    post:
      tags: [scim]
      summary: SCIM bulk operations (RFC 7644 §3.7).
      description: |
        Applies many resource operations (POST/PUT/PATCH/DELETE on Users +
        Groups) in one request. Each operation is replayed through the
        per-resource handlers, so the same validation/uniqueness/audit rules
        apply. A POST operation MUST carry a `bulkId`; later operations may
        reference a just-created resource via `bulkId:<id>` in their `path` or
        `data`. `failOnErrors` stops after N errored operations. Limits
        (`maxOperations`, `maxPayloadSize`) are advertised in
        ServiceProviderConfig. Admin-gated — `admin:write`. Response is
        `application/scim+json`; the overall status is 200 and each operation
        carries its own `status`.
      operationId: scimBulk
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [schemas, Operations]
              properties:
                schemas:
                  type: array
                  items: { type: string }
                failOnErrors: { type: integer }
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      method: { type: string, enum: [POST, PUT, PATCH, DELETE] }
                      bulkId: { type: string }
                      path: { type: string }
                      data: { type: object }
      responses:
        "200":
          description: Bulk response; each operation carries its own status.
          content:
            application/scim+json:
              schema:
                type: object
        "400":
          description: Malformed BulkRequest or empty Operations.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "413":
          description: Operation count or payload exceeds the advertised limits.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /api/v1/scim/v2/Me:
    get:
      tags: [scim]
      summary: The authenticated subject's own SCIM User resource (RFC 7644 §3.11).
      description: |
        Alias that resolves to the bearer's own user resource — GET reads it,
        PUT replaces, PATCH modifies, DELETE removes. The server derives the
        subject from the authenticated request; clients send no id. Returns 501
        when the deployment hasn't wired subject resolution. Admin-gated like
        the rest of SCIM. Response is `application/scim+json`.
      operationId: scimMeGet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's User resource.
          content:
            application/scim+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: The caller has no provisioned User resource.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "501":
          description: /Me subject resolution not enabled on this deployment.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    put:
      tags: [scim]
      summary: Replace the authenticated subject's own SCIM User (RFC 7644 §3.11).
      operationId: scimMePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object }
      responses:
        "200":
          description: Updated User resource.
          content:
            application/scim+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "501":
          description: /Me subject resolution not enabled.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      tags: [scim]
      summary: Modify the authenticated subject's own SCIM User (RFC 7644 §3.11).
      operationId: scimMePatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { type: object }
      responses:
        "200":
          description: Updated User resource.
          content:
            application/scim+json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "501":
          description: /Me subject resolution not enabled.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    delete:
      tags: [scim]
      summary: Delete the authenticated subject's own SCIM User (RFC 7644 §3.11).
      operationId: scimMeDelete
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "501":
          description: /Me subject resolution not enabled.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /api/v1/scim/v2/Users:
    get:
      tags: [scim]
      summary: List / search SCIM Users (RFC 7644 §3.4).
      description: |
        Returns Users in the SCIM `ListResponse` envelope. Supports the
        optional `filter` query parameter (RFC 7644 §3.4.2.2) — applied
        BEFORE pagination so `totalResults` reflects the filtered set — and
        1-based `startIndex` / `count` pagination (§3.4.2.4; `count` is
        clamped to 200, default 100). Admin-gated — `admin:read`.
      operationId: scimListUsers
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          description: |
            SCIM filter expression (RFC 7644 §3.4.2.2), e.g.
            `userName eq "alice"`. A malformed expression yields HTTP 400
            `invalidFilter`.
          example: userName eq "alice"
        - name: startIndex
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 1-based index of the first result (values < 1 are treated as 1).
        - name: count
          in: query
          schema: { type: integer, default: 100, maximum: 200 }
          description: Page size; clamped to 200. `count=0` returns only the total.
      responses:
        "200":
          description: User ListResponse.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          description: Malformed `filter` / `startIndex` / `count` (scimType invalidFilter or invalidValue).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
    post:
      tags: [scim]
      summary: Create a SCIM User (RFC 7644 §3.3).
      description: |
        Provisions a new User. `userName` is REQUIRED; the server mints the
        `id` (read-only). `userName` must be unique across users
        (HTTP 409 `uniqueness`). `active` defaults to true when omitted.
        Admin-gated — `admin:write`.
      operationId: scimCreateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: User created.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Missing `userName` / invalid SCIM JSON (scimType invalidValue or invalidSyntax).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "409":
          description: A user with that `userName` already exists (scimType uniqueness).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /api/v1/scim/v2/Users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Server-minted User resource id.
    get:
      tags: [scim]
      summary: Fetch one SCIM User (RFC 7644 §3.4.1).
      description: Admin-gated — `admin:read`.
      operationId: scimGetUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User resource.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown user id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    put:
      tags: [scim]
      summary: Replace a SCIM User (RFC 7644 §3.5.1).
      description: |
        Full overwrite of an EXISTING resource (PUT to an unknown id is a
        404, not an upsert). `userName` is REQUIRED; a body carrying a
        DIFFERENT `id` is a 400 `mutability` violation (id is read-only).
        `userName` uniqueness is enforced against other users (409). The
        creation timestamp is preserved. Admin-gated — `admin:write`.
      operationId: scimReplaceUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          description: User replaced.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Missing `userName`, invalid SCIM JSON, or a changed `id` (scimType invalidValue / invalidSyntax / mutability).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown user id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "409":
          description: "`userName` already used by another user (scimType uniqueness)."
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      tags: [scim]
      summary: Patch a SCIM User (RFC 7644 §3.5.2).
      description: |
        Applies an ordered list of `add`/`replace`/`remove` operations
        (all-or-nothing — a failing op aborts before any write). Supports
        top-level paths (`active`, `userName`, `displayName`, `externalId`,
        `emails`) and the nested `name.<sub>` form; an unsupported path is a
        400 `invalidPath`, and a `remove` with no path is a 400 `noTarget`.
        The common deprovision case (`replace active=false`) flows straight
        through. Admin-gated — `admin:write`.
      operationId: scimPatchUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          description: User patched.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: |
            Invalid PATCH (scimType invalidValue / invalidSyntax /
            invalidPath / noTarget / mutability), or empty Operations.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown user id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "409":
          description: Resulting `userName` collides with another user (scimType uniqueness).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    delete:
      tags: [scim]
      summary: Delete a SCIM User (RFC 7644 §3.6).
      description: |
        Deletes the User. DELETE on an unknown id is a 404 (not a silent
        204). Admin-gated — `admin:write`.
      operationId: scimDeleteUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User deleted (no body).
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown user id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /api/v1/scim/v2/Groups:
    get:
      tags: [scim]
      summary: List / search SCIM Groups (RFC 7644 §3.4).
      description: |
        Returns Groups in the SCIM `ListResponse` envelope, with the same
        `filter` / `startIndex` / `count` semantics as `/Users`. A SCIM
        Group maps onto a `permissions.Role`; members are the users
        assigned that role. Mounted ONLY when `scim.groups.enabled` (a
        `permissions.Provider` is wired) — otherwise the route is absent
        (404). Admin-gated — `admin:read`.
      operationId: scimListGroups
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          schema: { type: string }
          description: SCIM filter expression (RFC 7644 §3.4.2.2); malformed → 400 `invalidFilter`.
          example: displayName eq "admins"
        - name: startIndex
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: 1-based index of the first result.
        - name: count
          in: query
          schema: { type: integer, default: 100, maximum: 200 }
          description: Page size; clamped to 200.
      responses:
        "200":
          description: Group ListResponse.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          description: Malformed `filter` / pagination (scimType invalidFilter or invalidValue).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
    post:
      tags: [scim]
      summary: Create a SCIM Group (RFC 7643 §4.2).
      description: |
        Provisions a new Group (a `permissions.Role`). `displayName` is
        REQUIRED; the server mints the `id`. Mounted only when
        `scim.groups.enabled`. Admin-gated — `admin:write`.
      operationId: scimCreateGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "201":
          description: Group created.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          description: Missing `displayName` / invalid SCIM JSON (scimType invalidValue or invalidSyntax).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "409":
          description: A group with that id already exists (scimType uniqueness).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

  /api/v1/scim/v2/Groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Group resource id (the underlying role code).
    get:
      tags: [scim]
      summary: Fetch one SCIM Group.
      description: Mounted only when `scim.groups.enabled`. Admin-gated — `admin:read`.
      operationId: scimGetGroup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Group resource.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown group id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    put:
      tags: [scim]
      summary: Replace a SCIM Group (RFC 7644 §3.5.1).
      description: |
        Full overwrite of an EXISTING group (404 on unknown id).
        `displayName` is REQUIRED; a changed `id` is a 400 `mutability`
        violation. Mounted only when `scim.groups.enabled`. Admin-gated —
        `admin:write`.
      operationId: scimReplaceGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "200":
          description: Group replaced.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          description: Missing `displayName`, invalid SCIM JSON, or a changed `id` (scimType invalidValue / invalidSyntax / mutability).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown group id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    patch:
      tags: [scim]
      summary: Patch a SCIM Group (RFC 7644 §3.5.2).
      description: |
        Applies `add`/`replace`/`remove` operations to `displayName` or the
        `members` array (the group-membership delta connectors push).
        Unsupported path → 400 `invalidPath`; a `remove` with no path → 400
        `noTarget`. Mounted only when `scim.groups.enabled`. Admin-gated —
        `admin:write`.
      operationId: scimPatchGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          description: Group patched.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          description: Invalid PATCH (scimType invalidValue / invalidSyntax / invalidPath / noTarget).
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown group id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
    delete:
      tags: [scim]
      summary: Delete a SCIM Group (RFC 7644 §3.6).
      description: |
        Deletes the Group (role). DELETE on an unknown id is a 404.
        Mounted only when `scim.groups.enabled`. Admin-gated — `admin:write`.
      operationId: scimDeleteGroup
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Group deleted (no body).
        "401": { $ref: "#/components/responses/ScimUnauthorized" }
        "404":
          description: Unknown group id.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ed25519-signed JWT issued by `/auth/login`. Verify locally
        against `/.well-known/jwks.json` rather than round-tripping
        the server.

  responses:
    BadRequest:
      description: Malformed request body or missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ScimUnauthorized:
      description: |
        Missing / invalid admin bearer (401), or a bearer lacking the
        required `admin:read` / `admin:write` scope (403). This response
        comes from the AdminMiddleware, which fronts the SCIM handler, so
        it carries the OAuth-style `{"error": ...}` body
        (`missing_token` / `invalid_token` / `forbidden`) and a
        `WWW-Authenticate: Bearer realm="admin"` challenge — NOT the SCIM
        `application/scim+json` envelope (the request never reaches the
        SCIM handler).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    HealthResponse:
      type: object
      required: [status, issuer, version]
      properties:
        status:
          type: string
          example: ok
        issuer:
          type: string
          example: snaplink-sso
        version:
          type: string
          description: |
            Module version from runtime/debug.ReadBuildInfo. Falls
            back to "(devel)" for non-tagged builds or "(unknown)"
            when build info is absent — operators always see a
            value rather than an empty field.
          example: v0.42.1
        vcs_revision:
          type: string
          description: |
            Git commit SHA the binary was built from. Populated only
            when the binary was built with `-buildvcs=true` (default
            for `go build`) from a clean VCS tree. Useful to confirm
            which commit a production replica is running without
            shelling in.
          example: 9bfbe85f01c0fa7da2342f4d22cee8716ebe0b4d
        vcs_time:
          type: string
          description: |
            ISO 8601 commit timestamp, paired with vcs_revision when
            available.
          example: "2026-05-22T06:49:13Z"

    AuthorizationDetail:
      type: object
      required: [type]
      description: |
        One element of RFC 9396 Rich Authorization Requests
        (`authorization_details` parameter on /auth/login, /par,
        JAR). The `type` field is REQUIRED and gates which
        client-side action the user is authorizing — the SSO server
        validates membership in the client's
        `allowed_authorization_details_types` allowlist; element
        types not in the list reject the whole request with
        `invalid_authorization_details`.

        All other fields are TYPE-SPECIFIC and pass through unparsed
        — the server never inspects them, so consenting RPs +
        downstream resource servers are free to ship arbitrary
        domain-specific schemas under any `type`. RFC 9396 §3
        suggests common fields (`locations`, `actions`, `datatypes`,
        `identifier`, `privileges`); these are RECOMMENDATIONS, not
        requirements.

        The full JSON object (including extension fields) propagates
        verbatim into the issued access token's
        `authorization_details` claim — resource servers parse it
        with the same schema the RP used to submit.
      properties:
        type:
          type: string
          description: |
            URI or string identifying the action class. Allowlisted
            per-client via `allowed_authorization_details_types`.
          example: payment_initiation
        locations:
          type: array
          items: { type: string }
          description: |
            RFC 9396 §3.2 — URIs identifying resource servers the
            granted permission applies to. Server-side validation
            is type-specific (none enforced by default).
          example: ["https://api.bank.example/payments"]
        actions:
          type: array
          items: { type: string }
          description: |
            RFC 9396 §3.3 — action verbs (read, write, transfer).
            Type-specific; not parsed.
          example: ["initiate", "status"]
        datatypes:
          type: array
          items: { type: string }
          description: RFC 9396 §3.4 — data categories. Type-specific.
        identifier:
          type: string
          description: RFC 9396 §3.5 — opaque identifier scoping the grant.
        privileges:
          type: array
          items: { type: string }
          description: RFC 9396 §3.6 — privilege strings within the resource.
      additionalProperties: true

    LoginRequest:
      type: object
      required: [client_id]
      properties:
        provider:
          type: string
          description: Authenticator name; omit for discovery.
          example: password
        client_id:
          type: string
          description: Registered Client.ID (per cmd/sso-server/config.yaml `clients[]`).
          example: web-app
        credential:
          type: object
          additionalProperties:
            type: string
          description: |
            Provider-specific credential map. Standard keys:
            `username` + `password` (password), `target` + `code`
            (phone / email), `assertion` (keypair).
        scope:
          type: array
          items:
            type: string
        resource:
          type: array
          items: { type: string }
          description: |
            RFC 8707 resource indicators. Each value MUST be in the
            client's `allowed_resources`; downstream issuance
            populates the JWT `aud` claim from the merged set.
        authorization_details:
          type: array
          items:
            $ref: "#/components/schemas/AuthorizationDetail"
          description: |
            RFC 9396 Rich Authorization Requests. Each element MUST
            carry a non-empty `type` matching one of the client's
            `allowed_authorization_details_types`. The server validates
            structure + allowlist at /auth/login time; on issuance,
            the verbatim JSON propagates into the access token's
            `authorization_details` claim (preserving extension fields
            unparsed). Parse/allowlist failure surfaces as
            `invalid_authorization_details`.
        state:
          type: string
          description: Opaque value echoed back to redirect-based flows.

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, session_id]
      properties:
        access_token:
          type: string
          description: "Ed25519 JWT (when client uses `token_strategy: jwt`) or opaque session token (when `session`)."
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds.
        refresh_token:
          type: string
        scope:
          type: string
          description: Space-delimited scope list.
        session_id:
          type: string
          description: Server-side session handle for logout calls.
        token_strategy:
          type: string
          enum: [jwt, session]
        country_code:
          type: string
          description: ISO 3166-1 alpha-2; populated when geo middleware is wired.
        recommended_language:
          type: string
          description: BCP-47 tag; populated when geo middleware is wired.
        serving_region:
          type: string
          description: |
            Which regional deployment served this login (e.g. `eu-west-1`).
            A UX/governance hint, not a security signal. Present only when the
            region middleware is wired and resolved a non-empty serving region.
          example: eu-west-1
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: "Present when `permissions.embed_in_login: true`."
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: "Present when `permissions.embed_in_login: true`."
        menus:
          description: "Present when `permissions.embed_in_login: true`."
          allOf:
            - $ref: "#/components/schemas/MenuTree"

    LoginDiscoveryResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: string
          description: Authenticator names this client may use.

    MFARequiredResponse:
      type: object
      required: [error, mfa_challenge_id, mfa_methods, iss]
      properties:
        error:
          type: string
          enum: [mfa_required]
          description: |
            Sentinel value. Use this to branch — the rest of the
            response shape is pending-state, not failure-state.
        mfa_challenge_id:
          type: string
          description: |
            Opaque challenge id to pass back on `POST /auth/mfa`.
            Single-use, short-lived (default 5 minutes).
        mfa_methods:
          type: array
          items:
            type: string
          description: |
            Factor names the wired MFAProvider can verify. SPAs render
            UI per entry; mobile apps pick the strongest they support.
          example: [totp, webauthn]
        mfa_method_data:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
          description: |
            Per-method server-issued challenge data for factors needing
            two-call ceremonies (e.g. WebAuthn). The outer key is the
            method name (`webauthn`); the inner object carries the
            method-specific payload (for `webauthn`: `options` =
            CredentialAssertion options JSON, `session` = ceremony id).
            Methods that don't need server-side setup (`totp`) are
            absent — callers branch on key presence.

            Clients echo the relevant entries back into the
            `/auth/mfa` `params` payload so the provider's Verify can
            resume the ceremony (e.g. `params: {session: "<echo>",
            assertion: "<signed JSON>"}` for WebAuthn).

            Per-method Begin failure is non-fatal: the method stays
            in `mfa_methods` but its entry is omitted from
            `mfa_method_data` — the client either retries the begin
            phase out-of-band or picks a different factor.
          example:
            webauthn:
              options: '{"publicKey":{"challenge":"<base64url>","timeout":60000,"rpId":"sso.example.com","allowCredentials":[]}}'
              session: "sess-OPAQUE-256bit-id"
        iss:
          type: string
          description: RFC 9207 authorization-response issuer identifier.
        state:
          type: string
          description: Round-tripped from the original `/auth/login` request when set.

    MFACompleteRequest:
      type: object
      required: [mfa_challenge_id, mfa_method]
      properties:
        mfa_challenge_id:
          type: string
          description: |
            The opaque challenge id returned by `/auth/login` in the
            mfa_required response. crypto/rand-derived, single-use.
        mfa_method:
          type: string
          description: |
            One of the values from the `mfa_methods` array the
            mfa_required response advertised.
          example: totp
        code:
          type: string
          description: |
            TOTP code (RFC 6238) for the `totp` method. Six digits.
            Convenience field; equivalent to `params: {code: "..."}`.
          example: "012345"
        assertion:
          type: string
          description: |
            WebAuthn signed-assertion JSON (the response body
            navigator.credentials.get would have POSTed) for the
            `webauthn` method. Convenience field; equivalent to
            `params: {assertion: "..."}`.
        params:
          type: object
          additionalProperties:
            type: string
          description: |
            Method-specific parameter map. When Params is set it wins
            over the flat `code` / `assertion` convenience fields, so
            callers using arbitrary providers can pass whatever the
            provider expects.

            For `webauthn`: `session` MUST echo the value from the
            mfa_required response's
            `mfa_method_data["webauthn"]["session"]`, and `assertion`
            MUST be the raw JSON body navigator.credentials.get
            produced. The server-side WebAuthn helper parses both to
            verify the signed assertion against the per-ceremony
            challenge it issued during Begin.
          example:
            session: "sess-echoed-from-mfa_method_data"
            assertion: '{"id":"...","rawId":"...","type":"public-key","response":{"clientDataJSON":"...","authenticatorData":"...","signature":"...","userHandle":"..."}}'

    SendCodeRequest:
      type: object
      required: [provider, target]
      properties:
        provider:
          type: string
          enum: [phone, email]
        target:
          type: string
          description: Phone number (E.164) or email address.

    LogoutRequest:
      type: object
      properties:
        session_id:
          type: string

    CallbackResponse:
      type: object
      required: [session_id, status]
      properties:
        session_id:
          type: string
          description: |
            Single-use server-side session handle the SPA exchanges
            for a bearer or carries on subsequent /logout / /userinfo
            calls.
        status:
          type: string
          example: authenticated
          description: |
            Always `authenticated` on the 200 path — the constant lives
            in `consts.go` (`StatusAuthenticated`). Future statuses
            (e.g. `mfa_required`) would extend this enum.

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
            - client_credentials
            - urn:ietf:params:oauth:grant-type:device_code
            - urn:ietf:params:oauth:grant-type:token-exchange
          description: |
            Selects the grant branch. See the endpoint description
            for the required-field table.
        client_id:
          type: string
          description: |
            Public client identifier. Overridden by HTTP Basic
            credentials when both are supplied (RFC 6749 §2.3.1).
        client_secret:
          type: string
          description: |
            Confidential client secret. Body form discouraged in
            favor of HTTP Basic; supported for legacy compat.
        code:
          type: string
          description: Authorization code for `grant_type=authorization_code`.
        redirect_uri:
          type: string
          description: |
            MUST equal the `redirect_uri` registered at /auth/login
            time when one was supplied; rejected with
            `invalid_redirect_uri` on mismatch.
        code_verifier:
          type: string
          description: |
            RFC 7636 §4.5 PKCE verifier. Required when /auth/login
            supplied a `code_challenge`. Length bounds enforced
            server-side; any failure collapses to `invalid_grant`.
        refresh_token:
          type: string
          description: For `grant_type=refresh_token`.
        device_code:
          type: string
          description: For `grant_type=urn:ietf:params:oauth:grant-type:device_code`.
        scope:
          type: string
          description: Space-delimited scope request.
        resource:
          type: array
          items: { type: string }
          description: |
            RFC 8707 resource indicators. Repeat the form key for
            multiple values; in JSON, supply an array.
        subject_token:
          type: string
          description: |
            RFC 8693 subject_token — the token being exchanged. The
            server validates signature + expiry + audience + revocation
            via the standard validation path; an inactive token
            collapses to `invalid_grant`. When the subject token
            carries an `act` claim (i.e. it was itself a delegated
            token), the issued token's `act` PREPENDS the new actor
            and nests the previous chain underneath — outside-in
            reads walk delegation in time-order.
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:refresh_token
            - urn:ietf:params:oauth:token-type:id_token
            - urn:ietf:params:oauth:token-type:jwt
          example: urn:ietf:params:oauth:token-type:access_token
          description: |
            RFC 8693 §3 token-type URI naming the subject_token's
            shape. Determines which store / validator the SSO server
            looks the token up in.

            SPIFFE JWT-SVID (mesh service-to-service identity): when the
            server is configured with a SPIRE trust bundle
            (`WithSPIFFEJWTSVID`), a subject_token of type
            `urn:ietf:params:oauth:token-type:jwt` whose `sub` is a
            `spiffe://` URI is accepted as a JWT-SVID — validated against
            the trust-bundle JWKS with a strict asymmetric alg-allowlist
            (no `alg=none`), STRICT audience binding (the SVID `aud` MUST
            contain the configured SVID audience), and a trust-domain
            check. It is tried ONLY as a fallback after the local-issuer
            path, so a normal, locally-issued `:jwt` subject_token is
            unaffected. Every SVID validation failure collapses to
            `invalid_grant` (no per-cause oracle). When the feature is
            off, a spiffe-sub subject_token is rejected exactly like any
            other invalid subject_token.
        actor_token:
          type: string
          description: |
            RFC 8693 actor_token for delegation / impersonation. When
            supplied, the issued token carries an `act` claim naming
            this party's subject. `actor_token` + `actor_token_type`
            MUST both be present or both absent (mismatch =
            `invalid_request`). When a JTIReplayStore is wired and
            the actor_token has a `jti`, replay within the token's
            expiry window is rejected with `invalid_grant`.
        actor_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:jwt
            - urn:openid:params:token-type:device-secret
          description: |
            RFC 8693 token-type URI for the actor token.
            `urn:openid:params:token-type:device-secret` selects the OpenID
            Connect Native SSO 1.0 device-secret exchange: the subject_token
            MUST be an `id_token`, the actor_token is the `device_secret`, and
            the server validates the id_token's `ds_hash` against the secret +
            the stored binding before minting tokens (+ a fresh device_secret)
            for the requesting client. Requires `WithDeviceSecretStore` (else
            501 `device_secret_not_configured`); all validation failures
            collapse to `invalid_grant`. Otherwise only
            access_token + jwt are accepted (refresh / id_token
            as actor proofs are out-of-scope per §2.1's typical
            patterns).
        audience:
          type: array
          items: { type: string }
          description: |
            RFC 8693 audience list. Merged with `resource` (RFC 8707)
            into the issued token's `aud` claim; both parameter
            forms accepted to bridge legacy callers. The merged set
            is deduplicated in-order, validated against the client's
            `AllowedResources` (rejected with `invalid_target` on
            scope expansion).
        requested_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:refresh_token
          description: |
            RFC 8693 §2.1 — the token type the caller wants minted.
            Absent → defaults to access_token. Refresh-token output
            requires `WithRefreshTokenStore` wired (else
            `invalid_request` rather than silently minting an access
            token).
        acr_values:
          type: string
          description: |
            Space-delimited ACR list. On exchange, the dispatcher
            refuses to mint when the inbound `subject_token.acr`
            doesn't satisfy this demand (RFC 9470 step-up). Surfaces
            as `insufficient_user_authentication` — same wire shape
            resource servers issue, so SPAs branch uniformly.
        client_assertion:
          type: string
          description: |
            RFC 7521 + 7523 JWT bearer client authentication. Signed
            by a key in `Client.JWKS`. iss / sub MUST equal
            client_id; aud MUST include this AS issuer or the
            token endpoint URL.
        client_assertion_type:
          type: string
          enum:
            - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          description: |
            MUST be the jwt-bearer URN when `client_assertion` is
            supplied; otherwise rejected with `invalid_request`.

    TokenIssuance:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer, DPoP]
          description: |
            `Bearer` for the legacy path; `DPoP` when the issuance
            was DPoP-bound (RFC 9449 §5).
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
        refresh_token:
          type: string
          description: |
            Present when a refresh token was issued. Family-rotated
            on every grant=refresh_token call when
            `RefreshTokenFamilyTracker` is wired.
        scope:
          type: string
          description: Space-delimited granted scopes.
        id_token:
          type: string
          description: |
            Present when the client requested `openid` scope and
            `WithIDTokenIssuer` is wired. RFC 9068-shaped JWT. Carries a
            `ds_hash` claim when a `device_secret` accompanies it (Native SSO).
        device_secret:
          type: string
          description: |
            OpenID Connect Native SSO 1.0: present when the client requested the
            `device_sso` scope and `WithDeviceSecretStore` is wired. A second
            native app exchanges it (as a device-secret actor_token, with this
            response's id_token as subject_token) for its own tokens.
        issued_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:refresh_token
          description: |
            RFC 8693 §2.2.1 — present on token-exchange responses.
            Mirrors the inbound `requested_token_type` (or defaults
            to access_token when the caller omitted that field).

            For token-exchange responses where the inbound
            subject_token carried an `act` claim, the issued JWT's
            `act` claim is a NESTED object:

                {
                  "sub": "<the most recent actor>",
                  "act": {
                    "sub": "<the earlier actor>",
                    "act": { ... }       // continues nesting
                  }
                }

            Outside-in reads walk delegation in time-order
            (outermost = most recent). Downstream resource servers
            walk this chain to reconstruct provenance for audit +
            authorization decisions. RFC 8693 §4.1.1 permits
            arbitrary nesting depth.

    IntrospectRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token to introspect.
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
          description: |
            Lookup shortcut. Server falls back to the other store
            when the hint misses, so an incorrect hint is a perf
            hit but never a correctness bug.
        client_id:
          type: string
        client_secret:
          type: string

    IntrospectResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: |
            `false` covers expired / revoked / never-issued
            (RFC 7662 §2.2). Other fields are absent in that case.
        scope:
          type: string
        client_id:
          type: string
        username:
          type: string
        token_type:
          type: string
        exp:
          type: integer
          description: Unix expiry seconds.
        iat:
          type: integer
          description: Unix issued-at seconds.
        sub:
          type: string
        aud:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        iss:
          type: string
        jti:
          type: string
        cnf:
          type: object
          description: |
            RFC 7800 confirmation method. Present when the token was
            DPoP- or mTLS-bound; carries `jkt` or `x5t#S256`.

    RevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token to revoke.
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
        client_id:
          type: string
        client_secret:
          type: string

    PARRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        response_type:
          type: string
          enum: [code]
        redirect_uri:
          type: string
        scope:
          type: string
          description: Space-delimited scope list.
        state:
          type: string
          description: |
            Opaque CSRF token the RP later checks against the
            /auth/login response.
        nonce:
          type: string
          description: OIDC nonce binding (Core §3.1.2.1).
        code_challenge:
          type: string
          description: RFC 7636 PKCE.
        code_challenge_method:
          type: string
          enum: [S256, plain]
        resource:
          type: array
          items: { type: string }
        authorization_details:
          type: array
          items:
            $ref: "#/components/schemas/AuthorizationDetail"
          description: |
            RFC 9396 Rich Authorization Requests. JSON body delivers
            an array directly; form-encoded body delivers a single
            JSON-string element the server parses. Server-side
            validation: array shape, non-empty `type` per element,
            type membership in the client's
            `allowed_authorization_details_types`. Any failure
            collapses to `invalid_authorization_details` (RFC 9396
            §6). Verbatim JSON propagates to the issued access
            token's `authorization_details` claim including all
            extension fields not standardized by the RFC.
        login_hint:
          type: string
        response_mode:
          type: string
          description: >-
            OIDC Core response mode. The jwt / query.jwt / fragment.jwt /
            form_post.jwt values select JWT Secured Authorization Response
            Mode (JARM) and are only accepted when a JARM signer is wired
            (otherwise invalid_request).
          enum: [query, fragment, form_post, jwt, query.jwt, fragment.jwt, form_post.jwt]
        acr_values:
          type: string
        ui_locales:
          type: string
        claims:
          type: object
          description: OIDC Core §5.5 claims request.
        client_assertion:
          type: string
        client_assertion_type:
          type: string
          enum:
            - urn:ietf:params:oauth:client-assertion-type:jwt-bearer

    PARResponse:
      type: object
      required: [request_uri, expires_in]
      properties:
        request_uri:
          type: string
          example: urn:ietf:params:oauth:request_uri:aWxiL3RoZXJlYWxh
        expires_in:
          type: integer
          description: Seconds until the request_uri is consumed or expires.

    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
        scope:
          type: string
        nonce:
          type: string
        resource:
          type: array
          items: { type: string }

    DeviceCodeResponse:
      type: object
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
          description: The device polls /token with this.
        user_code:
          type: string
          example: WXYZ-1234
        verification_uri:
          type: string
          example: https://sso.example.com/device/verify
        verification_uri_complete:
          type: string
          description: Same URI with `?user_code=` pre-filled — QR-friendly.
        expires_in:
          type: integer
        interval:
          type: integer
          description: Minimum seconds between /token polls.

    DeviceVerifyRequest:
      type: object
      required: [user_code, approve]
      properties:
        user_code:
          type: string
          description: |
            Case-insensitive and dash-insensitive. `WXYZ-1234`,
            `wxyz1234`, `WXYZ1234` all resolve to the same code.
        approve:
          type: boolean
          description: |
            `true` to authorize; `false` to deny (device's next
            /token poll returns `access_denied`).

    DCRRequest:
      type: object
      properties:
        redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
            - private_key_jwt
            - none
          description: |
            `none` opts out of secret issuance (public client / PKCE
            mandatory).
        grant_types:
          type: array
          items: { type: string }
          example: [authorization_code, refresh_token]
        response_types:
          type: array
          items: { type: string }
          example: [code]
        client_name:
          type: string
        scope:
          type: string
          description: Space-delimited scope list.
        contacts:
          type: array
          items: { type: string }
        token_strategy:
          type: string
          enum: [jwt, session]
          description: |
            Names the registered TokenIssuer this client uses;
            empty falls back to the server's default strategy.
        allowed_authenticators:
          type: array
          items: { type: string }
        allowed_resources:
          type: array
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        tenant_id:
          type: string
        require_pkce:
          type: boolean

    ClientMetadata:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        active: { type: boolean }
        token_strategy:
          type: string
          enum: [jwt, session]
        tenant_id: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        allowed_scopes:
          type: array
          items: { type: string }
        allowed_authenticators:
          type: array
          items: { type: string }
        allowed_resources:
          type: array
          items: { type: string }
        allowed_authorization_details_types:
          type: array
          items: { type: string }
        allowed_pkce_methods:
          type: array
          items: { type: string }
        require_pkce: { type: boolean }
        require_par: { type: boolean }
        require_signed_request_object: { type: boolean }
        allowed_request_uris:
          type: array
          items: { type: string }
        refresh_token_ttl:
          type: integer
          description: Nanoseconds.
        access_token_ttl:
          type: integer
          description: Nanoseconds.
        device_code_ttl:
          type: integer
        device_code_poll_interval:
          type: integer
        userinfo_signed_response_alg:
          type: string
        backchannel_logout_uri:
          type: string
        frontchannel_logout_uri:
          type: string
        subject_type:
          type: string
          enum: [public, pairwise]
        sector_identifier_uri:
          type: string
        jwks:
          type: array
          items:
            type: object
            description: RFC 7517 JWK object.

    AuditEvent:
      type: object
      required: [id, type, outcome, timestamp]
      properties:
        id: { type: string }
        type:
          type: string
          description: Canonical event type (login, logout, refresh_token_issued, ...).
        outcome:
          type: string
          enum: [success, failure]
        timestamp:
          type: string
          format: date-time
        request_id: { type: string }
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        actor_id: { type: string }
        actor_ip: { type: string }
        user_agent: { type: string }
        client_id: { type: string }
        provider: { type: string }
        token_strategy: { type: string }
        session_id: { type: string }
        token_id: { type: string }
        reason: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: |
            Free-form key/value pairs (tenant.*, geo.*, plus
            per-event-type custom keys).
        prev_hash:
          type: string
          description: Present when WithHashChain is enabled.
        hash:
          type: string

    AuditEventList:
      type: object
      required: [events, count]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        count:
          type: integer

    AuditFacets:
      type: object
      required: [total, outcomes, types, clients, providers]
      description: |
        Per-dimension value counts over the events matching the facet
        query. Dimensions are bounded by design (no high-cardinality
        actor / trace / request facets). Empty client_id / provider values
        are skipped (not a filter value the UI offers).
      properties:
        total:
          type: integer
          description: Number of events matching the query.
        outcomes:
          type: object
          additionalProperties: { type: integer }
          description: Count keyed by outcome (success / failure).
        types:
          type: object
          additionalProperties: { type: integer }
          description: Count keyed by canonical event type.
        clients:
          type: object
          additionalProperties: { type: integer }
          description: Count keyed by client_id.
        providers:
          type: object
          additionalProperties: { type: integer }
          description: Count keyed by authenticator provider.

    AuditFacetsResponse:
      type: object
      required: [facets]
      properties:
        facets:
          $ref: "#/components/schemas/AuditFacets"

    NetPolicy:
      type: object
      required: [name]
      properties:
        name: { type: string }
        cidrs:
          type: array
          items: { type: string }
          description: e.g. `10.0.0.0/8`, `2001:db8::/32`.
        hostnames:
          type: array
          items: { type: string }
          description: |
            Hostname matchers — hostname-beats-CIDR per the
            classifier's tie-breaking rules.
        priority:
          type: integer
          description: |
            Higher wins among classes that match the same
            (remote_addr, host) input.
        advertised_base_url:
          type: string
        advertised_jwks_url:
          type: string
        advertised_logout_url:
          type: string
        metadata:
          type: object
          additionalProperties: { type: string }

    NetPolicyEnvelope:
      type: object
      required: [policy]
      properties:
        policy:
          $ref: "#/components/schemas/NetPolicy"

    NetPolicyList:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/NetPolicy"

    ClassifyResponse:
      type: object
      required: [class]
      properties:
        class:
          type: string
          description: |
            Matched policy name; empty string means no match (the
            unclassified default).
        policy:
          allOf:
            - $ref: "#/components/schemas/NetPolicy"
          description: Present when `class` is non-empty.

    # ---- Snapshot admin schemas ----

    SnapshotMeta:
      type: object
      properties:
        schema_version: { type: string }
        snapshot_id: { type: string }
        taken_at_unix: { type: integer, format: int64 }
        source_namespace: { type: string }
        source_node_id: { type: string }
        size_bytes: { type: integer, format: int64 }
        codec: { type: string }
        encryption_algorithm: { type: string }
        bootstrap_applied_version: { type: integer, format: int32 }

    ExportSnapshotRequest:
      type: object
      properties:
        exclude:
          type: array
          items: { type: string }
          description: ResourceCategory names to omit. Empty = include all.
        source_node_id: { type: string }

    ExportSnapshotResponse:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        stored_as: { type: string }

    ListSnapshotsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SnapshotMeta" }

    GetSnapshotResponse:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/SnapshotMeta" }
        resources_json:
          type: string
          format: byte
          description: Base64-encoded raw JSON of snapshot.Resources.

    RestoreSnapshotRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [merge, overwrite, replace]
          description: Defaults to merge when empty.
        dry_run: { type: boolean }
        advance_bootstrap: { type: boolean }
        confirm:
          type: string
          description: Required iff mode=replace; MUST equal the snapshot id.
        exclude:
          type: array
          items: { type: string }

    RestoreSnapshotResponse:
      type: object
      properties:
        report: { $ref: "#/components/schemas/RestoreReport" }

    RestoreReport:
      type: object
      properties:
        mode: { type: string }
        dry_run: { type: boolean }
        items:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CategoryCounts"
        bootstrap: { $ref: "#/components/schemas/BootstrapAdvance" }
        errors:
          type: array
          items: { type: string }

    CategoryCounts:
      type: object
      properties:
        inserted: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        deleted: { type: integer, format: int32 }
        skipped: { type: integer, format: int32 }

    BootstrapAdvance:
      type: object
      properties:
        attempted: { type: boolean }
        from: { type: integer, format: int32 }
        to: { type: integer, format: int32 }
        no_op: { type: boolean }
        reason: { type: string }

    # ---- Release admin schemas ----

    Release:
      type: object
      properties:
        id: { type: string }
        channel: { type: string }
        frontend: { $ref: "#/components/schemas/Artifact" }
        backend: { $ref: "#/components/schemas/Artifact" }
        schema_version: { type: integer, format: int32 }
        config_snapshot:
          type: string
          description: |
            Optional snapshot id paired with this release; Rollback
            restores it before flipping the pinner.
        released_at_unix: { type: integer, format: int64 }
        released_by: { type: string }
        notes: { type: string }

    Artifact:
      type: object
      description: At least one of git_ref / uri MUST be set.
      properties:
        git_ref: { type: string }
        uri: { type: string }
        sha256: { type: string }
        digest: { type: string }

    RegisterReleaseRequest:
      type: object
      properties:
        release: { $ref: "#/components/schemas/Release" }
    RegisterReleaseResponse:
      type: object
      properties:
        release: { $ref: "#/components/schemas/Release" }

    ListReleasesResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Release" }

    GetReleaseResponse:
      type: object
      properties:
        release: { $ref: "#/components/schemas/Release" }

    GetCurrentReleaseResponse:
      type: object
      properties:
        release:
          allOf:
            - $ref: "#/components/schemas/Release"
          description: Unset when nothing is pinned.

    PinReleaseResponse:
      type: object
      properties:
        report: { $ref: "#/components/schemas/PinReport" }

    PinReport:
      type: object
      properties:
        release_id: { type: string }
        mode:
          type: string
          enum: [forward, rollback]
        previous_id:
          type: string
          description: Empty when nothing was pinned beforehand.

    # ---- Tenant admin schemas ----

    Tenant:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, suspended]
        settings:
          type: object
          additionalProperties: { type: string }
        # Data-residency policy. Set on create/update, read back on get/list.
        # Empty/false = unconstrained + fail-open. A successful update
        # invalidates the per-tenant residency cache so changes take effect
        # immediately.
        home_region:
          type: string
          description: Region this tenant's data primarily lives in.
        allowed_regions:
          type: array
          items: { type: string }
          description: Regions a request for this tenant may be served from.
        enforce_writes:
          type: boolean
          description: >-
            When true, a write served outside home_region is rejected at the
            enforcement layer (hard gate); when false, residency is advisory.

    Domain:
      type: object
      properties:
        hostname: { type: string }
        tenant_id: { type: string }
        default_client_id: { type: string }
        is_apex: { type: boolean }
        branding:
          type: object
          additionalProperties: { type: string }

    ListTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }

    GetTenantResponse:
      type: object
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }

    CreateTenantResponse:
      type: object
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }

    UpdateTenantResponse:
      type: object
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }

    SetTenantStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended]

    SetTenantStatusResponse:
      type: object
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }

    ListDomainsResponse:
      type: object
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }

    GetDomainResponse:
      type: object
      properties:
        domain: { $ref: "#/components/schemas/Domain" }

    CreateDomainResponse:
      type: object
      properties:
        domain: { $ref: "#/components/schemas/Domain" }

    UpdateDomainResponse:
      type: object
      properties:
        domain: { $ref: "#/components/schemas/Domain" }

    # ---- Client admin schemas ----

    AdminClient:
      type: object
      description: |
        Compact projection of sso.Client surfaced over the admin
        gRPC service. The non-admin /api/v1/clients/{id} endpoint
        returns the full ClientMetadata schema with every field;
        this slim shape mirrors proto/admin/v1/clients.proto.
      properties:
        id: { type: string }
        secret:
          type: string
          description: |
            Write-only. Never echoed on Get/List responses; use
            RotateSecret to mint a fresh secret.
        name: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        allowed_scopes:
          type: array
          items: { type: string }
        allowed_authenticators:
          type: array
          items: { type: string }
        token_strategy:
          type: string
          enum: [jwt, session]
        active: { type: boolean }

    ListClientsResponse:
      type: object
      properties:
        clients:
          type: array
          items: { $ref: "#/components/schemas/AdminClient" }
        next_page_token:
          type: string
          description: Pass as `page_token` to fetch the next page. Empty on the last page.
        total_size:
          type: integer
          format: int32
          description: Count of clients matching `filter` (approximate under concurrent mutation — see the List description).

    GetAdminClientResponse:
      type: object
      properties:
        client: { $ref: "#/components/schemas/AdminClient" }

    CreateClientResponse:
      type: object
      properties:
        client: { $ref: "#/components/schemas/AdminClient" }

    UpdateClientResponse:
      type: object
      properties:
        client: { $ref: "#/components/schemas/AdminClient" }

    RotateSecretResponse:
      type: object
      properties:
        secret:
          type: string
          description: New client_secret — display once.

    # ---- User admin schemas ----

    AdminUser:
      type: object
      properties:
        id: { type: string }
        external_id: { type: string }
        provider: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }

    Session:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        created_at_unix: { type: integer, format: int64 }
        expires_at_unix: { type: integer, format: int64 }
        revoked: { type: boolean }
        ip:
          type: string
          description: Device/location context captured at session creation (best-effort; honors the first-hop X-Forwarded-For trust model). Omitted when not captured.
        user_agent:
          type: string
          description: User-Agent captured at session creation (best-effort). Omitted when not captured.

    ListUsersResponse:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_page_token:
          type: string
          description: Pass as `page_token` to fetch the next page. Empty on the last page.
        total_size:
          type: integer
          format: int32
          description: Count of users matching `filter` (approximate under concurrent mutation — see the List description).

    GetAdminUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }

    CreateUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }

    UpdateUserResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }

    ListUserSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }

    # ---- Token admin schemas ----

    SessionToken:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        created_at_unix: { type: integer, format: int64 }
        expires_at_unix: { type: integer, format: int64 }

    ListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionToken" }

    AdminTokenRevokeRequest:
      type: object
      description: Supply either token OR session_id (not both required).
      properties:
        token: { type: string }
        session_id: { type: string }

    AdminTokenRevokeResponse:
      type: object
      properties:
        revoked:
          type: array
          items:
            type: string
            enum: [token, session]
          description: '`["token","session"]` when both were revoked.'

    IssueTempTokenRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        client_id: { type: string }
        scopes:
          type: array
          items: { type: string }

    IssueTempTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Raw temp token — display ONCE.
        expires_at_unix:
          type: integer
          format: int64

    # ---- Permission admin schemas ----
    # Role / Button / MenuItem live further down (pre-existing
    # schemas shared with /permissions/me and /menus/me); the admin
    # surface references the same shapes.

    Assignment:
      type: object
      properties:
        user_id: { type: string }
        roles:
          type: array
          items: { type: string }

    ListRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    AddRoleResponse:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }

    UpdateRoleResponse:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role" }

    ListAssignmentsResponse:
      type: object
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/Assignment" }

    AssignRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    UnassignRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    SetMenusRequest:
      type: object
      properties:
        menus:
          type: array
          items: { $ref: "#/components/schemas/MenuItem" }

    DCRResponse:
      type: object
      required: [client_id, client_id_issued_at, client_secret_expires_at]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          description: Omitted when token_endpoint_auth_method=none.
        client_id_issued_at:
          type: integer
          description: Unix seconds.
        client_secret_expires_at:
          type: integer
          description: |
            Unix seconds; `0` means "never expires" per RFC 7591
            §3.2.1. Operators rotating secrets manage expiry
            externally.
        registration_access_token:
          type: string
          description: |
            RFC 7592 management bearer — authenticates subsequent
            GET / PUT / DELETE /register/{client_id} calls.
        registration_client_uri:
          type: string
        redirect_uris:
          type: array
          items: { type: string }
        token_endpoint_auth_method:
          type: string
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        client_name:
          type: string
        scope:
          type: string
        contacts:
          type: array
          items: { type: string }
        token_strategy:
          type: string
        allowed_authenticators:
          type: array
          items: { type: string }
        allowed_resources:
          type: array
          items: { type: string }
        post_logout_redirect_uris:
          type: array
          items: { type: string }
        require_pkce:
          type: boolean

    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
        external_id:
          type: string
        provider:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Permission:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: order:read
        name:
          type: string
        description:
          type: string

    Role:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: admin
        name:
          type: string
        description:
          type: string
          description: |
            Human-readable role description; surfaced on the admin
            permission service (proto/admin/v1/permissions.proto).
        permissions:
          type: array
          items:
            type: string

    Button:
      type: object
      required: [code]
      properties:
        code:
          type: string
        name:
          type: string
        permission:
          type: string

    MenuItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        icon:
          type: string
        permission:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
        buttons:
          type: array
          items:
            $ref: "#/components/schemas/Button"

    MenuTree:
      type: array
      items:
        $ref: "#/components/schemas/MenuItem"

    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"

    JWK:
      type: object
      required: [kty, use, kid]
      properties:
        kty:
          type: string
          example: OKP
        crv:
          type: string
          example: Ed25519
        x:
          type: string
          description: Base64url-encoded public key bytes.
        use:
          type: string
          example: sig
        alg:
          type: string
          example: EdDSA
        kid:
          type: string
          description: First 8 bytes of sha256(pubkey), base64url-encoded.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable error code (catalog in consts.go).
          example: invalid_credentials
        error_description:
          type: string
          description: Optional human-readable detail.

    TenantMembership:
      type: object
      description: An explicit (tenant, user) org-membership edge (B2B), distinct from SCIM app-role groups.
      properties:
        tenant_id: { type: string }
        user_id: { type: string }
        role: { type: string, enum: [member, admin, guest] }
        created_at: { type: string, format: date-time }

    Connection:
      type: object
      description: A B2B enterprise connection (email-domain → upstream IdP routing).
      required: [id, tenant_id, type]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        type: { type: string, enum: [oidc, saml] }
        display_name: { type: string }
        domains:
          type: array
          items: { type: string }
          description: Email domains routed to this connection (home-realm discovery).
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: { type: string }
          description: Opaque protocol-specific settings (e.g. oidc_issuer, oidc_client_id).

    ErasureReport:
      type: object
      properties:
        user_id:
          type: string
        dry_run:
          type: boolean
        refresh_tokens_deleted:
          type: integer
          description: Tokens revoked (or, under dry_run, the projected count when previewable).
        sessions_destroyed:
          type: integer
        user_deleted:
          type: boolean
        skipped:
          type: array
          items: { type: string }
          description: Steps skipped because their store wasn't wired (or isn't previewable under dry_run).
        errors:
          type: array
          items: { type: string }
          description: Per-step failures; present on a 207 partial erasure.

    AuthzPolicyBundle:
      type: object
      required: [version, client_id, roles, wildcard_semantics]
      description: |
        Portable role-definition export for decentralized (sidecar)
        authorization. Carries role definitions + the wildcard match
        rules, never per-subject assignments.
      properties:
        version:
          type: integer
          description: Bundle schema version; a sidecar branches on it.
          example: 1
        generated_at:
          type: string
          format: date-time
          description: When the export rendered. Informational only — NOT part of the ETag (the ETag is hashed over the role content), so the same role set yields the same ETag across regenerations.
        client_id:
          type: string
          description: The app whose role definitions this bundle exports.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBundle"
        wildcard_semantics:
          $ref: "#/components/schemas/WildcardSemantics"

    RoleBundle:
      type: object
      required: [code, permissions]
      description: One role definition — a role code plus the permission codes it grants.
      properties:
        code:
          type: string
          example: admin
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items: { type: string }
          description: Granted permission codes (sorted for a stable canonical form).
          example: ["order:*", "user:*"]

    WildcardSemantics:
      type: object
      required: [all_token, domain_suffix, separator, rules]
      description: |
        Static, self-describing match rules an enforcer implements to
        reproduce the server's permission matcher: a granted code satisfies
        a wanted code when it is "*", an exact match, or "<domain>:*" where
        the wanted code is "<domain>:<action>".
      properties:
        all_token:
          type: string
          description: Token that grants every permission.
          example: "*"
        domain_suffix:
          type: string
          description: Suffix that, on a domain, grants every action under it.
          example: ":*"
        separator:
          type: string
          description: Splits a "domain:action" code.
          example: ":"
        rules:
          type: array
          items: { type: string }
          description: Human-readable description of the match order.

    StorageHealthReport:
      type: object
      required: [stores, generated_at]
      description: |
        Per-store health report for operator observability (DR drills +
        rolling-upgrade safety). One entry per wired store.
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/StorageHealthStore"
        generated_at:
          type: string
          format: date-time
          description: When the report rendered.

    StorageHealthStore:
      type: object
      required: [name, reachable]
      description: One store's health entry.
      properties:
        name:
          type: string
          description: Operator-facing store label (never a DSN or secret).
          example: sqlite-identity-clients
        reachable:
          type: boolean
          description: True when the store's Ping succeeded (or the store has no reachability signal, e.g. a memory backend).
        ping_latency_ms:
          type: number
          description: Wall-clock Ping latency in milliseconds. Omitted for stores with no Ping.
          example: 0.42
        schema_versions:
          type: object
          additionalProperties:
            type: integer
          description: Migrate namespace → applied schema version. Present only for SQLite-backed stores whose *sql.DB is reachable.
          example: { "clients": 1 }
        error:
          type: string
          description: |
            Operator-facing reachability/schema error when the store is down
            or its schema couldn't be read. A generic message — never the
            connection string or any credential.

    BackupReport:
      type: object
      required: [status, sources]
      description: |
        Result summary for POST /api/v1/admin/backup. One entry per
        registered BackupSource.
      properties:
        status:
          type: string
          example: ok
        sources:
          type: array
          items:
            $ref: "#/components/schemas/BackupSourceResult"

    BackupSourceResult:
      type: object
      required: [name, status]
      description: One backup source's result entry.
      properties:
        name:
          type: string
          description: The BackupSource's operator-facing label.
          example: clients
        status:
          type: string
          enum: [ok, failed]
        path:
          type: string
          description: Absolute path of the written backup file. Present only on success.
          example: /var/lib/sso/backups/sso-backup-clients-20260702T153000.000000000.db
        size_bytes:
          type: integer
          description: On-disk size of the backup file. Present only on success.
          example: 40960
        duration_ms:
          type: integer
          description: Wall-clock duration of the VACUUM INTO call, in milliseconds. Present only on success.
          example: 12
        pruned:
          type: integer
          description: Count of older backup files deleted by retention for this source. Present only when backup.keep / WithBackupRetention is enabled.
          example: 3

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: alive

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, unready]
        checks:
          type: object
          additionalProperties:
            type: string
            description: '`ok` for passing checks, the error string for failing ones.'
          example:
            sqlite-identity-clients: ok
            sqlite-jti-replay: ok
            sqlite-account-lockout: ok

    OpenIDConfiguration:
      type: object
      description: |
        OpenID Connect Discovery 1.0 + RFC 8414 metadata. Field set
        is dynamic — only features actually wired into the running
        server appear (e.g. `pushed_authorization_request_endpoint`
        and `require_pushed_authorization_requests` are present only
        when a PAR store is wired). Treat unknown fields as forward
        compatibility, not as errors.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
          description: |
            Identifier the AS uses for itself. MUST equal the
            `iss` claim of every token issued AND the `iss`
            parameter on every authorization response (RFC 9207).
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
          description: RFC 7591 DCR endpoint. Present only when DCR is enabled.
        introspection_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        device_authorization_endpoint:
          type: string
          format: uri
          description: RFC 8628. Present only when a DeviceCodeStore is wired.
        pushed_authorization_request_endpoint:
          type: string
          format: uri
          description: RFC 9126. Present only when a PARStore is wired.
        require_pushed_authorization_requests:
          type: boolean
        end_session_endpoint:
          type: string
          format: uri
          description: OIDC RP-Initiated Logout 1.0.
        backchannel_logout_supported:
          type: boolean
        backchannel_logout_session_supported:
          type: boolean
        frontchannel_logout_supported:
          type: boolean
        frontchannel_logout_session_supported:
          type: boolean
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
            enum: [public, pairwise]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        userinfo_signing_alg_values_supported:
          type: array
          items:
            type: string
        id_token_encryption_alg_values_supported:
          type: array
          description: Present only when a JWE response encrypter is wired (WithJWEResponseEncrypter).
          items:
            type: string
        id_token_encryption_enc_values_supported:
          type: array
          description: Present only when a JWE response encrypter is wired.
          items:
            type: string
        userinfo_encryption_alg_values_supported:
          type: array
          description: Present only when a JWE response encrypter is wired.
          items:
            type: string
        userinfo_encryption_enc_values_supported:
          type: array
          description: Present only when a JWE response encrypter is wired.
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        acr_values_supported:
          type: array
          items:
            type: string
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
        tls_client_certificate_bound_access_tokens:
          type: boolean
        mtls_endpoint_aliases:
          type: object
          additionalProperties:
            type: string
            format: uri
        authorization_response_iss_parameter_supported:
          type: boolean
          description: RFC 9207. Always true on this server.
        signed_metadata:
          type: string
          description: |
            RFC 8414 §2.1 signed_metadata JWT. Present only when
            `WithMetadataSigner` is wired.
      additionalProperties: true

    WebAuthnBeginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: |
            Account identifier. For registration this is the new
            account's username; for login it identifies the enrolled
            credentials to challenge.
        display_name:
          type: string
          description: |
            Friendly name shown to the authenticator UI. Only used on
            registration; ignored for login.

    WebAuthnBeginRegistrationResponse:
      type: object
      required: [session_id, options]
      properties:
        session_id:
          type: string
          description: |
            Single-use ceremony handle. Pass to
            `/webauthn/registration/finish` as `?session_id=`.
        options:
          type: object
          description: |
            `PublicKeyCredentialCreationOptions` per WebAuthn Level
            2 (challenge, rp, user, pubKeyCredParams, etc.). Pass
            to `navigator.credentials.create({publicKey: options})`.

    WebAuthnBeginLoginResponse:
      type: object
      required: [session_id, options]
      properties:
        session_id:
          type: string
          description: |
            Single-use ceremony handle. Pass to
            `/webauthn/login/finish` as `?session_id=`.
        options:
          type: object
          description: |
            `PublicKeyCredentialRequestOptions` (challenge,
            allowCredentials, rpId, userVerification). Pass to
            `navigator.credentials.get({publicKey: options})`.

    WebAuthnFinishRegistrationResponse:
      type: object
      required: [credential_id]
      properties:
        credential_id:
          type: string
          description: |
            Base64url-encoded credential id the authenticator
            produced. Persist on the client side so subsequent
            login flows can list it under `allowCredentials`.

    WebAuthnFinishLoginResponse:
      type: object
      required: [username, credential_id]
      properties:
        username:
          type: string
        credential_id:
          type: string
          description: Base64url-encoded credential id used to authenticate.
        access_token:
          type: string
          description: |
            Present only when `client_id` was supplied AND the cmd
            has a ClientStore + TokenIssuer wired. Same Ed25519 JWT
            shape `/auth/login` returns.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds.
        scope:
          type: string
          description: Space-delimited scope list (defaults to the client's full allowed_scopes).
        refresh_token:
          type: string
          description: |
            Present only when `client_id` is supplied AND a
            RefreshTokenStore is wired. Opaque 32-byte base64url
            token; redeem via the OAuth `/token` endpoint with
            `grant_type=refresh_token`.
        id_token:
          type: string
          description: |
            Present only when `client_id` is supplied AND the
            resolved client's `allowed_scopes` contains `openid`
            AND an IDTokenIssuer is wired. Ed25519 JWT with `amr`
            of `["webauthn"]`.

    ScimError:
      type: object
      description: |
        SCIM 2.0 error envelope (RFC 7644 §3.12), served as
        `application/scim+json`. This is a SEPARATE taxonomy from the
        OAuth `error` body — SPAs/connectors branch on `scimType` (and the
        repeated `status`), never the human-readable `detail`. See
        `docs/error-codes.md` for the full scimType catalog.
      required: [schemas, status]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          description: HTTP status repeated as a STRING per the spec ("404", not 404).
          example: "409"
        scimType:
          type: string
          description: |
            Machine-readable refinement code (RFC 7644 §3.12, Table 9).
            Present on the 4xx cases this server emits; omitted for
            404/405/500.
          enum: [invalidValue, invalidSyntax, uniqueness, mutability, invalidPath, noTarget, invalidFilter]
          example: uniqueness
        detail:
          type: string
          description: Human-readable explanation. Not machine-stable; do not branch on it.
          example: userName already exists

    ScimMeta:
      type: object
      description: Common SCIM resource metadata (RFC 7643 §3.1).
      properties:
        resourceType:
          type: string
          enum: [User, Group]
          example: User
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
          description: Absolute resource URL (omitted when the handler is mounted relative).
          example: https://sso.example.com/api/v1/scim/v2/Users/2819c223...

    ScimUser:
      type: object
      description: |
        SCIM 2.0 core User (RFC 7643 §4.1). Only the attributes this server
        reads/writes are modeled; unknown inbound attributes are ignored
        (RFC 7644 §3.3). `id` is server-minted + read-only. Attributes
        without a dedicated `core.User` field (userName, active, name
        sub-attributes, non-primary emails) round-trip through
        `core.User.Attributes` under a `scim:` namespace.
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          description: Server-assigned, read-only (RFC 7643 §3.1).
          example: 2819c223-7f76-453a-919d-413861904646
        externalId:
          type: string
          description: The provisioning client's own identifier for the resource.
        userName:
          type: string
          description: REQUIRED. Unique across users (collision → 409 uniqueness).
          example: alice@example.com
        displayName:
          type: string
          description: Free-form label; backed by `core.User.Name`.
        name:
          $ref: "#/components/schemas/ScimName"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimEmail"
        active:
          type: boolean
          description: Deprovision flag (RFC 7643 §4.1.1). Defaults to true on create when omitted.
          default: true
        meta:
          $ref: "#/components/schemas/ScimMeta"

    ScimName:
      type: object
      description: SCIM complex "name" attribute (RFC 7643 §4.1.1).
      properties:
        formatted: { type: string }
        familyName: { type: string }
        givenName: { type: string }
        middleName: { type: string }
        honorificPrefix: { type: string }
        honorificSuffix: { type: string }

    ScimEmail:
      type: object
      description: One element of the multi-valued "emails" attribute (RFC 7643 §4.1.2).
      required: [value]
      properties:
        value:
          type: string
          example: alice@example.com
        type:
          type: string
          example: work
        primary:
          type: boolean
          description: At most one true per RFC 7643 §2.4.

    ScimGroup:
      type: object
      description: |
        SCIM 2.0 core Group (RFC 7643 §4.2), mapped onto a
        `permissions.Role`: the server-minted `id` is the role code,
        `displayName` is the role name, and `members` are the users
        assigned that role. Only present when `scim.groups.enabled`.
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          description: Server-assigned, read-only.
        displayName:
          type: string
          description: REQUIRED.
          example: admins
        members:
          type: array
          items:
            $ref: "#/components/schemas/ScimGroupMember"
        meta:
          $ref: "#/components/schemas/ScimMeta"

    ScimGroupMember:
      type: object
      description: One element of the multi-valued "members" attribute (RFC 7643 §4.2).
      required: [value]
      properties:
        value:
          type: string
          description: The member's resource id (a User id). Load-bearing for the role-assignment mapping.
        $ref:
          type: string
          description: Optional reference URL to the member resource.
        type:
          type: string
          example: User
        display:
          type: string

    ScimListResponse:
      type: object
      description: |
        SCIM multi-valued GET envelope (RFC 7644 §3.4.2), returned by the
        list/search and `/Schemas` endpoints. `startIndex` /
        `itemsPerPage` are 1-based. `totalResults` reflects the FILTERED
        set when a `filter` is supplied.
      required: [schemas, totalResults, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
          example: 1
        startIndex:
          type: integer
          example: 1
        itemsPerPage:
          type: integer
          example: 1
        Resources:
          type: array
          description: User or Group resources (or schema definitions on `/Schemas`).
          items:
            type: object
            additionalProperties: true

    ScimPatchOp:
      type: object
      description: |
        SCIM PATCH request body (RFC 7644 §3.5.2): a `schemas` array naming
        PatchOp plus an ORDERED list of operations applied in sequence
        (all-or-nothing — a failing op aborts before any write). At least
        one operation is required (an empty Operations array is a 400
        invalidValue).
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          minItems: 1
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                description: One of add | replace | remove (case-insensitive).
                example: replace
              path:
                type: string
                description: |
                  Optional attribute path. Supported: a top-level attribute
                  (`active`, `userName`, `displayName`, `externalId`,
                  `emails`, `members`) or the nested `name.<sub>` form. A
                  value filter (`members[value eq "x"]`) or schema-qualified
                  path is unsupported (400 invalidPath). `remove` requires a
                  path (else 400 noTarget).
                example: active
              value:
                description: |
                  Operation value — a scalar, string, object, or array
                  decoded against the target attribute's type. When `path`
                  is empty on add/replace, this is a `{attr: val}` object
                  applied to the resource root.
                example: false
