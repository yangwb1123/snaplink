# B13-R2 rerun: complete the mid-refactor redirect-URI patterns work, then
# run FAPI / canary / docs-truthiness against the fixed HEAD.
#
# Round 1 outcome (2026-08-16):
#   - B13-1 (redirect-URI patterns): agent TIMED OUT (2400s) mid-refactor.
#     The worktree is BROKEN (go build fails:
#     config/config_load.go:220 references undefined
#     validateClientRedirectPatterns) and NOT finalizable as-is. The
#     design doc docs/design/redirect-uri-patterns.md is complete (six
#     decisions). Observed intent:
#       * shared/core/email_change.go was DELETED deliberately — its
#         EmailChangeToken/EmailVerificationToken content moved into
#         shared/core/invitation.go (comment: shared/core is at its
#         frozen per-directory file ceiling) — to free a file slot;
#       * a shared/uripattern/ package was created then REMOVED;
#       * client-store persistence (sqlite migration v8, postgres
#         clientSchemaV6), DCR wire/validation, config parsing, openapi/
#         config-reference updates are partially present.
#   - The batch was stopped (SIGTERM) before tasks 2-4 ran, so the canary
#     task never hit the broken build.
#
# Sequencing: R2-A fixes HEAD first; R2-B (FAPI) needs the feature; R2-C
# and R2-D are independent but run after to keep the worktree serial.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b13-r2.yaml --reuse
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative. Files are referenced by PATH — read them with
#     your tools, do not expect them inlined.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report. Never claim a test
#     passed that you did not run.
#   - Engineering budgets: no file over 500 lines, no function over 50 lines
#     / cyclo 15, no new maintainability exemptions, no skipDirs /
#     layerExemptions additions, no layer violations.
#   - Commit with a conventional imperative message + AI co-author trailer.
#     The post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库。任务：**完成**上一轮超时中断的 redirect-URI 模式
    重构（B13-1；工作树损坏、重构中途——你的工作是读设计文档、按设计
    完成实现、修复构建、跑全门禁、提交）。

    现状（已核验）：
    - go build 失败：config/config_load.go:220 引用未定义的
      validateClientRedirectPatterns；其他半成品散落：
      config/config_client.go、config/config_load.go、
      infrastructure/defaultimpl/sqlite/clients*.go（迁移 v8 相关）、
      infrastructure/postgres/clients*.go、interfaces/sso/servercache/
      server_client_cache.go、protocols/oauth/handle_register*.go、
      protocols/oauth/oauthvalidate/dcr_validate.go、shared/core/
      {jwks,types,types_test,invitation}.go、cmd/sso-server/
      build_app_core.go。
    - shared/core/email_change.go 被删除是有意的（内容移入
      invitation.go；注释说明 shared/core 处于冻结文件上限）。
    - shared/uripattern/ 包曾被创建又移除——以设计文档为准决定最终
      形态。
    - 设计文档 docs/design/redirect-uri-patterns.md 完整（六项裁决：
      数据模型/语法/校验时机/安全评审/FAPI 适配/验收断言）。

    执行要求：
    1. **先通读设计文档全文**（它是契约）；再逐文件审读工作树现状，
       重建意图。完成实现（按设计，可调整上一轮的中间选择，但每处
       调整须说明理由）：
       - 语法实现落位（设计 Decision 2 指定 shared/uripattern 新包；
         若上一轮移走则按设计恢复/重建；注意 shared/ 目录预算与
         分层——shared 是叶子层，无向上依赖）；
       - Client.RedirectURIPatterns 字段 + IsRedirectURIValid OR 语义
         （精确列表不变）；
       - DCR 注册/更新/回显（snaplink 扩展字段名）+ 校验（非法模式
         拒绝）；
       - 静态配置 clients[].redirect_uri_patterns + boot 校验
         （validateClientRedirectPatterns 实现或修正调用点）；
       - sqlite（迁移 v8）与 postgres（clientSchemaV6）持久化；
       - openapi.yaml + config-reference.md + CHANGELOG.md 同步。
    2. 测试（禁止 skip）：匹配器表驱动测试（含设计 Decision 2/4 的
       对抗样例：不匹配/跨段/大小写/编码绕过/危险形态拒绝）+ DCR
       往返 + 集成（带模式客户端登录回调）+ 既有 redirect 测试全绿。
    3. 全部验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./shared/... ./protocols/oauth/... ./config/... -count=1
       go test ./interfaces/sso/... -run 'Redirect|Login|Register' -count=1
       go test ./test/ -run 'Redirect|PKCE|Login' -count=1
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
       python3 cli.py check-routes && python3 cli.py sdk-surface check
       gofmt -l 本方向文件
    4. 硬边界：默认零模式行为逐字节不变；零豁免；新文件 ≤500 行、
       函数 ≤50 行/cyclo ≤15；shared/core 文件上限不破（若需文件
       移动，沿用上一轮"合并既有文件"的纪律并说明）。
    5. conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b13-redirect-uri-patterns.md
  timeout: 2400
  validate: |
    go build ./... && go vet ./... && go test ./shared/core/... ./protocols/oauth/... -count=1 && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

