- prompt: |
    你在 snaplink 仓库。任务：实现 canary 配置应用（配置治理的剩余
    Partial 边界之一：canary rollout / automated remediation），先写
    有界设计、再实现。apply/rollback 基线（B10-3）行为必须不变。

    契约（先读，后实现，契约优先于本提示）：
    - docs/deferred-backlog.md "Declarative multi-cluster configuration
      governance" 段（Partial by design：apply+rollback 已实现；canary
      rollout / automated remediation / GitOps reconciliation 未承诺）
    - platform/configaudit/（Store.Apply/Applied/Rollback、handlers、
      mount、memory/sqlite、redact、diff、digest——B10-3 设计
      docs/design/config-apply-mode.md）
    - platform/lifecycle/degradation/（B7-2 的自动降级驱动：健康信号
      源）与 interfaces/sso 的 StorageHealthSource（/readyz 探针）
    - docs/error-codes.md 的 config_apply_* 系列（新错误码同表登记）

    第一步——设计文档（必须先写）：
    docs/design/config-canary-apply.md，必须裁决：
    1. 语义：canary 窗口（如 ?canary=true&window=60s）内如何观测——
       复用 degradation Manager / storage-health 信号源 vs 独立健康
       检查；判定标准（什么信号触发回滚）；窗口结束后的终态
       （confirmed / rolled back）。
    2. 状态机：apply → canary-observing → confirmed|rolled_back（含
       中断/进程重启的恢复语义——canary 状态是否持久化，sqlite 迁移
       若需）；与现有 Applied/Rollback/History 的关系。
    3. 回滚触发：健康信号 fail-open/fail-closed 纪律（信号源错误不
       误回滚？）；回滚动作复用现有 Rollback；审计事件
       （config_canary_started/confirmed/rolled_back 或等效，登记
       auditspi/auditreport）。
    4. 权威与安全：canary 仍需 approve=true；窗口内并发 apply 拒绝
       （409）；secret 脱敏不变。
    5. 硬边界：非 canary 的 apply 路径逐字节不变；零豁免；无向上
       依赖（configaudit 在 platform 层，健康信号经注入端口）。
    6. 验收断言（可测试）：canary 窗口内健康 → confirmed；健康失败
       → 自动回滚 + 审计；窗口内二次 apply → 409；进程重启恢复语义
       （如持久化）；非 canary apply 回归全绿。

    第二步——实现（按设计）：
    1. Apply 扩展（canary 参数/状态）+ 观测循环 + 自动回滚 + 审计
       + 错误码 + openapi + config-reference（如新配置键）+
       CHANGELOG。
    2. 测试（禁止 skip）：memory store 全状态机矩阵 + sqlite（如
       持久化）+ 健康信号注入假实现 + 回归。
    3. 验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./platform/configaudit/... -count=1
       go test ./interfaces/sso/... -run 'Config' -count=1
       python3 cli.py check-routes && python3 cli.py sdk-surface check
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
    4. conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b13-config-canary.md
  timeout: 2400
  validate: |
    go build ./... && go vet ./... && go test ./platform/configaudit/... -count=1 && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

