# B12-R2 rerun: finalize the preserved per-client id_token alg + OTel
# correlation work, then run the FAPI suite with the feature present.
#
# Round 1 outcomes (2026-08-15/16):
#   - B12-1 (per-client id_token alg): agent TIMED OUT (2400s) after a
#     complete implementation (29 files, +691/−91: config, sqlite+postgres
#     clients, DCR validation, discovery advertisement, wiring, openapi,
#     config-reference, CHANGELOG). Worktree preserved; go build/vet PASS.
#   - B12-2 (FAPI conformance): fallback executed honestly (c2871772):
#     harness variant verified intact, basic plan zero-regression rerun
#     (59+1 at results/78bb614f/), blocker recorded. The real FAPI run
#     awaits B12-1 at HEAD.
#   - B12-3 (OTel correlation): agent TIMED OUT (1800s) after an
#     implementation (cmd/sso-minimal/app.go, cmd/sso-server/main_wiring.go,
#     interfaces/middleware/*, platform/tracing/*, ...). Worktree
#     preserved; the combined B12-1+B12-3 worktree compiles.
#
# IMPORTANT: B12-1 and B12-3 changes coexist in ONE worktree. Task R2-A
# commits ONLY its direction's files (path-scoped git add); task R2-C
# commits the remainder. Do NOT git add -A. Leave the other direction's
# files untouched.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b12-r2.yaml --reuse
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative. Files are referenced by PATH — read them with
#     your tools, do not expect them inlined.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report. Never claim a test
#     passed that you did not run.
#   - Commit with a conventional imperative message + AI co-author trailer.
#     The post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库。任务：收尾上一轮超时但实现已保留的
    per-client id_token 签名算法工作（B12-1；29 文件 +691/−91，编译
    通过）。你的工作是核验、跑全门禁、**只提交本方向的文件**、提交。

    现状（已核验）：
    - 工作树中 B12-1 文件（以 git status/diff 逐文件确认为准）：
      shared/core/types.go（Client.IDTokenSignedResponseAlg 字段）、
      config/config_client.go(+_test)/config_keys.go/config_load.go、
      cmd/sso-server/build_app_core.go 与 client_config_test.go、
      infrastructure/defaultimpl/sqlite/clients*.go(+_test 迁移)、
      infrastructure/postgres/clients*.go、
      interfaces/sso/{server_discovery_cache,server_discovery_config,
      server_helpers,sso_wiring}.go、
      protocols/oauth/oauthvalidate/dcr_validate*.go(+_test) 与
      dcr_validate_encryption_test.go、docs/openapi.yaml、
      docs/config-reference.md、CHANGELOG.md。
    - 工作树中还有 B12-3（OTel 关联）的文件——**禁止触碰、禁止提交**。
    - go build ./... && go vet ./... 已 PASS（两方向共存编译）。

    契约（原始任务）：
    - docs/campaigns/reports/b11-fapi-conformance.md 的 BLOCKER 段与
      test/oidc-conformance/results/39ecdf7a-fapi/BLOCKER.md
    - 设计裁决文件 docs/design/per-client-id-token-alg.md（若上一轮已
      写；未写则按实现推断并补齐）
    - AGENTS.md §3 已接受 JWS 算法（EdDSA/ES256-512/RS256/PS256；
      none 拒绝）

    执行要求：
    1. 通读保留实现（勿重写）：Client 字段 + DCR 注册字段（RFC 7591
       id_token_signed_response_alg）+ 静态配置键 + 校验（未知 alg
       拒绝）+ 签发选择（多签发器 map；默认单签发器逐字节不变）+
       discovery 广告；sqlite/postgres 客户端存储迁移；openapi/
       config-reference 同步。发现缺口 → 小步修复并报告根因。
    2. 全部验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./interfaces/sso/... ./protocols/oauth/... ./protocols/oidc/... -count=1
       go test ./config/... ./infrastructure/defaultimpl/... -count=1
       go test ./test/ -run 'OIDC|Register|IDToken' -count=1
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
       python3 cli.py check-routes && python3 cli.py sdk-surface check
       gofmt -l 本方向文件
    3. 提交：**路径限定 git add**（仅本方向文件；B12-3 文件原样保留），
       conventional commit（imperative + AI co-author trailer）。
    4. 硬边界：零豁免；新文件 ≤500 行、函数 ≤50 行/cyclo ≤15；
       interfaces/sso 保持 60 文件上限。
  output: docs/campaigns/reports/b12-per-client-id-token-alg.md
  timeout: 1800
  validate: |
    go build ./... && go vet ./... && go test ./interfaces/sso/... ./protocols/oauth/... -count=1 && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

- prompt: |
    你在 snaplink 仓库。任务：完成 FAPI 2.0 conformance 运行——前置
