    契约（先读，后执行）：
    - docs/campaigns/reports/b12-fapi-conformance.md（fallback 报告；
      "下一步"段：登录客户端 DCR 加 id_token_signed_response_alg:
      RS256 → ./run-headless.sh --fapi --timeout 1200）
    - test/oidc-conformance/{run-headless.sh,config-fapi.yaml,
      docker-compose.yml}（变体机制；默认拓扑字节不变纪律）
    - B12-R2-A 提交的 per-client id_token alg（如已合并；先 git log/
       grep 确认 HEAD 有 IDTokenSignedResponseAlg）

    执行要求：
    1. 确认 HEAD 有 per-client id_token alg（grep
       IDTokenSignedResponseAlg + 读 B12-R2-A 报告）。若缺失：按
       fallback 执行（验证 harness 完好 + basic 复跑 + 阻塞如实记录，
       不虚构），报告即结束。
    2. 若有：
       a. harness 套件登录客户端 DCR 注册增加
          id_token_signed_response_alg: RS256（登录客户端是普通 OIDC
          客户端，RS256 不违反 FAPI 约束；如设计裁决有其他取值按
          设计）；
       b. 运行 ./run-headless.sh --fapi --timeout 1200，如实报告每
          阶段输出与最终统计（plan 创建、模块执行、SUCCESS/FAIL 数
          与失败项明细）；
       c. 归档 results/<commit>-fapi/（plan/log/info/config/commit/
          worktree；gitignore 本地留存）；与 basic 计划对比；
       d. 文档同步（同提交）：README fapi 行更新为实测结果、
          docs/sso/oidc-conformance.md 证据表增补 FAPI 记录、
          CHANGELOG（如 harness 变更可见）。
    3. 验证命令（必须实际运行并报告输出）：
       cd test/oidc-conformance && <FAPI 运行命令>
       cd /home/u1/workspace/demo/snaplink && go build ./... && go vet ./...
       git status --porcelain
    4. conventional commit（imperative + AI co-author trailer；如无
       harness 变更则 docs 前缀）。
  output: docs/campaigns/reports/b12-fapi-conformance.md
  timeout: 2400
  validate: |
    go build ./... && go vet ./... && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

