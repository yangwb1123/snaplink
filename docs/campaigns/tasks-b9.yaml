# B9 implementation batch: KMS ssoext registrars + sso-ctl audit DSN paths
# + OIDF listing evidence kit.
#
# Direction set (baseline verified 2026-08-15 at HEAD 6194c446):
#   1. KMS family ssoext registrars — docs/deferred-backlog.md line ~36:
#      "The KMS family (awskms/gcpkms/azurekeyvault/pkcs11 external
#      signers) is the remaining work" after B8-2 migrated
#      LDAP/Kerberos/RADIUS. The in-cmd registrar exists
#      (cmd/sso-server/serverbuildsign/external_signer.go:
#      ExternalSignerFactory + ExternalSignerRegistry + health/metrics
#      wrapper) but lives in cmd/, so forks cannot import the types.
#   2. sso-ctl audit DSN paths — two committed requirement docs
#      (cmd-sso-ctl-audit-dsn-requirements.md REQ-1/2/3/5/6,
#      cmd-sso-ctl-auditexport-postgres-from-url-requirements.md
#      REQ-1 + acceptance A1-A3/B1-B2) are unimplemented: audit-export is
#      sqlite-only (main.go:186 auditsqlite.OpenReadOnly hardcoded),
#      audit-verify has no --dsn store source, and the shared
#      cmd/sso-ctl/auditstore reader does not exist. Verified: the
#      postgres AuditSink already implements Query (audit_query.go:79) and
#      auditexport.QueryPager anticipates a remote HTTP adapter.
#   3. OIDF listing evidence kit — ROADMAP P0 #2 remaining executable
#      part after B8-1 (HTTPS topology 60 SUCCESS + 0 FAILURE at
#      results/7400ba0c-https/): package the evidence into a
#      certification-readiness kit and sweep the stale status lines.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b9.yaml
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative. Files are referenced by PATH — read them with
#     your tools, do not expect them inlined.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report (table of commands
#     with real results; never claim a test passed that you did not run).
#   - Engineering budgets: no file over 500 lines, no function over 50 lines
#     / cyclo 15, no new maintainability exemptions, no skipDirs /
#     layerExemptions additions, no layer violations (architecture gate;
#     nested modules with their own go.mod are outside the root gate).
#   - Update docs/config-reference.md + CHANGELOG.md in the same commit when
#     a public contract changes.
#   - Commit with a conventional imperative message + AI co-author trailer.
#     The post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库。任务：为 KMS 外部签名器族（awskms/gcpkms/
    azurekeyvault/pkcs11）补齐 interfaces/ssoext 类型化注册器
    （deferred-backlog 声明的最后剩余迁移工作；LDAP/Kerberos/RADIUS 与
    SAML 是已承诺的模板）。

    契约（先读，后实现，契约优先于本提示）：
    - docs/deferred-backlog.md 第 ~36 行 "Nested protocol/infrastructure
      modules" 段（KMS family is the remaining work）
    - cmd/sso-server/serverbuildsign/external_signer.go（现有进程内注册
      器：ExternalSignerFactory = func(ctx) (crypto.Signer, string, error)、
      ExternalSignerRegistry = registrar.New[...]、RegisterExternalSigner
      panic 纪律、SignerHealth/instrumentedSigner/readyz 接线——
      健康与指标包装必须保留在 cmd 层或按设计迁移，行为不变）
    - cmd/sso-server/serverbuildsign/build_signing_issuers.go:17-33
      （keys.signing.external 名称查表 + fail-closed boot 错误）
    - interfaces/ssoext/ldap_registry.go（B8-2 刚落地的模板：Deps 仅
      stdlib + 根模块类型、Register/Lookup/Registered、进程本地、
      非热插件注册表注释纪律、模块侧 build.go 嵌入 Deps）
    - 四个嵌套模块：infrastructure/kms/{awskms,gcpkms,azurekeyvault,
      pkcs11}/（各自 go.mod；awskms/signer.go:156 New(client, keyID,
      opts...) 等自有构造器）

    设计要点（写入设计或实现注释，必须裁决）：
    1. ssoext KMS 注册器形状：单注册器（saml 模板）vs 每厂商一个；
       工厂类型即现有 ExternalSignerFactory 形状（crypto.Signer 是
       stdlib，Deps 可含 spi.Logger/metrics 等根模块类型）。
    2. serverbuildsign 对齐：keys.signing.external 查表行为必须逐字节
       不变；避免双注册表漂移——ssoext 为规范注册器，serverbuildsign
       的 RegisterExternalSigner/lookup 委托或别名到 ssoext（设计须
       说明兼容性：现有 fork 调用 serverbuildsign.RegisterExternalSigner
       的代码如何迁移）。
    3. 模块侧适配：四模块各加 build.go 适配（嵌入 ssoext Deps、工厂
       闭包在 fork main 侧持有厂商 SDK 客户端），与 ldap/radius 的
       build.go 形状对齐。
    4. 硬边界：零维护性豁免、零 skipDirs/layerExemptions、根模块分层
       不变（ssoext 属 interfaces 层；infrastructure 嵌套模块经自身
       go.mod + replace 引用 ssoext 是既有先例）；新文件 ≤500 行、
       函数 ≤50 行/cyclo ≤15；interfaces/ssoext 目录 ≤10 非测试 .go
       文件（当前 4 个注册器 + 4 个测试；新增不得超过上限，必要时
       合并为单文件）。

    测试（禁止 skip）：
    - interfaces/ssoext 注册器合同测试（注册→查表→重复 panic→未注册
      ok=false→Names 排序），形状对齐 ldap_registry_test.go
    - serverbuildsign 现有测试全绿（健康/指标/查表行为不回归）
    - 四模块各自 go test ./... -count=1
    - 验证命令（必须实际运行并报告输出）：
      go build ./... && go vet ./...
      go test ./interfaces/ssoext/... -count=1
      go test ./cmd/sso-server/serverbuildsign/... -count=1
      (cd infrastructure/kms/awskms && go test ./... -count=1) 及
      gcpkms/azurekeyvault/pkcs11 同理
      go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
      各模块 go mod tidy -diff 确认无意外变更
    文档同步（同提交）：deferred-backlog 嵌套模块段更新（KMS 已迁移、
      无剩余或标注最终边界）、DIRECTORY_MAP ssoext 行、CHANGELOG Added。
    conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b9-kms-ssoext-registrars.md
  timeout: 1800
  validate: |
    go build ./... && go vet ./... && go test ./interfaces/ssoext/... -count=1 && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

- prompt: |
