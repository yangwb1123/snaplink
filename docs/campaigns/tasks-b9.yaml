    audit-export postgres/--from-url）。

    契约（先读，后实现，契约优先于本提示；验收断言以需求文档为准）：
    - docs/architect-analysis/auto/cmd-sso-ctl-audit-dsn-requirements.md
      （REQ-1 audit-verify --dsn sqlite；REQ-2 --dsn postgres；REQ-3
      audit-export --dsn postgres；REQ-5 共享只读 opener；REQ-6 CLI 契约
      与文档。REQ-4 audit-agg 标为 proposed/flagged —— 不在本任务范围，
      报告须注明排除）
    - docs/architect-analysis/auto/cmd-sso-ctl-auditexport-postgres-from-url-requirements.md
      （REQ-1 非迁移 postgres 只读 opener 契约：wrap postgres.Open、
      不运行迁移、schema_migrations_audit 版本校验 fail-closed、返回
      现有 *AuditSink；接受度 A1-A3 postgres 导出 HeadHash==链头、
      --verify 0、篡改 1；B1-B2 广告端点不 404、弱 bearer 401、
      --from-url 无 --bearer → exit 2）
    - 已实证 seam：platform/audit/auditexport/auditexport.go:68-70
      QueryPager（文档明言 remote HTTP-backed adapter 可只实现此一方法）；
      infrastructure/postgres/audit_query.go:79 *AuditSink.Query 已存在
      （newest-first + Limit/Offset，与 sqlite 语义一致）；
      platform/audit/sqlite/sink.go:156-169 OpenReadOnly 契约注释（模板）；
      cmd/sso-ctl/auditverify/main.go:144 的 bearer 纪律（无 --bearer →
      exit 2）。
    - 环境：docker 容器 docker-db_postgres-1 正在运行（或按
      infrastructure/postgres/postgres_test.go:13 SSO_TEST_POSTGRES_DSN
      约定自建）；postgres 集成测试现有 skip 模式可参考。

    实现要求：
    1. 共享读取器 cmd/sso-ctl/auditstore/（REQ-5）：dialect 分类器
       （postgres://|postgresql:// vs sqlite）+ sqlite OpenReadOnly +
       postgres 非迁移只读 opener（schema 版本校验、fail-closed、
       命名诊断）+ QueryPager 面；audit-verify 与 audit-export 两命令
       复用同一 opener（REQ-5 协调：唯一 opener）。
    2. audit-verify 增加 --dsn（sqlite/postgres 双后端），行为与现有
       --from-url 路径并行；audit-export 增加 --dsn postgres 支持与
       --from-url 模式（远程 HTTP 适配器实现 QueryPager；弱/缺 bearer
       → exit 2，服务端 401）；--verify 路径不变。
    3. CLI 契约 + 文档：sso-ctl 帮助文本、docs/config-reference.md 或
       sso-ctl 相关文档、CHANGELOG Added 同提交更新。
    4. 测试（禁止 skip；postgres 不可达时如实报告 not_executed 及
       原因，但 sqlite 路径与 --from-url 服务端断言必须实跑）：
       - auditstore 分类器表驱动测试 + sqlite 读/倒序/分页测试
       - postgres e2e（A1-A3）：stock server audit.backend=postgres
         发 token → audit-export 导出 → HeadHash==链头 → --verify 0 →
         字节篡改 → --verify 1
       - --from-url（B1-B2）：广告端点 GET /api/v1/audit/events 不 404；
         无 bearer → 服务端 401 / CLI exit 2
       - 现有 auditverify/auditexport 测试全绿
    5. 验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./cmd/sso-ctl/... -count=1
       go test ./test/ -run 'AuditExport|AuditVerify|AuditDSN' -count=1
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
    6. 硬边界：audit 导出严格只读（永不迁移 schema）；零豁免；
       cmd/sso-ctl 目录预算（≤10 非测试 .go/目录）。
    conventional commit（imperative + AI co-author trailer）。
