# snaplink（IdP）B4 批次实施 campaign（G1 信任路径联合门禁）
# 前置：docs/proposals/audit-contract-batch-snaplink.md（提案）
# 批次内容（implementation-gate.md B4，HEAD b3c839bb 实证）：
#   1. token claims（S2）：buildAccessPayload 加 tenant_id（client 绑定解析）
#      + roles；kid 已存在不补；iss 配置化 allowlist（禁 Host 派生）
#   2. scope registry（P0-3）：注册 scope-matrix-v2 全表；未注册 → 400
#      invalid_scope
#   3. discovery 真值化（F-3）：token_endpoint=/token 等真实端点；
#      删除两个 legacy 缺陷测试（TestOIDCDiscovery 断言 /authenticate、
#      TestOIDCDiscoveryEndpoint 断言 8080:0），不带入部署仓；部署仓
#      补 sweep/真值断言；issuer allowlist
#   4. 端点加固（F-4/5/6/7/13）：Content-Type 强制 form-urlencoded（禁
#      JSON）、constant-time 比较；其余已存在（仅 body 解析/introspection
#      调用方认证/cc 无 refresh_token+no-store）
#   5. 治理连接器（P2）：outbox + auth.* in-tx（login 失败 post-commit
#      为唯一许可类）+ relay（复用 managed_relay.go）+ auth.token.issue
#      L1 聚合；stock audit.backend memory→sqlite/postgres + hash_chain
# 门禁：G1（B4-1+B1-1+B1-7 联合 T-1.1/T-1.2/T-8a）、G5（B4-2..5）
# 用法（snaplink 仓库内）：
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-snaplink-b4.yaml --dry-run
#   python3 pi-batch.py campaign --config docs/campaigns/campaign-snaplink-b4.yaml \
#     --jobs 4 --max-directions 2 --validate gobuild,gotest,pyquality

name: snaplink-b4-trust-path

discovery:
  roots:
    - interfaces
    - infrastructure
    - shared
    - platform
    - cmd
  exclude:
    - testdata
    - gen
    - generated
    - mock
    - tests
    - docs
    - examples
    - logs
    - vendor
    - .git
    - .pi-batch
    - __pycache__
    - ai-dev
  max_depth: 2
  fallback_top_level: true

analysis:
  jobs: 4
  retries: 2
  candidate_limit: 3
  prompt: |
    Analyze module '{module}' at {module_path} of snaplink (OAuth2/OIDC SSO
    SDK + sso-server). An approved contract (audit v2, GATE PASSED)
    assigns this repo batch B4 — the IdP half of the G1 trust-path gate:
    (1) token claims: buildAccessPayload (infrastructure/defaultimpl/
    issue_payload.go:26) must emit tenant_id (from client binding) and
    roles; kid already exists (no re-add); iss configurable allowlist
    (never Host-derived, resolveIssuer at interfaces/sso/
    server_discovery.go:251), (2) scope registry: register the full
    scope-matrix-v2 table; unregistered scope → 400 invalid_scope,
    (3) discovery truthiness: token_endpoint=/token etc real endpoints,
    delete the two legacy defect tests (TestOIDCDiscovery asserting
    /authenticate, TestOIDCDiscoveryEndpoint asserting the 8080:0 port
    bug) — never carry them into the deploy tree; deploy tree gets
    sweep/truthiness assertions, (4) endpoint hardening: Content-Type
    form-urlencoded enforced, constant-time comparisons (rest already
    exists: body-only parsing, introspection caller auth, cc no
    refresh_token + no-store), (5) governance connector (P2): outbox +
    auth.* in-tx (login-failure post-commit is the only permitted
    class) + relay reusing managed_relay.go + auth.token.issue L1
    aggregation; stock audit.backend memory→sqlite/postgres + hash_chain.
    Return ONLY a JSON array with at most {candidate_limit} high-value
    directions toward B4, sorted by value. Each object must contain:
    title, problem, value (1-10), risk_reduction (1-10), effort (1-10),
    confidence (1-10), evidence (existing file/symbol paths), and
    acceptance (testable checks mapping to T-2/T-8(a-e)/T-9).
    Do not modify code. Claims without repository evidence must be
    identified as proposed, not verified.

selection:
  max_directions: 2
  minimum_score: 0

implementation:
  pipeline: examples/repository-campaign-pipeline.yaml
  requirement_stage: requirements
  concurrency: 1
  timeout: 14400
  worktree_root: .pi-batch/worktrees

state:
  output_dir: docs/auto
  state_file: docs/auto/state.jsonl
  summary_file: docs/auto/SUMMARY.md
  line_max_bytes: 262144

estimates:
  analysis_minutes: 3
  pipeline_minutes: 25
