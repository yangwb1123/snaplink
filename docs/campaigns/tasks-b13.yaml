# B13 implementation batch: redirect-URI patterns (FAPI residual unblock) +
# FAPI module completion run + canary config apply + roadmap/matrix truthiness.
#
# Direction set (baseline verified 2026-08-16 at HEAD 1b2867c6):
#   1. Redirect-URI pattern support — the FAPI2 SP FINAL conformance module
#      ran 12 SUCCESS + 1 FAILURE (INTERRUPTED) at B12; the sole failure
#      (GetStaticClientConfiguration) is a proven protocol-level finding:
#      the module uses a STATIC client whose callback redirect URI is
#      dynamically generated per test instance
#      (https://localhost:8443/test/{testId}/callback) while snaplink's
#      IsRedirectURIValid (shared/core/types.go:379) is exact-match.
#      This direction adds OPT-IN per-client redirect-URI PATTERNS —
#      security-sensitive, design-first.
#   2. FAPI module completion run — depends on direction 1 landing; rerun
#      --fapi expecting the static-client failure to resolve; archive +
#      docs + ROADMAP P0 #2 truthiness.
#   3. Canary config apply — docs/deferred-backlog.md "Declarative
#      multi-cluster configuration governance" remaining boundary:
#      canary rollout / automated remediation (apply + rollback landed
#      B10-3; operator opt-in apply landed B11-1). Design + implement a
#      canary window with health-signal auto-rollback.
#   4. ROADMAP/feature-matrix truthiness sweep — ROADMAP P0 #2/#5 statuses
#      are stale after B7-B12 (FAPI 12/13 progress, nested-module migration
#      completed B9); feature-matrix rows for config apply/rollback and
#      per-client id_token alg are missing.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b13.yaml
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative. Files are referenced by PATH — read them with
#     your tools, do not expect them inlined.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report. Never claim a test
#     passed that you did not run.
#   - Engineering budgets: no file over 500 lines, no function over 50 lines
#     / cyclo 15, no new maintainability exemptions, no skipDirs /
#     layerExemptions additions, no layer violations.
#   - Update docs/config-reference.md + docs/openapi.yaml + CHANGELOG.md in
#     the same commit when a public contract changes.
#   - Commit with a conventional imperative message + AI co-author trailer.
#     The post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库。任务：实现每客户端 redirect-URI 模式匹配（可选、
    安全敏感、设计先行）。这是 FAPI2 SP FINAL conformance 模块唯一
    剩余失败的解锁路径。

    契约（先读，后实现，契约优先于本提示）：
    - docs/campaigns/reports/b12-fapi-conformance.md（12 SUCCESS +
      1 FAILURE + INTERRUPTED；失败项 GetStaticClientConfiguration：
      模块硬编码静态客户端、回调 redirect 为每测试实例动态生成
      https://localhost:8443/test/{testId}/callback；snaplink
      IsRedirectURIValid 精确匹配无法预注册）
    - test/oidc-conformance/results/07832dda-fapi/BLOCKER.md（根因与
      下一步建议）
    - shared/core/types.go:26,378-（Client.RedirectURIs 字段与
      IsRedirectURIValid 精确匹配实现；AGENTS.md 记录
      "exact-match enforced at shared/core/types.go:369-370"）
    - protocols/oauth/handle_register.go（DCR 字段解析与校验）
    - config/config_client.go（静态配置 clients[] 解析）
    - AGENTS.md §3（OAuth/OIDC 不变量；redirect_uri 校验是开放重定向
      攻击面——模式匹配必须不削弱默认精确匹配）

    第一步——设计文档（必须先写）：
    docs/design/redirect-uri-patterns.md，必须裁决：
    1. 数据模型：新字段（如 RedirectURIPatterns []string，与
       RedirectURIs 并列、独立于精确列表）；DCR 字段名（RFC 7591 无
       此属性——自定义名，明确标记为 snaplink 扩展）与静态配置键；
       两列表的关系（任一匹配即有效；默认零模式 = 现状逐字节不变）。
    2. 模式语法（安全核心，必须严格）：
       - 仅 https（与现有校验一致；本地回环例外按现有纪律）；
       - 通配符位置限制：仅限 path 的单个路径段（如
         https://host/test/*/callback），禁止 host 通配（除明确
         裁决的子域场景）、禁止跨段 *、禁止 * 出现在 query/fragment、
         禁止无前缀裸 *；
       - 规范化：模式与 URI 均按现有规范化规则处理后匹配；
       - 拒绝危险形态的校验（如 // 逃逸、userinfo、端口歧义）。
    3. 校验时机：配置加载（fail-closed 拒绝非法模式）+ DCR 注册 +
       更新；非法模式 → 400/配置错误，命名模式字段。
    4. 安全评审：开放重定向风险分析（谁可注册模式——DCR 与静态配置
       的管理门槛；模式匹配后的最终 redirect 目标仍须满足 OAuth 语义；
       PKCE 不受影响）；对抗样例表（须在测试中覆盖：不匹配、跨段、
       大小写、编码绕过）。
    5. FAPI 适配：静态客户端注册的模式形状（以模块实际动态 URI 为
       准，从归档日志核实）；harness config-fapi.yaml 增补。
    6. 验收断言（可测试）：精确列表行为不变（既有测试全绿）；模式
       命中/未命中矩阵；非法模式拒绝；DCR 往返；FAPI 静态客户端
       预注册后匹配动态回调。

    第二步——实现（按设计）：
    1. 字段 + 校验 + 匹配实现（shared/core 纯函数 + 客户端存储
       sqlite/postgres 迁移若需持久化）+ DCR + 静态配置 + openapi +
       config-reference + CHANGELOG。
    2. 测试（禁止 skip）：匹配器表驱动测试（含对抗样例）+ 集成测试
       （DCR 注册带模式客户端 → 登录回调断言）+ 既有 redirect 测试
       全绿 + fuzz（如仓库有 fuzz 先例可加）。
    3. 验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./shared/core/... ./protocols/oauth/... ./config/... -count=1
       go test ./interfaces/sso/... -run 'Redirect|Login|Register' -count=1
       go test ./test/ -run 'Redirect|PKCE|Login' -count=1
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
       python3 cli.py check-routes && python3 cli.py sdk-surface check
    4. conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b13-redirect-uri-patterns.md
  timeout: 2400
  validate: |
    go build ./... && go vet ./... && go test ./shared/core/... ./protocols/oauth/... -count=1 && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

