# B8 implementation batch: HTTPS conformance evidence + ssoext authenticator
# registrars + prototype/minimal physical extraction.
#
# Direction set (baseline verified 2026-08-15 at HEAD 7400ba0c):
#   1. Conformance HTTPS-topology run + stale-docs sweep — ROADMAP P0 #2
#      executable remainder. B7-1 already pinned the suite image
#      (release-v5.2.1), made the run headless and archived 59 SUCCESS + 1
#      expected failure at results/af3bc485/. The HTTPS scaffold exists
#      (nginx suite-proxy on 8443, certs/, drive_test.py BASE), but the
#      ISSUER is still http://sso-issuer:8180 and two docs still carry
#      pre-B7 claims ("unpinned image", "interactive", "no committed pass
#      report").
#   2. ssoext authenticator-family registrars — docs/deferred-backlog.md
#      "Nested protocol/infrastructure modules" remaining work: only SAML
#      has a typed registrar (interfaces/ssoext/saml_registry.go, 144
#      lines); LDAP/Kerberos/RADIUS have none. SAML is the committed
#      pattern.
#   3. prototype/minimal physical extraction — README/DIRECTORY_MAP/
#      deferred-backlog open boundary: "package-level isolation remains an
#      extraction target"; `python cli.py profiles evidence` already proves
#      small vs full isolation (97 vs 193 packages) but prototype and
#      minimal still share ONE cmd/sso-minimal package graph.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b8.yaml
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative. Files are referenced by PATH — read them with
#     your tools, do not expect them inlined.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report (table of commands
#     with real results; never claim a test passed that you did not run).
#   - Engineering budgets: no file over 500 lines, no function over 50 lines
#     / cyclo 15, no new maintainability exemptions, no skipDirs /
#     layerExemptions additions, no layer violations (architecture gate;
#     nested modules with their own go.mod are outside the root gate).
#   - Update docs/config-reference.md + CHANGELOG.md in the same commit when
#     a public contract changes.
#   - Commit with a conventional imperative message + AI co-author trailer.
#     The post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库。任务：conformance HTTPS 拓扑运行 + 过时文档清扫
    （ROADMAP P0 #2 的剩余可执行部分）。

    背景（已实证，勿重复诊断）：
    - B7-1 已交付：套件镜像 pinned release-v5.2.1、run-headless.sh 可
      headless 运行、results/af3bc485/ 归档（59 SUCCESS + 1 预期失败
      VerifyClientManagementCredentials：http-only 拓扑下
      "URL for client management point does not use https scheme"）。
    - HTTPS 脚手架已存在：docker-compose.yml 的 suite-proxy（nginx，
      host 8443→443，certs/server.crt+key 自签证书，X-Forwarded-Proto
      https）；drive_test.py BASE=https://localhost:8443。
    - 缺口：被测 ISSUER 仍是 http://sso-issuer:8180（套件拒绝非 https
      的 issuer）；两处文档仍携带 B7-1 之前的过时声明。

    契约（先读）：
    - test/oidc-conformance/README.md（头部 "No conformance claim" 块已
      过时："not part of make ci, requires browser interaction, and has
      no committed pass report" —— headless 运行 + 归档 + 提交报告均已成
      立；"uses an unpinned conformance image" 也不成立）
    - docs/deferred-backlog.md "Official protocol certification" 段
      （"unpinned conformance image"、"interactive"、"not part of default
      CI" 均过时）
    - docs/sso/oidc-conformance.md（B7-1 已更新的真值基线）

    执行要求：
    1. HTTPS issuer 拓扑：在 sso-server 前加 TLS 终结（复用 certs/ 与
       nginx 模式，新增 issuer-proxy 服务或等效；自签证书、本地拓扑），
       ISSUER_URL 指向 https；保持 pinned tag、healthcheck、模块
       allowlist 不变。
    2. 运行 HTTPS 拓扑 headless（如 run-headless.sh 需要 --issuer-https
       或等效参数则扩展脚本，保持 HTTP 路径字节不变）；如实报告统计。
       预期：VerifyClientManagementCredentials 从 FAIL 翻转为 PASS
       （https issuer 满足 https-URI 要求）；若未翻转，如实记录并分析。
    3. 归档 results/<commit>-https/（plan/log/info/worktree；目录
       gitignore 本地留存）；与 af3bc485 HTTP 基线对比。
    4. 文档真值化（同一提交）：README.md 头部重写为真实状态（headless
       可运行、CI 外、有提交归档、无认证声明——"Implemented ≠ certified"
       边界保留）；deferred-backlog "Official protocol certification" 段
       更新（pinned image、headless harness、归档结果、剩余边界=外部可
       达 HTTPS 发行者官方运行 + OIDF listing）；docs/sso/oidc-
       conformance.md 增补 HTTPS 拓扑运行记录。
    5. 硬边界：不修改生产代码；不改模块 allowlist；不把 harness 挂入
       make ci（保持 CI 外，除非 README 已承诺——README 现声明为 CI 外，
       维持不变）。
    6. 验证命令（必须实际运行并报告输出）：
       cd test/oidc-conformance && ./run-headless.sh --timeout 900
       go build ./... && go vet ./...
       git status --porcelain
    7. conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b8-conformance-https.md
  timeout: 2400
  validate: |
    python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

