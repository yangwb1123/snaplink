# Next implementation batch (B5): backlog adjudications and approved designs.
#
# Direction set (each has a committed contract):
#   1. SMTP implicit TLS (port 465) — adjudicated deferred follow-up in
#      infrastructure/defaultimpl/emailsmtp (transport.go/config.go comments)
#      and docs/deferred-backlog.md "SMTP transport".
#   2. gRPC plane observability + TLS defaults — docs/design/
#      grpcserver-observability-tls.md (+ protocol/qa reviews).
#   3. grpcadmin List keyset pagination — docs/design/
#      admin-list-keyset-pagination.md.
#
# Run from the snaplink repo root:
#   python ~/ai-batch-runner/pi-batch.py docs/campaigns/tasks-b5.yaml
#
# Rules for every task:
#   - Read the referenced contract(s) FIRST; the acceptance assertions in
#     them are authoritative.
#   - After implementing, ACTUALLY run the listed verification commands and
#     report their real output in the completion report. Never claim a test
#     passed that you did not run.
#   - Keep the engineering budgets: no file over 500 lines, no function over
#     50 lines / cyclo 15, no new maintainability exemptions, no skipDirs /
#     layerExemptions additions. Update docs/config-reference.md + CHANGELOG.md
#     when a config key or contract changes.
#   - Commit your changes with a conventional imperative message + AI
#     co-author trailer (per AGENTS.md). Never commit binaries. The
#     post-commit hook syncs the branch upstream automatically.
tasks:
- prompt: |
    你在 snaplink 仓库（OAuth2/OIDC SSO SDK + sso-server）。任务：实现已裁决的
    SMTP implicit TLS 支持（deferred follow-up）。

    契约（先读，后实现）：
    - @/home/u1/workspace/demo/snaplink/docs/deferred-backlog.md 的
      "SMTP transport" 段（Implicit TLS on port 465 is not supported;
      require TLS at the relay/edge when plaintext fallback is unacceptable）。
    - @/home/u1/workspace/demo/snaplink/infrastructure/defaultimpl/emailsmtp/transport.go
      与 config.go 顶部注释：裁决范围是 v1 只补 implicit TLS（465，
      crypto/tls.Dial 分支 keyed on cfg.Port==465），STARTTLS(587)/明文(25)
      行为保持现状不回归。

    实现要求：
    1. transport 层加 implicit TLS 支持：端口 465（或显式 TLS 模式配置）时
       用 crypto/tls.Dial 建立 TLS 连接再走 SMTP 会话；STARTTLS 仍由
       net/smtp.SendMail 自动协商（现状不变）。TLS 配置（ServerName、
       MinVersion）按部署契约设置，禁止 InsecureSkipVerify 默认值。
    2. 配置：新增/明确 smtp 的 TLS 相关配置键（如 tls_mode 或按 port 自动
       判定，二选一并向 config-reference 说明），保持现有键兼容；
       smtp.enabled=false / 空 host 行为字节不变。
    3. 测试：扩展 transport_test.go —— implicit TLS 分支（mock TLS SMTP
       服务或 dial 注入）、465 端口自动启用、非 465 行为不回归、TLS 握手
       失败 fail-closed（不降级明文）。禁止跳过测试。
    4. 契约同步：docs/config-reference.md 的 smtp 小节 + CHANGELOG.md
       （Added）同一提交内更新。
    5. 验证命令（必须实际运行并报告输出）：
       go build ./... && go vet ./...
       go test ./infrastructure/defaultimpl/emailsmtp/... -count=1
       go test ./test/ -run 'SendCode|Email' -count=1
       go test -count=1 -run 'TestMaintainability_|TestArchitecture_|TestDirectory' .
    6. conventional commit（imperative + AI co-author trailer）。
  output: docs/campaigns/reports/b5-smtp-implicit-tls.md
  timeout: 1500
  validate: |
    go test ./infrastructure/defaultimpl/emailsmtp/... -count=1 && go build ./... && python3 /home/u1/ai-batch-runner/scripts/check-no-refusal.py {output}

- prompt: |
    你在 snaplink 仓库。任务：实现 gRPC 面的运维可观测性 + TLS 默认
    （已评审的设计，contract 见下）。

    契约（先读，后实现）：
    - @/home/u1/workspace/demo/snaplink/docs/design/grpcserver-observability-tls.md
      （设计主文档，含逐条现状验证与决策）
    - @/home/u1/workspace/demo/snaplink/docs/design/grpcserver-observability-tls-protocol-review.md
      与 -qa-review.md（评审结论若与主文档冲突，以评审修正为准）

    实现范围（按设计）：
    1. gRPC listener 注册 health service（grpc_health_v1）与 reflection，
       零新增外部依赖（grpc 模块内自带）。
    2. per-RPC 可观测性拦截器：指标（RPC 名/状态/耗时）与追踪（trace_id
