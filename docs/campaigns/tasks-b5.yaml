    5. 测试：health/reflection 可用性、拦截器指标与追踪注入、TLS
       fail-closed 判定；禁止跳过。
    6. 契约同步：docs/observability.md（如涉及）+ CHANGELOG.md 同提交更新。
    7. 验证命令（必须实际运行并报告输出）：
