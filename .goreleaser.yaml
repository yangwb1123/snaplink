# goreleaser config — drives binary distribution at release time.
#
# Local snapshot (no tag needed, no publish):
#   make release-snapshot
#
# Real release (CI, triggered by `git push origin vX.Y.Z`):
#   the .github/workflows/release.yml job runs `goreleaser release`
#   against the tag and uploads archives, SBOMs, signatures, and images.

version: 2

project_name: sso-server

before:
  hooks:
    # Ensure go.sum is in sync — releases must not introduce drift.
    - go mod tidy -diff

builds:
  - id: snaplink-prototype
    main: ./cmd/sso-minimal
    binary: snaplink
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
      - -mod=readonly
      - -modfile={{ .Env.SNAPLINK_PROFILE_RELEASE_ROOT }}/prototype/{{ .Os }}_{{ .Arch }}/modules.mod
      - -overlay={{ .Env.SNAPLINK_PROFILE_RELEASE_ROOT }}/prototype/{{ .Os }}_{{ .Arch }}/overlay.json
    tags: [snaplink_configured]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    hooks:
      post:
        - cmd: >-
            python ops/scripts/profile_release.py verify-binary
            --profile prototype --target {{ .Os }}/{{ .Arch }}
            --binary {{ .Path }}
            --evidence-root {{ .Env.SNAPLINK_PROFILE_RELEASE_ROOT }}
            --archive-root dist/profile-evidence
          output: true
    overrides:
      - goos: linux
        goarch: amd64
        ldflags:
          - -s -w
          - -X github.com/yangwb1123/snaplink/platform/buildinfo.BuildProfile=prototype
          - -X github.com/yangwb1123/snaplink/platform/buildinfo.ModuleLockDigest={{ .Env.SNAPLINK_RELEASE_PROTOTYPE_LINUX_AMD64_LOCK_DIGEST }}
          - -X github.com/yangwb1123/snaplink/platform/buildinfo.CompiledModules={{ .Env.SNAPLINK_RELEASE_PROTOTYPE_MODULES }}
