      - -X github.com/yangwb1123/snaplink/shared/core.BuildVersion=v{{ .Version }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildTime={{ .Date }}
      - -X github.com/yangwb1123/snaplink/shared/core.GitHash={{ .FullCommit }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildModified={{ .IsGitDirty }}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: snaplink-audit-provisioner
    main: ./cmd/snaplink-audit-provisioner
    binary: snaplink-audit-provisioner
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/yangwb1123/snaplink/shared/core.BuildVersion=v{{ .Version }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildTime={{ .Date }}
      - -X github.com/yangwb1123/snaplink/shared/core.GitHash={{ .FullCommit }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildModified={{ .IsGitDirty }}
    goos: [linux]
    goarch: [amd64, arm64]

  - id: sso-mcp
    # SSO MCP protocol gateway — exposes SSO resources via the Model Context
    # Protocol (MCP). Pure-Go, no-CGO build, same matrix as sso-ctl.
    # This command owns a nested module; build from that module root.
    dir: ./cmd/sso-mcp
    main: .
    binary: sso-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - sso-server
      - sso-ctl
      - snaplink-stripe-adapter
      - snaplink-audit-provisioner
      - sso-mcp
    # Linux additionally carries the separately deployed service binaries.
    allow_different_binary_count: true
    # tar.gz everywhere except Windows (zip — Powershell unpacks it
    # natively without extra tools).
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - CHANGELOG.md

  - id: snaplink-prototype
    ids: [snaplink-prototype]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      snaplink_prototype_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - docs/RELEASE.md
      - src: "dist/profile-evidence/prototype/{{ .Os }}_{{ .Arch }}/modules.lock.json"
        dst: evidence/modules.lock.json
      - src: "dist/profile-evidence/prototype/{{ .Os }}_{{ .Arch }}/profile-inventory.json"
        dst: evidence/profile-inventory.json
      - src: "dist/profile-evidence/prototype/{{ .Os }}_{{ .Arch }}/binary-evidence.json"
        dst: evidence/binary-evidence.json

  - id: snaplink-minimal
    ids: [snaplink-minimal]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      snaplink_minimal_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - docs/RELEASE.md
      - src: "dist/profile-evidence/minimal/{{ .Os }}_{{ .Arch }}/modules.lock.json"
        dst: evidence/modules.lock.json
      - src: "dist/profile-evidence/minimal/{{ .Os }}_{{ .Arch }}/profile-inventory.json"
        dst: evidence/profile-inventory.json
      - src: "dist/profile-evidence/minimal/{{ .Os }}_{{ .Arch }}/binary-evidence.json"
        dst: evidence/binary-evidence.json

  - id: snaplink-full
    ids: [snaplink-full]
    formats: [tar.gz]
    name_template: >-
      snaplink_full_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - docs/RELEASE.md
      - src: "dist/profile-evidence/full/{{ .Os }}_{{ .Arch }}/modules.lock.json"
        dst: evidence/modules.lock.json
      - src: "dist/profile-evidence/full/{{ .Os }}_{{ .Arch }}/profile-inventory.json"
        dst: evidence/profile-inventory.json
      - src: "dist/profile-evidence/full/{{ .Os }}_{{ .Arch }}/binary-evidence.json"
        dst: evidence/binary-evidence.json

  - id: snaplink-billing
    ids: [snaplink-billing]
    formats: [tar.gz]
    name_template: >-
      snaplink_billing_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - docs/RELEASE.md
      - src: "dist/profile-evidence/billing/{{ .Os }}_{{ .Arch }}/modules.lock.json"
        dst: evidence/modules.lock.json
      - src: "dist/profile-evidence/billing/{{ .Os }}_{{ .Arch }}/profile-inventory.json"
        dst: evidence/profile-inventory.json
      - src: "dist/profile-evidence/billing/{{ .Os }}_{{ .Arch }}/binary-evidence.json"
        dst: evidence/binary-evidence.json

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Snapshot template fires when `goreleaser release --snapshot` runs
# without a tag — embeds the short commit so two snapshots of the same
# version don't collide.
snapshot:
  version_template: "{{ .Env.SNAPLINK_PROFILE_RELEASE_SNAPSHOT_VERSION }}"

# Software Bill of Materials. The release workflow installs syft; one SBOM per
# archive lands beside the tarball + checksums, in SPDX-JSON format. Auditors
# and supply-chain scanners (Trivy, Grype, Dependency-Track) ingest it directly.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    # The "interesting commits" filter — docs / chore / test / ci
    # commits are noise in a release announcement.
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "^deploy:"
      - "merge "
      - "^typo"

release:
  # Enabled: GitHub Releases receives the binary archives when a vX.Y.Z tag
  # is pushed. The release.yml workflow + GITHUB_TOKEN handle the upload.
  # To opt out (dry-run only), temporarily flip back to `disable: true`.
  disable: false

# Docker multi-arch image, published alongside binary archives.
# Requires GITHUB_TOKEN with packages:write scope (already set in release.yml).
dockers:
  - image_templates:
      - "ghcr.io/snaplink/sso-server:{{ .Version }}"
      - "ghcr.io/snaplink/sso-server:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--label=org.opencontainers.image.title=sso-server"
      - "--label=org.opencontainers.image.description=Snaplink SSO server"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--build-arg=VERSION=v{{ .Version }}"
      - "--build-arg=BUILD_TIME={{ .Date }}"
      - "--build-arg=GIT_HASH={{ .FullCommit }}"
      - "--build-arg=BUILD_MODIFIED={{ .IsGitDirty }}"

  - image_templates:
      - "ghcr.io/snaplink/sso-mcp:{{ .Version }}"
      - "ghcr.io/snaplink/sso-mcp:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--target=sso-mcp"
      - "--label=org.opencontainers.image.title=sso-mcp"
      - "--label=org.opencontainers.image.description=Snaplink SSO MCP gateway"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - image_templates:
      - "ghcr.io/snaplink/snaplink-billing:{{ .Version }}"
      - "ghcr.io/snaplink/snaplink-billing:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--target=snaplink-billing"
      - "--label=org.opencontainers.image.title=snaplink-billing"
      - "--label=org.opencontainers.image.description=Snaplink tenant commerce and metering service"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - image_templates:
      - "ghcr.io/snaplink/snaplink-stripe-adapter:{{ .Version }}"
      - "ghcr.io/snaplink/snaplink-stripe-adapter:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--target=snaplink-stripe-adapter"
      - "--label=org.opencontainers.image.title=snaplink-stripe-adapter"
      - "--label=org.opencontainers.image.description=Snaplink Stripe payment adapter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

  - image_templates:
      - "ghcr.io/snaplink/snaplink-audit-provisioner:{{ .Version }}"
      - "ghcr.io/snaplink/snaplink-audit-provisioner:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--target=snaplink-audit-provisioner"
      - "--label=org.opencontainers.image.title=snaplink-audit-provisioner"
      - "--label=org.opencontainers.image.description=Snaplink Audit Governance desired-state provisioner"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

# Keyless cosign signing via Sigstore + the workflow's OIDC token.
# Requires the release workflow to have `id-token: write` permission
# (already set in release.yml). Signatures are uploaded alongside
# artifacts for end-user verification.
signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: all
    output: true

# Container image signing — cosign signs each pushed image with the
# OIDC token from the release workflow (keyless mode). Verification:
#   cosign verify ghcr.io/snaplink/sso-server:{{ .Version }}
docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}"
