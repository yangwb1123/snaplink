# goreleaser config — drives binary distribution at release time.
#
# Local snapshot (no tag needed, no publish):
#   make release-snapshot
#
# Real release (CI, triggered by `git push origin vX.Y.Z`):
#   the .github/workflows/release.yml job runs `goreleaser release`
#   against the tag and uploads artifacts to the configured target.
#   Today release.disable=true keeps that target empty until a git
#   remote + GitHub Releases (or a private registry) is wired.

version: 2

project_name: sso-server

before:
  hooks:
    # Ensure go.sum is in sync — releases must not introduce drift.
    - go mod tidy

builds:
  - id: sso-server
    main: ./cmd/sso-server
    binary: sso-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yangwb1123/snaplink/shared/core.BuildVersion=v{{ .Version }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildTime={{ .Date }}
      - -X github.com/yangwb1123/snaplink/shared/core.GitHash={{ .FullCommit }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildModified={{ .IsGitDirty }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Skip windows/arm64 — sso-server has no users on that combo yet
    # and it inflates the matrix from 6 → 6 binaries unnecessarily
    # (matrix is now: linux x 2, darwin x 2, windows x 1 = 5).
    ignore:
      - goos: windows
        goarch: arm64

  - id: sso-ctl
    # Offline operator toolbelt (audit-verify / import / migrate / snapshot
    # subcommands). Same pure-Go, no-CGO build as sso-server.
    main: ./cmd/sso-ctl
    binary: sso-ctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yangwb1123/snaplink/shared/core.BuildVersion=v{{ .Version }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildTime={{ .Date }}
      - -X github.com/yangwb1123/snaplink/shared/core.GitHash={{ .FullCommit }}
      - -X github.com/yangwb1123/snaplink/shared/core.BuildModified={{ .IsGitDirty }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sso-mcp
    # SSO MCP protocol gateway — exposes SSO resources via the Model Context
    # Protocol (MCP). Pure-Go, no-CGO build, same matrix as sso-ctl.
    main: ./cmd/sso-mcp
    binary: sso-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    # tar.gz everywhere except Windows (zip — Powershell unpacks it
    # natively without extra tools).
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - .github/SECURITY.md
      - docs/CHANGELOG.md  # autogenerated below; goreleaser includes if present

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Snapshot template fires when `goreleaser release --snapshot` runs
# without a tag — embeds the short commit so two snapshots of the same
# version don't collide.
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# Software Bill of Materials. syft is bundled with goreleaser; one SBOM
# per archive lands beside the tarball + checksums, in SPDX-JSON format
# (the most widely consumed SBOM flavor). Auditors / supply-chain
# scanners (Trivy, Grype, Dependency-Track) ingest these directly.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    # The "interesting commits" filter — docs / chore / test / ci
    # commits are noise in a release announcement.
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "^deploy:"
      - "merge "
      - "^typo"

release:
  # Enabled: GitHub Releases receives the binary archives when a vX.Y.Z tag
  # is pushed. The release.yml workflow + GITHUB_TOKEN handle the upload.
  # To opt out (dry-run only), temporarily flip back to `disable: true`.
  disable: false

# Docker multi-arch image, published alongside binary archives.
# Requires GITHUB_TOKEN with packages:write scope (already set in release.yml).
dockers:
  - image_templates:
      - "ghcr.io/snaplink/sso-server:{{ .Version }}"
      - "ghcr.io/snaplink/sso-server:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--label=org.opencontainers.image.title=sso-server"
      - "--label=org.opencontainers.image.description=Snaplink SSO server"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--build-arg=VERSION=v{{ .Version }}"
      - "--build-arg=BUILD_TIME={{ .Date }}"
      - "--build-arg=GIT_HASH={{ .FullCommit }}"
      - "--build-arg=BUILD_MODIFIED={{ .IsGitDirty }}"

  - image_templates:
      - "ghcr.io/snaplink/sso-mcp:{{ .Version }}"
      - "ghcr.io/snaplink/sso-mcp:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--target=sso-mcp"
      - "--label=org.opencontainers.image.title=sso-mcp"
      - "--label=org.opencontainers.image.description=Snaplink SSO MCP gateway"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"

# Keyless cosign signing via Sigstore + the workflow's OIDC token.
# Requires the release workflow to have `id-token: write` permission
# (already set in release.yml). Signatures are uploaded alongside
# artifacts for end-user verification.
signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "${artifact}"
    artifacts: all
    output: true

# Container image signing — cosign signs each pushed image with the
# OIDC token from the release workflow (keyless mode). Verification:
#   cosign verify ghcr.io/snaplink/sso-server:{{ .Version }}
docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}"
