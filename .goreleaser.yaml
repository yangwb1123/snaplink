          - -X github.com/yangwb1123/snaplink/shared/core.BuildVersion=v{{ .Version }}
          - -X github.com/yangwb1123/snaplink/shared/core.BuildTime={{ .Date }}
          - -X github.com/yangwb1123/snaplink/shared/core.GitHash={{ .FullCommit }}
          - -X github.com/yangwb1123/snaplink/shared/core.BuildModified={{ .IsGitDirty }}
