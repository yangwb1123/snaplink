# Supply Chain Security Policy
#
# Defines the governance rules for dependency management, license compliance,
# and automated CVE remediation. The CI pipeline enforces these rules.
#
# Policy version: 1 (2026-07-01)
# Applies to: root go.mod + all 12 nested modules

# ── Dependency freshness SLA ─────────────────────────────────────────
# Maximum allowed age (in days) from the latest release of a direct
# dependency before the CI marks it stale. This is NOT a hard deadline
# — it flags packages whose latest release is more than N days old as
# candidates for audit or replacement.
freshness_sla_days: 365

# ── Auto-merge rules (for Dependabot / Renovate PRs) ─────────────────
auto_merge:
  # Automatically merge security patch updates when CI passes.
  security_patches: true
  # Automatically merge non-security patch updates (minor, patch).
  routine_patches: true
  # Never auto-merge major version bumps (require human review).
  major_version_human_review: true

# ── License gate ─────────────────────────────────────────────────────
# Allowed license identifiers (SPDX). Any dependency not matching one
# of these is flagged in CI. The list is deliberately restrictive —
# if your deployment requires a license not on this list, file an
# exception request with the security team.
license_gate:
  allow:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - Unlicense
    - MPL-2.0
  deny:
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
    - BUSL-1.1

# ── Vulnerability severity thresholds ────────────────────────────────
# CVSS score thresholds that trigger different CI actions.
vulnerability:
  # CVSS >= critical_score → hard block the PR/commit.
  critical_score: 9.0
  # CVSS >= high_score → CI warning + mandatory review.
  high_score: 7.0
  # CVSS >= medium_score → CI warning only.
  medium_score: 4.0
